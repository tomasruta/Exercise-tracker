<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strength">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Strength</title>
<style>
/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
input, textarea, button, select { font-family: inherit; font-size: inherit; }

/* ===== THEME ===== */
:root {
  --bg: #f8f9fa;
  --bg-card: #ffffff;
  --bg-input: #f0f0f0;
  --text: #1a1a1a;
  --text2: #666;
  --text3: #999;
  --border: #e0e0e0;
  --accent: #2563eb;
  --green: #16a34a;
  --green-bg: #dcfce7;
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --red: #dc2626;
  --red-bg: #fee2e2;
  --ss-color: #6366f1;
  --ss-bg: #eef2ff;
  --fence-color: #f59e0b;
  --fence-bg: #fffbeb;
  --new-badge: #8b5cf6;
  --equip-badge: #b45309;
  --workouts-badge: #e2e8f0; /* light slate — "also in these workouts" pills, distinct from equip/SS/new */
  --location-badge: #0f766e; /* deep green — "U žen" gym-area location pills (Max Fitness Flora women's area) */
  color-scheme: light; /* always light — never follow system dark mode */
}

/* ===== LAYOUT ===== */
#app { max-width: 500px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom, 20px); }
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
}
.header h1 { font-size: 1.1rem; font-weight: 600; flex: 1; }
.session-clock { font-size: 0.8rem; color: var(--text2); margin-top: 2px; }
/* Exercise-page header is tight at 375px — drop "Started HH:MM", keep the running total, don't wrap. */
.session-clock-compact {
  margin-top: 0; flex-shrink: 0; font-variant-numeric: tabular-nums;
  font-weight: 600; white-space: nowrap;
}
.back-btn {
  background: var(--bg-card); border: 1px solid var(--border); color: var(--accent);
  font-size: 1rem; font-weight: 600; cursor: pointer; padding: 8px 14px; border-radius: 10px;
  min-width: 44px; min-height: 44px; display: flex; align-items: center; gap: 4px;
}
.content { padding: 16px; }

/* ===== HOME ===== */
.workout-grid { display: flex; flex-direction: column; gap: 12px; }
.workout-btn {
  display: flex; align-items: center; gap: 14px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
  cursor: pointer; text-align: left; width: 100%;
  min-height: 64px; transition: background 0.15s;
}
.workout-btn:active { background: var(--bg-input); }
.workout-next { border-color: var(--accent); border-width: 2px; box-shadow: 0 0 0 1px var(--accent); }
.workout-id {
  font-size: 1.3rem; font-weight: 700; color: var(--accent);
  min-width: 40px;
}
.workout-info { flex: 1; }
.workout-name { font-size: 0.95rem; font-weight: 600; display: block; }
.workout-sub { font-size: 0.8rem; color: var(--text2); margin-top: 2px; }
.home-actions { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
.btn {
  display: block; width: 100%; padding: 14px;
  border: none; border-radius: 10px; font-size: 1rem;
  font-weight: 600; cursor: pointer; text-align: center;
  min-height: 48px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
.btn-success { background: var(--green); color: #fff; }
.btn-amber { background: var(--amber); color: #fff; }
.btn:active { opacity: 0.85; }

/* ===== WORKOUT LIST ===== */
.exercise-list { display: flex; flex-direction: column; gap: 2px; }
.ss-group {
  border-left: 3px solid var(--ss-color);
  background: var(--ss-bg);
  border-radius: 0 10px 10px 0;
  margin: 4px 0;
}
.ss-label {
  font-size: 0.7rem; font-weight: 700; color: var(--ss-color);
  padding: 4px 10px 0; text-transform: uppercase; letter-spacing: 0.5px;
}
.ex-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; cursor: pointer;
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  min-height: 52px;
}
.ss-group .ex-row { background: transparent; border-bottom: 1px solid var(--border); }
.ss-group .ex-row:last-child { border-bottom: none; }
.ex-num { font-size: 0.8rem; color: var(--text3); min-width: 22px; text-align: right; }
.ex-info { flex: 1; min-width: 0; }
.ex-name { font-size: 0.95rem; font-weight: 500; }
.ex-meta { font-size: 0.8rem; color: var(--text2); margin-top: 2px; }
.ex-status { font-size: 1.1rem; min-width: 28px; text-align: center; }
.badge {
  display: inline-block; font-size: 0.65rem; font-weight: 700;
  padding: 1px 5px; border-radius: 4px; vertical-align: middle; margin-left: 4px;
}
.badge-new { background: var(--new-badge); color: #fff; }
.badge-ss { background: var(--ss-color); color: #fff; }
.badge-equip { background: var(--equip-badge); color: #fff; }
.badge-workouts { background: var(--workouts-badge); color: #64748b; font-size: 0.6rem; padding: 1px 4px; letter-spacing: 0.02em; }
.badge-location { background: var(--location-badge); color: #fff; }

/* ===== MALTO FENCE ===== */
.malto-fence {
  display: flex; align-items: center; gap: 10px;
  background: var(--fence-bg); border: 2px solid var(--fence-color);
  border-radius: 10px; padding: 10px 14px; margin: 10px 0;
  font-weight: 700; font-size: 0.85rem; color: var(--fence-color);
}

/* ===== EXERCISE DETAIL ===== */
.ex-detail { padding-bottom: 100px; }
.ex-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
.ex-target { font-size: 1rem; color: var(--text2); margin-bottom: 12px; }
.cue-section {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; margin-bottom: 12px;
}
.cue-toggle {
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; font-weight: 600; font-size: 0.9rem;
  background: none; border: none; width: 100%; text-align: left;
  color: var(--text); padding: 0;
}
.cue-toggle::after { content: '▼'; font-size: 0.7rem; color: var(--text3); transition: transform 0.2s; }
.cue-section.collapsed .cue-toggle::after { transform: rotate(-90deg); }
.cue-body { margin-top: 8px; font-size: 0.85rem; color: var(--text2); line-height: 1.5; }
.cue-section.collapsed .cue-body { display: none; }
.cue-label { font-weight: 700; font-size: 0.8rem; color: var(--text); margin: 8px 0 2px; text-transform: uppercase; letter-spacing: 0.03em; }
.cue-label:first-child { margin-top: 0; }
.cue-list { margin: 0; padding-left: 1.2em; }
.cue-list li { margin-bottom: 2px; }
.cue-list.mistakes { list-style: none; padding-left: 0; }
.cue-list.mistakes li::before { content: '❌ '; }
.cue-list.you { list-style: none; padding-left: 0; color: var(--text3); font-style: italic; }
.cue-list.you li::before { content: '→ '; }
.chop-direction { display: inline-block; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
.chop-direction:active { opacity: 0.7; }
.last-session {
  background: var(--bg-input); border-radius: 10px;
  padding: 12px; margin-bottom: 16px; font-size: 0.85rem;
}
.last-session-title { font-weight: 600; margin-bottom: 4px; color: var(--text2); }

/* ===== SET INPUTS ===== */
.sets-header {
  display: grid; grid-template-columns: 50px 1fr 30px 1fr;
  gap: 8px; padding: 0 4px 6px; font-size: 0.75rem;
  color: var(--text3); font-weight: 600; text-transform: uppercase;
}
.set-row {
  display: grid; grid-template-columns: 50px 1fr 30px 1fr;
  gap: 8px; align-items: center; margin-bottom: 8px;
}
.set-label {
  font-size: 0.85rem; font-weight: 600; color: var(--text2);
  text-align: center; padding: 10px 0;
}
.set-input {
  width: 100%; padding: 12px 10px;
  background: var(--bg-input); border: 2px solid var(--border);
  border-radius: 8px; font-size: 1.15rem; font-weight: 600;
  color: var(--text); text-align: center;
  min-height: 48px;
}
.set-input:focus { border-color: var(--accent); outline: none; }
.set-x { text-align: center; color: var(--text3); font-weight: 600; }
.add-set-btn {
  width: 100%; margin-top: 4px; padding: 12px; min-height: 44px;
  background: transparent; border: 1.5px dashed var(--border);
  border-radius: 8px; color: var(--text2); font-size: 0.9rem; font-weight: 600; cursor: pointer;
}
.add-set-btn:active { opacity: 0.6; }
.bump-note {
  font-size: 0.8rem; color: var(--green); margin-top: -4px; margin-bottom: 8px;
  padding-left: 54px;
}

.notes-field {
  width: 100%; padding: 12px; margin-top: 12px;
  background: var(--bg-input); border: 2px solid var(--border);
  border-radius: 10px; font-size: 0.95rem; color: var(--text);
  resize: vertical; min-height: 60px; line-height: 1.4; overflow-y: hidden;
}
.notes-field:focus { border-color: var(--accent); outline: none; }
.notes-field::placeholder { color: var(--text3); }

/* ===== PROGRESSION BANNER ===== */
.progression-banner {
  padding: 10px 14px; border-radius: 10px; font-size: 0.9rem;
  font-weight: 600; margin-top: 12px;
}
.banner-green { background: var(--green-bg); color: var(--green); }
.banner-amber { background: var(--amber-bg); color: var(--amber); }
.banner-atg { background: var(--bg-input); color: var(--text2); }

/* ===== FIXED SAVE BAR ===== */
.save-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 8px 16px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid var(--border);
  z-index: 100; display: flex; gap: 10px; align-items: center; justify-content: space-between;
  max-width: 500px; margin: 0 auto;
}
.save-bar .auto-saved { font-size: 0.75rem; color: var(--text3); }
.save-bar .done-btn { padding: 10px 24px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; background: var(--accent); color: #fff; border: none; cursor: pointer; }

/* ===== SUMMARY ===== */
.summary-item {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; margin-bottom: 8px;
}
.summary-name { font-weight: 600; font-size: 0.95rem; }
.summary-sets { font-size: 0.85rem; color: var(--text2); margin-top: 4px; }
.summary-notes { font-size: 0.85rem; color: var(--text3); margin-top: 4px; font-style: italic; }
.summary-section { margin-bottom: 20px; }
.summary-section h3 { font-size: 0.9rem; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

/* ===== IMPORT MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 200; display: flex; align-items: flex-end; justify-content: center;
}
.modal {
  background: var(--bg); border-radius: 16px 16px 0 0;
  padding: 20px; width: 100%; max-width: 500px;
  max-height: 80vh; overflow-y: auto;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
}
.modal h2 { font-size: 1.1rem; margin-bottom: 12px; }
.modal textarea {
  width: 100%; min-height: 200px; padding: 12px;
  background: var(--bg-input); border: 2px solid var(--border);
  border-radius: 10px; font-size: 0.85rem; color: var(--text);
  font-family: monospace; resize: vertical;
}
.modal-actions { display: flex; gap: 10px; margin-top: 12px; }
.modal-actions .btn { flex: 1; }
.import-result { margin-top: 12px; padding: 12px; border-radius: 10px; font-size: 0.85rem; }

/* ===== VARIANT PILLS ===== */
.variant-pills { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.variant-pill {
  padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
  border: 2px solid var(--border); background: var(--bg-card); color: var(--text2);
  cursor: pointer; min-height: 36px;
}
.variant-pill.active { border-color: var(--accent); background: var(--accent); color: #fff; }

/* ===== TIMER ===== */
.timer-block { margin-bottom: 16px; }
.timer-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
}
.timer-side { font-weight: 600; font-size: 0.85rem; color: var(--text2); min-width: 44px; }
.partial-status { font-size: 0.75rem; color: var(--amber); font-weight: 600; }
.timer-display { font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; flex: 1; text-align: center; }
.timer-btn {
  padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 700;
  border: none; cursor: pointer; min-height: 40px; min-width: 72px;
}
.timer-btn-start { background: var(--green); color: #fff; }
.timer-btn-pause { background: var(--amber); color: #fff; }
.timer-btn-done { background: var(--green-bg); color: var(--green); }
.timer-goal { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; margin-left: 4px; }
.timer-past-goal { color: var(--green); font-weight: 800; }
.timer-goal-flash { animation: goalFlash 0.5s ease-out 3; }
@keyframes goalFlash { 0%, 100% { background: transparent; } 50% { background: var(--green-bg); } }
.time-adjust { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
.time-adjust-btn {
  padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 600;
  border: 1px solid var(--border); background: var(--bg-input); color: var(--text2);
  cursor: pointer; min-height: 36px;
}
.time-adjust-btn:active { background: var(--border); }

/* ===== PEEK VIEW ===== */
.peek-section {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; margin-top: 16px; overflow: hidden;
}
.peek-toggle {
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; font-weight: 600; font-size: 0.85rem;
  background: none; border: none; width: 100%; text-align: left;
  color: var(--text2); padding: 10px 14px;
}
.peek-toggle::after { content: '▼'; font-size: 0.65rem; color: var(--text3); transition: transform 0.2s; }
.peek-section.collapsed .peek-toggle::after { transform: rotate(-90deg); }
.peek-body { border-top: 1px solid var(--border); }
.peek-section.collapsed .peek-body { display: none; }
.peek-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  cursor: pointer; font-size: 0.85rem;
}
.peek-row:last-child { border-bottom: none; }
.peek-row:active { background: var(--bg-input); }
.peek-num { font-size: 0.75rem; color: var(--text3); min-width: 20px; text-align: right; }
.peek-name { flex: 1; font-weight: 500; }
.peek-meta { font-size: 0.75rem; color: var(--text3); }
.peek-fence { padding: 8px 14px; font-size: 0.75rem; color: var(--fence-color); font-weight: 600; border-bottom: 1px solid var(--border); }
.peek-fence:last-child { border-bottom: none; }

/* ===== COMPLETION TOGGLES ===== */
/* ===== MULTI TIMER ===== */
.multi-timer-block { display: flex; flex-direction: column; gap: 8px; }
.mt-hint { font-size: 0.8rem; color: var(--text3); margin-bottom: 2px; }
.multi-timer-step {
  display: flex; flex-direction: column; align-items: stretch; gap: 8px;
  padding: 12px; border-radius: 10px;
  background: var(--bg-card); border: 1px solid var(--border);
}
.multi-timer-step.active { border-color: var(--accent); background: var(--ss-bg); }
.multi-timer-step.done { border-color: var(--green); background: var(--green-bg); }
.mt-head { display: flex; align-items: center; gap: 8px; }
.multi-timer-step-num { font-size: 0.8rem; font-weight: 700; color: var(--text3); min-width: 20px; text-align: center; }
.multi-timer-step-label { font-size: 0.9rem; font-weight: 600; }
.mt-timeline { display: flex; align-items: baseline; gap: 8px; }
.mt-goal-label { font-size: 0.9rem; color: var(--text3); }
.multi-timer-display {
  font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums;
  min-width: 55px; text-align: left;
}
.mt-controls { display: flex; gap: 8px; }
.mt-controls .multi-timer-btn { flex: 1; min-width: 0; }
.mt-controls .mt-icon { flex: 0 0 48px; min-width: 48px; padding: 8px 0; }
.mt-held { flex: 1; display: flex; align-items: center; font-size: 0.9rem; font-weight: 700; color: var(--green); }
.multi-timer-btn {
  padding: 8px 14px; border: none; border-radius: 8px;
  font-size: 0.85rem; font-weight: 700; cursor: pointer;
  min-height: 44px;
}
.multi-timer-btn-start { background: var(--accent); color: #fff; }
.multi-timer-btn-pause { background: var(--amber); color: #fff; }
.multi-timer-btn-done { background: var(--green); color: #fff; }
.multi-timer-btn-waiting { background: var(--bg-input); color: var(--text2); }

.completion-row {
  display: flex; align-items: center; gap: 16px; justify-content: center;
  padding: 16px; margin-bottom: 12px;
}
.completion-toggle {
  display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;
}
.completion-toggle .check-box {
  width: 56px; height: 56px; border-radius: 12px; font-size: 1.5rem;
  display: flex; align-items: center; justify-content: center;
  border: 3px solid var(--border); background: var(--bg-card); transition: all 0.15s;
}
.completion-toggle.done .check-box { border-color: var(--green); background: var(--green-bg); }
.completion-toggle .check-label { font-size: 0.8rem; font-weight: 600; color: var(--text2); }

/* ===== UNILATERAL SETS ===== */
.uni-set-group { margin-bottom: 12px; }
.uni-set-label { font-size: 0.85rem; font-weight: 600; color: var(--text2); margin-bottom: 6px; padding-left: 4px; }
.uni-side-row {
  display: grid; grid-template-columns: 28px 1fr 24px 1fr; gap: 6px;
  align-items: center; margin-bottom: 4px;
}
.uni-side-label { font-size: 0.75rem; font-weight: 700; color: var(--text3); text-align: center; }
.uni-col-label { font-size: 0.72rem; font-weight: 700; color: var(--text3); text-align: center; text-transform: uppercase; letter-spacing: 0.03em; }

/* Split reps: per-set weight + L/R reps */
.split-reps-header {
  display: grid; grid-template-columns: 50px 1fr 24px 1fr 24px 1fr; gap: 6px;
  padding: 0 0 6px; font-size: 0.75rem; color: var(--text3); font-weight: 600; text-transform: uppercase;
}
.split-reps-row {
  display: grid; grid-template-columns: 50px 1fr 24px 1fr 24px 1fr; gap: 6px;
  align-items: center; margin-bottom: 8px;
}

/* ===== SLED TRACKING ===== */
.sled-persistent {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; margin-bottom: 12px;
}
.sled-persistent label { font-size: 0.85rem; font-weight: 600; color: var(--text2); }
.sled-persistent input { width: 80px; margin: 0 8px; }
.sled-set-row {
  display: grid; grid-template-columns: 50px 1fr 1fr 1fr; gap: 6px;
  align-items: center; margin-bottom: 6px;
}
.sled-derived { font-size: 0.8rem; color: var(--text3); padding-left: 54px; margin-top: -2px; margin-bottom: 10px; }
/* Prominent, full-width sled stopwatch — the one thing you're staring at while pushing the sled. */
.stopwatch-btn {
  width: 100%; margin: 2px 0 4px; padding: 12px; border-radius: 10px;
  font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums;
  border: 2px solid var(--accent); background: var(--bg-card); color: var(--accent);
  cursor: pointer; min-height: 56px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.stopwatch-btn.running {
  background: var(--red); color: #fff; border-color: var(--red);
  font-size: 2.1rem; min-height: 68px;
}

/* ===== WEIGHT/DISTANCE ===== */
.wd-set-row {
  display: grid; grid-template-columns: 50px 1fr 30px 1fr; gap: 8px;
  align-items: center; margin-bottom: 8px;
}

/* ===== WORKOUT NOTES ===== */
.workout-notes { margin-top: 20px; padding-top: 16px; border-top: 2px solid var(--border); }
.workout-notes label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: var(--text2); }
.workout-notes .notes-field { margin-top: 0; margin-bottom: 12px; }

/* ===== SESSION DETAIL VIEW ===== */
.session-detail-item {
  padding: 12px 0; border-bottom: 1px solid var(--border);
}

// =====================================================
// DATA MODULE — localStorage read/write
// =====================================================
const Data = (function() {
  const SESSIONS_KEY = 'gym-sessions';
  const WIP_KEY = 'gym-session-wip';
  const SLED_LENGTH_KEY = 'gym-sled-length-distance';
  const VARIANT_PREFIX = 'gym-variant-';

  function getSessions() {
    try {
      const parsed = JSON.parse(localStorage.getItem(SESSIONS_KEY));
      if (!Array.isArray(parsed)) return [];
      // Guarantee chronological order (oldest→newest). The whole app assumes newest is LAST — live
      // sessions append, and next-workout / last-session / getLastEntry all read from the end. An
      // imported log can be newest-FIRST, which silently flipped "next" and "last session" (v1.10.2).
      return parsed.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.startedAt || '').localeCompare(b.startedAt || ''));
    } catch { return []; }
  }

  function saveSessions(sessions) {
    try {
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
    } catch (e) {
      // Show actionable error — link to settings for export/cleanup
      const goSettings = confirm('Storage full! Your data was NOT saved.\n\nGo to Settings to export and delete old sessions?');
      if (goSettings) location.hash = '#/settings';
      throw e; // re-throw so callers like finishSession can handle it
    }
  }

  function addSession(session) {
    const sessions = getSessions();
    sessions.push(session);
    saveSessions(sessions);
  }

  function getWIP() {
    try {
      return JSON.parse(localStorage.getItem(WIP_KEY));
    } catch { return null; }
  }

  function saveWIP(wip) {
    try {
      localStorage.setItem(WIP_KEY, JSON.stringify(wip));
    } catch (e) {
      console.error('Failed to save WIP:', e);
    }
  }

  function clearWIP() {
    localStorage.removeItem(WIP_KEY);
  }

  function markExported(sessionIndex) {
    const sessions = getSessions();
    if (sessions[sessionIndex]) {
      sessions[sessionIndex].exported = true;
      try {
        saveSessions(sessions);
      } catch (e) {
        // Export to clipboard/share already succeeded; only the "exported" flag
        // failed to persist (storage full). saveSessions() has already shown the
        // storage-full prompt. Swallow so the caller doesn't fall to an error path —
        // the unexported banner simply stays, which is the safe/conservative outcome.
        console.error('Failed to persist exported flag:', e);
      }
    }
  }

  function getUnexportedSessions() {
    return getSessions().filter(s => !s.exported);
  }

  // Sled length distance (meters per length, persists across sessions)
  function getSledLength() {
    return parseFloat(localStorage.getItem(SLED_LENGTH_KEY)) || 15;
  }

  function setSledLength(meters) {
    localStorage.setItem(SLED_LENGTH_KEY, String(meters));
  }

  // Variant selection per exercise (persists across sessions)
  function getVariant(exerciseId) {
    return localStorage.getItem(VARIANT_PREFIX + exerciseId) || null;
  }

  function setVariant(exerciseId, variantId) {
    localStorage.setItem(VARIANT_PREFIX + exerciseId, variantId);
  }

  const GYM_LIST_KEY = 'gym-gym-list';
  const GYM_LAST_KEY = 'gym-last-gym';
  const DEFAULT_GYM = 'Max Fitness Flora Praha';

  function getGymList() {
    try {
      const list = JSON.parse(localStorage.getItem(GYM_LIST_KEY));
      if (Array.isArray(list) && list.length > 0) return list;
    } catch {}
    return [DEFAULT_GYM];
  }
  function saveGymList(list) { localStorage.setItem(GYM_LIST_KEY, JSON.stringify(list)); }
  function getLastGym() { return localStorage.getItem(GYM_LAST_KEY) || getGymList()[0]; }
  function setLastGym(name) { localStorage.setItem(GYM_LAST_KEY, name); }
  function addGym(name) {
    const list = getGymList();
    if (!list.includes(name)) { list.push(name); saveGymList(list); }
    setLastGym(name);
  }

  const CHOP_KEY = 'gym-chop-direction';
  function getChopDirection() { return localStorage.getItem(CHOP_KEY) || 'hi_lo'; }
  function setChopDirection(dir) { localStorage.setItem(CHOP_KEY, dir); }
  function flipChopDirection() { setChopDirection(getChopDirection() === 'hi_lo' ? 'lo_hi' : 'hi_lo'); }

  function getUserCues(exerciseId) {
    return localStorage.getItem(`gym-cues-${exerciseId}`) || null;
  }
  function saveUserCues(exerciseId, text) {
    if (text && text.trim()) localStorage.setItem(`gym-cues-${exerciseId}`, text.trim());
    else localStorage.removeItem(`gym-cues-${exerciseId}`);
  }

  return { getSessions, saveSessions, addSession, getWIP, saveWIP, clearWIP, markExported, getUnexportedSessions, getSledLength, setSledLength, getVariant, setVariant, getChopDirection, setChopDirection, flipChopDirection, getUserCues, saveUserCues, getGymList, getLastGym, setLastGym, addGym };
})();

// =====================================================
// STATE MODULE — working session + history lookups
// =====================================================
const State = (function() {
  let wip = null;

  function init() {
    wip = Data.getWIP();
  }

  function startSession(workoutId) {
    // LOCAL calendar date, not UTC. toISOString() is UTC, so a session started before ~01:00 local
    // (Prague = UTC+1/+2) would have been stamped the PREVIOUS day. Same local-date formatting the
    // markdown importer already uses.
    const now = new Date();
    const localDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    wip = {
      workoutId,
      date: localDate,
      exercises: {},
      overall: '',
      injuries: '',
      gym: Data.getLastGym(),
    };
    Data.saveWIP(wip);
    return wip;
  }

  function startTimer() {
    if (!wip || wip.startedAt) return;
    wip.startedAt = new Date().toISOString();
    Data.saveWIP(wip);
  }

  function endTimer() {
    if (!wip || wip.completedAt) return;
    wip.completedAt = new Date().toISOString();
    Data.saveWIP(wip);
  }

  function getWIP() { return wip; }

  function hasWIP() { return wip !== null; }

  function logExercise(exIndex, data) {
    if (!wip) return;
    wip.exercises[exIndex] = data;
    Data.saveWIP(wip);
  }

  function updateSessionNotes(overall, injuries, gym) {
    if (!wip) return;
    wip.overall = overall;
    wip.injuries = injuries;
    if (gym !== undefined) { wip.gym = gym; Data.setLastGym(gym); }
    Data.saveWIP(wip);
  }

  // Sound-check gate: remember on the WIP that the user has verified their alarm is audible
  // this session, so we prod for it exactly once before they start training.
  function setSoundChecked(val) {
    if (!wip) return;
    wip.soundChecked = !!val;
    Data.saveWIP(wip);
  }

  function getExerciseData(exIndex) {
    if (!wip || !wip.exercises[exIndex]) return null;
    return wip.exercises[exIndex];
  }

  function getExerciseCompletionStatus(exIndex, expectedSets) {
    if (!wip || !wip.exercises[exIndex]) return { status: 'none', filled: 0, total: expectedSets || 0 };
    const data = wip.exercises[exIndex];

    // Explicit completion ("Completed exercise" tapped) wins over inferred status
    if (data.completed) {
      const t = expectedSets || (data.sets ? data.sets.length : 0) || 1;
      return { status: 'complete', filled: t, total: t };
    }

    // Multi-timer type
    if (data.timerSteps !== undefined) {
      const filled = data.timerSteps.filter(s => s.done).length;
      const total = data.timerSteps.length || expectedSets || 4;
      return { status: filled >= total ? 'complete' : filled > 0 ? 'partial' : 'none', filled, total };
    }

    // Completion type (done/doneL/doneR)
    if (data.done !== undefined && data.doneL === undefined && data.timerSteps === undefined) {
      return { status: data.done ? 'complete' : 'none', filled: data.done ? 1 : 0, total: 1 };
    }
    if (data.doneL !== undefined) {
      const filled = (data.doneL ? 1 : 0) + (data.doneR ? 1 : 0);
      return { status: filled === 2 ? 'complete' : filled > 0 ? 'partial' : 'none', filled, total: 2 };
    }

    // Set-based types
    if (!data.sets || data.sets.length === 0) return { status: 'none', filled: 0, total: expectedSets || 0 };

    const total = Math.max(expectedSets || 0, data.sets.length);   // grows when the user added sets
    let filled = 0;
    for (const s of data.sets) {
      // A set only counts once the user actually edited one of its inputs (s.touched).
      // Legacy sets saved before the touched flag existed have s.touched === undefined —
      // trust their values as before so an in-progress session across an update isn't wiped.
      const genuine = (s.touched === undefined) ? true : s.touched;
      if (!genuine) continue;
      if (s.lengths) { filled++; continue; }
      if (s.distance) { filled++; continue; }
      if (s.reps !== null && s.reps !== undefined && s.reps !== '' && parseInt(s.reps) !== 0) { filled++; continue; }
      if (s.repsL !== null && s.repsL !== undefined && s.repsL !== '') { filled++; continue; }
    }
    // Set-based 'complete' requires an explicit "Completed exercise" tap (handled above),
    // and prefilled-but-untouched sets no longer ghost as "1/1" just because you opened the exercise.
    const status = filled === 0 ? 'none' : 'partial';
    return { status, filled, total };
  }

  function isExerciseLogged(exIndex) {
    return getExerciseCompletionStatus(exIndex).status !== 'none';
  }

  // Does a saved exercise entry represent something the user ACTUALLY did? Single source of truth
  // for "was this performed", mirroring getExerciseCompletionStatus's counting. The history lookups,
  // the finish-time prune, and the scrub migration all use this so completion-status, history,
  // last-entry and export can never disagree again (the bug: history counted prefilled-but-untouched
  // "ghost" sets that a mere exercise-screen visit auto-saved). Legacy sets (touched === undefined)
  // are trusted as genuine so pre-touched history is never wiped.
  function setHasRealValue(s) {
    if (s.lengths) return true;
    if (s.distance) return true;
    if (s.reps !== null && s.reps !== undefined && s.reps !== '' && parseInt(s.reps) !== 0) return true;
    if (s.repsL !== null && s.repsL !== undefined && s.repsL !== '') return true;
    if (s.repsR !== null && s.repsR !== undefined && s.repsR !== '') return true;
    // A logged WEIGHT is real too — you recorded the load even if you left reps blank. No exercise
    // pre-fills weight (only prefillReps), so a weight value can't sit on an untouched set → no phantom risk.
    if (s.weight !== null && s.weight !== undefined && s.weight !== '') return true;
    if (s.weightL !== null && s.weightL !== undefined && s.weightL !== '') return true;
    if (s.weightR !== null && s.weightR !== undefined && s.weightR !== '') return true;
    return false;
  }
  function entryHasGenuineData(data) {
    if (!data) return false;
    if (data.completed) return true;                                   // explicit "Completed exercise" tap
    if (data.timerSteps !== undefined) return data.timerSteps.some(s => s.done);
    if (data.done || data.doneL || data.doneR) return true;
    if (Array.isArray(data.sets) && data.sets.length > 0) {
      return data.sets.some(s => ((s.touched === undefined) ? true : s.touched) && setHasRealValue(s));
    }
    return false;
  }

  function finishSession() {
    if (!wip) return null;
    if (!wip.completedAt) wip.completedAt = new Date().toISOString();
    // Drop ghost entries — exercise screens opened but never actually logged — so the saved session
    // matches exactly what history shows and what export writes. Uses the same genuine-data test.
    for (const idx of Object.keys(wip.exercises)) {
      if (!entryHasGenuineData(wip.exercises[idx])) delete wip.exercises[idx];
    }
    // CRITICAL: save session BEFORE clearing WIP.
    // If saveSessions throws (quota exceeded), WIP survives for retry.
    const sessions = Data.getSessions();
    sessions.push(wip);
    try {
      Data.saveSessions(sessions);
    } catch (e) {
      // Save failed — WIP is still intact for recovery
      alert('Failed to save session — storage may be full. Your workout is still recoverable. Go to Settings to export and clear old sessions.');
      return null;
    }
    const finished = { ...wip };
    wip = null;
    Data.clearWIP();
    return finished;
  }

  function abandonSession() {
    wip = null;
    Data.clearWIP();
  }

  // Resolve an exercise ID through the alias map
  function resolveId(id) {
    return ID_ALIASES[id] || id;
  }

  // Find last entry for a given exercise ID across all sessions
  // Checks both current ID and any aliases (for backward compat with old sled IDs etc.)
  // Variant-aware match: with a filter, an entry counts only if it's the same variant — or a
  // legacy untagged entry viewed under the exercise's default variant. Mirrors Views.filterHistoryByVariant
  // so the "Last session" line, prefill, and full-history page all agree. No filter → always matches.
  function matchesVariantFilter(data, vf) {
    if (!vf) return true;
    return data.variant === vf.variantId || (vf.variantId === vf.defaultVariantId && !data.variant);
  }

  function getLastEntry(exerciseId, variantFilter) {
    const targetId = resolveId(exerciseId);
    const sessions = Data.getSessions();
    for (let i = sessions.length - 1; i >= 0; i--) {
      const s = sessions[i];
      const workout = PROGRAMME.find(w => w.id === s.workoutId);
      if (!workout) continue;
      for (const [idx, data] of Object.entries(s.exercises)) {
        const ex = workout.exercises[parseInt(idx)];
        // Prefer the stored exercise ID; fall back to array index for legacy unstamped data
        const exResolved = resolveId(data.exId || (ex && ex.id));
        if (!exResolved) continue;
        if (exResolved === targetId && matchesVariantFilter(data, variantFilter) && entryHasGenuineData(data)) {
          return { date: s.date, workoutId: s.workoutId, ...data };
        }
      }
    }
    return null;
  }

  function getExerciseHistory(exerciseId) {
    const targetId = resolveId(exerciseId);
    const sessions = Data.getSessions();
    const results = [];
    for (let i = sessions.length - 1; i >= 0; i--) {
      const s = sessions[i];
      const workout = PROGRAMME.find(w => w.id === s.workoutId);
      if (!workout) continue;
      for (const [idx, data] of Object.entries(s.exercises)) {
        const ex = workout.exercises[parseInt(idx)];
        const exResolved = resolveId(data.exId || (ex && ex.id));
        if (!exResolved) continue;
        if (exResolved === targetId && entryHasGenuineData(data)) {
          const exDef = workout.exercises.find(e => resolveId(e.id) === targetId) || ex;
          results.push({ date: s.date, workoutId: s.workoutId, data, exercise: exDef });
        }
      }
    }
    return results;
  }

// =====================================================
// PROGRESSION MODULE — auto-bump + banners
// =====================================================
const Progression = (function() {

  function getWeightStep(progressionType) {
    if (progressionType === 'compound') return 2.5;
    if (progressionType === 'isolation') return 1;
    return 0;
  }

  // Round to 1 decimal to avoid float artifacts (e.g. 42.5 + 2.5 = 45.00000000001)
  function roundWeight(w) { return Math.round(w * 10) / 10; }

  // Parse reps strictly — only pure integers count for progression decisions.
  // parseInt("6+") returns 6 which could falsely trigger a bump.
  function strictReps(val) {
    if (val === null || val === undefined || val === '') return NaN;
    const s = String(val).trim();
    return /^\d+$/.test(s) ? parseInt(s) : NaN;
  }

  function shouldAutoBump(lastSets, repRange, unilateral) {
    if (!repRange || !lastSets || lastSets.length === 0) return false;
    const top = repRange[1];
    if (unilateral === 'split_reps') {
      return lastSets.every(s => {
        const l = strictReps(s.repsL); const r = strictReps(s.repsR);
        return !isNaN(l) && l >= top && !isNaN(r) && r >= top;
      });
    }
    return lastSets.every(s => {
      const r = strictReps(s.reps);
      return !isNaN(r) && r >= top;
    });
  }

  function getPreFill(exerciseId, exercise, variantFilter) {
    const last = State.getLastEntry(exerciseId, variantFilter);
    const result = { weight: '', weightL: '', weightR: '', bumped: false, from: null };
    if (!last || !last.sets || last.sets.length === 0) return result;

    // Prefill from the LAST set of the previous session (your top/working set on a ramp),
    // not the first — e.g. a cable squat you build up to. Straight-sets are unaffected.
    const lastSet = last.sets[last.sets.length - 1];

    if (exercise.unilateral === 'split_weight') {
      result.weightL = lastSet.weightL || '';
      result.weightR = lastSet.weightR || '';
      return result;
    }

    if (exercise.unilateral === 'split_reps') {
      // New format: per-set weight; old format: shared last.weight
      const lastWeight = lastSet?.weight ?? last.weight ?? 0;
      if (exercise.repRange && shouldAutoBump(last.sets, exercise.repRange, 'split_reps')) {
        const step = getWeightStep(exercise.progressionType);
        if (step > 0) {
          return { ...result, weight: roundWeight(lastWeight + step), bumped: true, from: lastWeight };
        }
      }
      return { ...result, weight: lastWeight || '' };
    }

    const lastWeight = lastSet.weight || 0;
    if (exercise.repRange && shouldAutoBump(last.sets, exercise.repRange)) {
      const step = getWeightStep(exercise.progressionType);
      if (step > 0) {
        return { ...result, weight: roundWeight(lastWeight + step), bumped: true, from: lastWeight };
      }
    }
    return { ...result, weight: lastWeight || '' };
  }

  function getBanner(sets, exercise) {
    if (!exercise.progressionType) return null;
    if (exercise.progressionType === 'atg') {
      return { type: 'atg', text: 'Add load when form is solid' };
    }
    if (!exercise.repRange) return null;

    const [low, high] = exercise.repRange;

    // Unilateral split_reps: check both sides
    if (exercise.unilateral === 'split_reps') {
      const validSets = sets.filter(s => s.repsL !== undefined && s.repsL !== '' && s.repsR !== undefined && s.repsR !== '');
      if (validSets.length === 0) return null;
      const lAllTop = validSets.every(s => parseInt(s.repsL) >= high);
      const rAllTop = validSets.every(s => parseInt(s.repsR) >= high);
      const lAnyBelow = validSets.some(s => parseInt(s.repsL) < low);
      const rAnyBelow = validSets.some(s => parseInt(s.repsR) < low);

      if (lAllTop && rAllTop) {
        const step = getWeightStep(exercise.progressionType);
        const label = step > 0 ? `+${step}kg` : '';
        return { type: 'green', text: `Both sides at ${high} — add ${label} next session` };
      }
      if (lAnyBelow || rAnyBelow) {
        const lStatus = lAllTop ? 'All at ' + high : 'Below';
        const rStatus = rAllTop ? 'All at ' + high : 'Below';
        return { type: 'amber', text: `L: ${lStatus} · R: ${rStatus} — stay at this weight` };
      }
      return null;
    }

    const validSets = sets.filter(s => s.reps !== null && s.reps !== undefined && s.reps !== '');
    if (validSets.length === 0) return null;

    const allAtTop = validSets.every(s => parseInt(s.reps) >= high);
    const anyBelowBottom = validSets.some(s => parseInt(s.reps) < low);

    if (allAtTop) {
      const step = getWeightStep(exercise.progressionType);
      const label = step > 0 ? `+${step}kg` : '';
      return { type: 'green', text: `All sets at ${high} — add ${label} next session` };
    }
    if (anyBelowBottom) {
      return { type: 'amber', text: `Below range — stay at this weight` };
    }
    return null;
  }

  return { getPreFill, getBanner, shouldAutoBump };
})();

      html += `<div class="cue-label">Don't</div><ul class="cue-list mistakes">${cues.mistakes.map(s => `<li>${s}</li>`).join('')}</ul>`;
    }
    if (cues.you?.length) {
      html += `<div class="cue-label">You</div><ul class="cue-list you">${cues.you.map(s => `<li>${s}</li>`).join('')}</ul>`;
    }
    return html;
  }

  // ---- Last session display ----
  function formatLastEntry(lastEntry, ex) {
    if (!lastEntry) return '';
    let detail = '';
    if (lastEntry.done || lastEntry.doneL !== undefined) {
      detail = lastEntry.doneL !== undefined ? `L: ${lastEntry.doneL ? '✅' : '—'} R: ${lastEntry.doneR ? '✅' : '—'}` : (lastEntry.done ? '✅' : '—');
    } else if (lastEntry.sets && lastEntry.sets.length > 0) {
      const s0 = lastEntry.sets[0];
      if (s0.weightL !== undefined) {
        detail = lastEntry.sets.map(s => `L:${s.weightL||0}×${s.repsL||0} R:${s.weightR||0}×${s.repsR||0}`).join(', ');
      } else if (s0.repsL !== undefined) {
        if (s0.weight !== undefined) {
          detail = lastEntry.sets.map(s => `${s.weight||0}kg L${s.repsL}/R${s.repsR}`).join(', ');
        } else {
          detail = `${lastEntry.weight||0}kg — ` + lastEntry.sets.map(s => `L${s.repsL}/R${s.repsR}`).join(', ');
        }
      } else if (s0.lengths !== undefined) {
        detail = lastEntry.sets.map(s => `${s.weight||0}kg × ${s.lengths}L ${Timer.formatTime(s.timeSeconds||0)}`).join(', ');
      } else if (s0.distance !== undefined) {
        detail = lastEntry.sets.map(s => `${s.weight||0}kg/h × ${s.distance}m`).join(', ');
      } else {
        detail = lastEntry.sets.map(s => { const w = parseFloat(s.weight) || 0; return w ? `${w}kg × ${esc(s.reps)}` : `BW × ${esc(s.reps)}`; }).join(', ');
      }
    }
    if (lastEntry.chopDirection) detail += ` <span style="color:var(--text3);">(${lastEntry.chopDirection === 'hi_lo' ? 'Hi→Lo' : 'Lo→Hi'})</span>`;
    return `
      <div class="last-session" style="cursor:pointer;" onclick="Router.go('/exercise/${ex.id}')">
        <div class="last-session-title">Last session (${Markdown.formatDate(lastEntry.date)}, W${lastEntry.workoutId}) <span style="color:var(--accent);font-weight:600;float:right;">History →</span></div>
        <div>${detail}</div>
        ${lastEntry.notes ? `<div style="margin-top:4px;font-style:italic;color:var(--text3);white-space:pre-wrap;">${lastEntry.notes}</div>` : ''}
      </div>`;
  }

  // ---- Type-specific renderers ----

  // How many set rows to render/collect for a set-based exercise: the programme count, or more if
  // the user tapped "+ Add set" (which appends to the saved sets array, so it persists across nav).
  function _numSets(effEx, existingData) { return Math.max(effEx.sets || 1, existingData?.sets?.length || 0); }

  function renderWeightRepsSets(ex, existingData, preFill) {
    const wLabel = ex.weightLabel || 'kg';
    const rLabel = ex.repsLabel || 'reps';
    let html = `<div class="sets-header"><span></span><span>${wLabel}</span><span></span><span>${rLabel}</span></div>`;
    for (let s = 0, numSets = _numSets(ex, existingData); s < numSets; s++) {
      const existing = existingData?.sets?.[s];
      const weight = existing?.weight ?? (preFill.weight || 0);
      const reps = existing?.reps ?? (ex.prefillReps || '');
      html += `
        <div class="set-row">
          <span class="set-label">Set ${s + 1}</span>
          <input type="number" class="set-input weight-input" inputmode="decimal" step="0.5" placeholder="${wLabel}" value="${weight}" data-set="${s}">
          <span class="set-x">×</span>
          <input type="number" class="set-input reps-input" inputmode="numeric" step="1" placeholder="${rLabel}" value="${reps}" data-set="${s}">
        </div>
        ${s === 0 && preFill.bumped && !existingData ? `<div class="bump-note">Auto-bumped from ${preFill.from}kg</div>` : ''}`;
    }
    return html;
  }

  function renderRepsOnlySets(ex, existingData, preFill) {
    const rLabel = ex.repsLabel || 'reps';
    let html = `<div class="sets-header" style="grid-template-columns:50px 1fr;"><span></span><span>${rLabel}</span></div>`;
    for (let s = 0, numSets = _numSets(ex, existingData); s < numSets; s++) {
      const existing = existingData?.sets?.[s];
      const reps = existing?.reps ?? (ex.prefillReps || '');
      html += `
        <div class="set-row" style="grid-template-columns:50px 1fr;">
          <span class="set-label">Set ${s + 1}</span>
          <input type="number" class="set-input reps-input" inputmode="numeric" step="1" placeholder="${rLabel}" value="${reps}" data-set="${s}">
        </div>`;
    }
    return html;
  }

  function renderRepsOnlySplitSets(ex, existingData) {
    const rLabel = ex.repsLabel || 'reps';
    let html = `<div class="split-reps-header" style="grid-template-columns:50px 30px 1fr 30px 1fr;"><span></span><span></span><span>L ${rLabel}</span><span></span><span>R ${rLabel}</span></div>`;
    for (let s = 0, numSets = _numSets(ex, existingData); s < numSets; s++) {
      const existing = existingData?.sets?.[s];
      const rL = existing?.repsL ?? (ex.prefillReps || '');
      const rR = existing?.repsR ?? (ex.prefillReps || '');
      html += `
        <div class="split-reps-row" style="grid-template-columns:50px 30px 1fr 30px 1fr;">
          <span class="set-label">Set ${s + 1}</span>
          <span class="uni-side-label">L</span>
          <input type="number" class="set-input rl-input" inputmode="numeric" step="1" placeholder="${rLabel}" value="${rL}" data-set="${s}">
          <span class="uni-side-label">R</span>
          <input type="number" class="set-input rr-input" inputmode="numeric" step="1" placeholder="${rLabel}" value="${rR}" data-set="${s}">
        </div>`;
    }
    return html;
  }

  function renderSplitWeightSets(ex, existingData, preFill) {
    const wLabel = ex.weightLabel || 'kg';
    const rLabel = ex.repsLabel || 'reps';
    // Persistent column header (the placeholders vanish once you type — this is what let you confuse
    // the kg box with the reps box). Aligns with the .uni-side-row grid: [side] [weight] [×] [reps].
    let html = `<div class="uni-side-row" style="margin-bottom:8px;"><span></span><span class="uni-col-label">${wLabel}</span><span></span><span class="uni-col-label">${rLabel}</span></div>`;
    for (let s = 0, numSets = _numSets(ex, existingData); s < numSets; s++) {
      const existing = existingData?.sets?.[s];
      const wL = existing?.weightL ?? (preFill.weightL || 0);
      const rL = existing?.repsL ?? (ex.prefillReps || '');
      const wR = existing?.weightR ?? (preFill.weightR || 0);
      const rR = existing?.repsR ?? (ex.prefillReps || '');
      html += `
        <div class="uni-set-group">
          <div class="uni-set-label">Set ${s + 1}</div>
          <div class="uni-side-row">
            <span class="uni-side-label">L</span>
            <input type="number" class="set-input wl-input" inputmode="decimal" step="0.5" placeholder="${wLabel}" value="${wL}" data-set="${s}">

          <div class="uni-side-row">
            <span class="uni-side-label">R</span>
            <input type="number" class="set-input wr-input" inputmode="decimal" step="0.5" placeholder="${wLabel}" value="${wR}" data-set="${s}">
            <span class="set-x">×</span>
            <input type="number" class="set-input rr-input" inputmode="numeric" step="1" placeholder="${rLabel}" value="${rR}" data-set="${s}">
          </div>

  function renderSplitRepsSets(ex, existingData, preFill) {
    const wLabel = ex.weightLabel || 'kg';
    const rLabel = ex.repsLabel || 'reps';
    // Backward compat: old data has existingData.weight as shared value
    const fallbackWeight = existingData?.weight ?? (preFill.weight || 0);
    let html = `<div class="split-reps-header"><span></span><span>${wLabel}</span><span></span><span>L ${rLabel}</span><span></span><span>R ${rLabel}</span></div>`;
    for (let s = 0, numSets = _numSets(ex, existingData); s < numSets; s++) {
      const existing = existingData?.sets?.[s];
      const weight = existing?.weight ?? fallbackWeight;
      const rL = existing?.repsL ?? (ex.prefillReps || '');
      const rR = existing?.repsR ?? (ex.prefillReps || '');
      html += `
        <div class="split-reps-row">

  }

  function renderDurationExercise(ex, existingData, ns) {
    const seconds = ex.timerSeconds || 60;
    if (ex.unilateral) {

          <div class="timer-row">
            <span class="timer-side">RIGHT</span>
            <span class="timer-display${timeR >= seconds ? ' timer-past-goal' : ''}" id="${ns}timer-r" onclick="Views.setTimeManual('${ns}timer-r')" style="cursor:pointer;" title="Tap to enter time">${doneR && timeR ? Timer.formatTime(timeR) : '0:00'}</span>
            <span class="timer-goal">/ ${Timer.formatTime(seconds)}</span>
            <button class="timer-btn ${doneR ? 'timer-btn-done' : 'timer-btn-start'}" id="${ns}timer-r-btn"

      <div class="timer-block">

          <span class="timer-goal">/ ${Timer.formatTime(seconds)}</span>
          <button class="timer-btn ${done ? 'timer-btn-done' : 'timer-btn-start'}" id="${ns}timer-main-btn"
            onclick="Views.handleTimerTap('${ns}timer-main', ${seconds}, false)">
            ${done ? 'DONE' : 'START'}

        </div>
        <div class="time-adjust" id="time-adjust-main" style="${done ? '' : 'display:none'}">
          <button class="time-adjust-btn" onclick="Views.adjustTime('${ns}timer-main',-30)">−30s</button>

          <button class="time-adjust-btn" onclick="Views.adjustTime('${ns}timer-main',60)">+1min</button>
        </div>
        <input type="hidden" id="done-main" value="${done}">
        <input type="hidden" id="time-main" value="${time}">

  }

        timerHtml = `
          <div class="timer-block" style="margin-top:12px;">
            <div class="timer-row">
              <span class="timer-side">L</span>
              <span class="timer-display${timeL >= s ? ' timer-past-goal' : ''}" id="${ns}timer-l" onclick="Views.setTimeManual('${ns}timer-l')" style="cursor:pointer;" title="Tap to enter time">${doneL && timeL ? Timer.formatTime(timeL) : '0:00'}</span>
              <span class="timer-goal">/ ${Timer.formatTime(s)}</span>
              <button class="timer-btn ${doneL ? 'timer-btn-done' : 'timer-btn-start'}" id="${ns}timer-l-btn"
                onclick="Views.handleTimerTap('${ns}timer-l', ${s}, true)">${doneL ? 'DONE' : 'START'}</button>
            </div>
            <div class="timer-row">
              <span class="timer-side">R</span>
              <span class="timer-display${timeR >= s ? ' timer-past-goal' : ''}" id="${ns}timer-r" onclick="Views.setTimeManual('${ns}timer-r')" style="cursor:pointer;" title="Tap to enter time">${doneR && timeR ? Timer.formatTime(timeR) : '0:00'}</span>
              <span class="timer-goal">/ ${Timer.formatTime(s)}</span>
              <button class="timer-btn ${doneR ? 'timer-btn-done' : 'timer-btn-start'}" id="${ns}timer-r-btn"
                onclick="Views.handleTimerTap('${ns}timer-r', ${s}, true)">${doneR ? 'DONE' : 'START'}</button>

          <input type="hidden" id="time-l" value="${timeL}">

            <span style="font-size:0.75rem;color:var(--text3);font-weight:600;">L</span>
            <button class="time-adjust-btn" onclick="Views.adjustTime('${ns}timer-l',-30)">−30s</button>
            <button class="time-adjust-btn" onclick="Views.adjustTime('${ns}timer-l',30)">+30s</button>

          <div class="time-adjust" id="time-adjust-r" style="${doneR ? '' : 'display:none'}">
            <span style="font-size:0.75rem;color:var(--text3);font-weight:600;">R</span>
            <button class="time-adjust-btn" onclick="Views.adjustTime('${ns}timer-r',-30)">−30s</button>
            <button class="time-adjust-btn" onclick="Views.adjustTime('${ns}timer-r',30)">+30s</button>
            <button class="time-adjust-btn" onclick="Views.adjustTime('${ns}timer-r',60)">+1min</button>
          </div>`;

      return `
        <div class="completion-row">
          <div class="completion-toggle ${doneL ? 'done' : ''}" data-side="L" onclick="this.classList.toggle('done'); this.querySelector('.check-box').textContent = this.classList.contains('done') ? '✅' : ''; document.getElementById('done-l').value = this.classList.contains('done'); Views._triggerAutoSave();">
            <div class="check-box">${doneL ? '✅' : ''}</div>
            <span class="check-label">Left</span>
          </div>
          <div class="completion-toggle ${doneR ? 'done' : ''}" data-side="R" onclick="this.classList.toggle('done'); this.querySelector('.check-box').textContent = this.classList.contains('done') ? '✅' : ''; document.getElementById('done-r').value = this.classList.contains('done'); Views._triggerAutoSave();">
            <div class="check-box">${doneR ? '✅' : ''}</div>
            <span class="check-label">Right</span>

        <input type="hidden" id="done-l" value="${doneL}">
        <input type="hidden" id="done-r" value="${doneR}">

    }
    const done = existingData?.done || false;
    const time = existingData?.time || 0;
    let timerHtml = '';
    if (hasTimer) {
      timerHtml = `
        <div class="timer-block" style="margin-top:12px;">
          <div class="timer-row">
            <span class="timer-display${time >= ex.timerSeconds ? ' timer-past-goal' : ''}" id="${ns}timer-main" onclick="Views.setTimeManual('${ns}timer-main')" style="cursor:pointer;" title="Tap to enter time">${done && time ? Timer.formatTime(time) : '0:00'}</span>
            <span class="timer-goal">/ ${Timer.formatTime(ex.timerSeconds)}</span>
            <button class="timer-btn ${done ? 'timer-btn-done' : 'timer-btn-start'}" id="${ns}timer-main-btn"
              onclick="Views.handleTimerTap('${ns}timer-main', ${ex.timerSeconds}, true)">${done ? 'DONE' : 'START'}</button>
          </div>
          <div class="time-adjust" id="time-adjust-main" style="${done ? '' : 'display:none'}">
            <button class="time-adjust-btn" onclick="Views.adjustTime('${ns}timer-main',-30)">−30s</button>
            <button class="time-adjust-btn" onclick="Views.adjustTime('${ns}timer-main',30)">+30s</button>

        <input type="hidden" id="time-main" value="${time}">`;
