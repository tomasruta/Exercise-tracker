<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strength">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Strength</title>
<style>
/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
input, textarea, button, select { font-family: inherit; font-size: inherit; }

/* ===== THEME ===== */
:root {
  --bg: #f8f9fa;
  --bg-card: #ffffff;
  --bg-input: #f0f0f0;
  --text: #1a1a1a;
  --text2: #666;
  --text3: #999;
  --border: #e0e0e0;
  --accent: #2563eb;
  --green: #16a34a;
  --green-bg: #dcfce7;
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --red: #dc2626;
  --red-bg: #fee2e2;
  --ss-color: #6366f1;
  --ss-bg: #eef2ff;
  --fence-color: #f59e0b;
  --fence-bg: #fffbeb;
  --new-badge: #8b5cf6;
  --equip-badge: #b45309;
  --workouts-badge: #e2e8f0; /* light slate — "also in these workouts" pills, distinct from equip/SS/new */
  --location-badge: #0f766e; /* deep green — "U žen" gym-area location pills (Max Fitness Flora women's area) */
  color-scheme: light; /* always light — never follow system dark mode */
}

/* ===== LAYOUT ===== */
#app { max-width: 500px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom, 20px); }
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
}
.header h1 { font-size: 1.1rem; font-weight: 600; flex: 1; }
.session-clock { font-size: 0.8rem; color: var(--text2); margin-top: 2px; }
/* Exercise-page header is tight at 375px — drop "Started HH:MM", keep the running total, don't wrap. */
.session-clock-compact {
  margin-top: 0; flex-shrink: 0; font-variant-numeric: tabular-nums;
  font-weight: 600; white-space: nowrap;
}
.back-btn {
  background: var(--bg-card); border: 1px solid var(--border); color: var(--accent);
  font-size: 1rem; font-weight: 600; cursor: pointer; padding: 8px 14px; border-radius: 10px;
  min-width: 44px; min-height: 44px; display: flex; align-items: center; gap: 4px;
}
.content { padding: 16px; }

/* ===== HOME ===== */
.workout-grid { display: flex; flex-direction: column; gap: 12px; }
.workout-btn {
  display: flex; align-items: center; gap: 14px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
  cursor: pointer; text-align: left; width: 100%;
  min-height: 64px; transition: background 0.15s;
}
.workout-btn:active { background: var(--bg-input); }
.workout-next { border-color: var(--accent); border-width: 2px; box-shadow: 0 0 0 1px var(--accent); }
.workout-id {
  font-size: 1.3rem; font-weight: 700; color: var(--accent);
  min-width: 40px;
}
.workout-info { flex: 1; }
.workout-name { font-size: 0.95rem; font-weight: 600; display: block; }
.workout-sub { font-size: 0.8rem; color: var(--text2); margin-top: 2px; }
.home-actions { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
.btn {
  display: block; width: 100%; padding: 14px;
  border: none; border-radius: 10px; font-size: 1rem;
  font-weight: 600; cursor: pointer; text-align: center;
  min-height: 48px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
.btn-success { background: var(--green); color: #fff; }
.btn-amber { background: var(--amber); color: #fff; }
.btn:active { opacity: 0.85; }

/* ===== WORKOUT LIST ===== */
.exercise-list { display: flex; flex-direction: column; gap: 2px; }
.ss-group {
  border-left: 3px solid var(--ss-color);
  background: var(--ss-bg);
  border-radius: 0 10px 10px 0;
  margin: 4px 0;
}
.ss-label {
  font-size: 0.7rem; font-weight: 700; color: var(--ss-color);
  padding: 4px 10px 0; text-transform: uppercase; letter-spacing: 0.5px;
}
.ex-row {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; cursor: pointer;
  background: var(--bg-card); border-bottom: 1px solid var(--border);
  min-height: 52px;
}
.ss-group .ex-row { background: transparent; border-bottom: 1px solid var(--border); }
.ss-group .ex-row:last-child { border-bottom: none; }
.ex-num { font-size: 0.8rem; color: var(--text3); min-width: 22px; text-align: right; }
.ex-info { flex: 1; min-width: 0; }
.ex-name { font-size: 0.95rem; font-weight: 500; }
.ex-meta { font-size: 0.8rem; color: var(--text2); margin-top: 2px; }
.ex-status { font-size: 1.1rem; min-width: 28px; text-align: center; }
.badge {
  display: inline-block; font-size: 0.65rem; font-weight: 700;
  padding: 1px 5px; border-radius: 4px; vertical-align: middle; margin-left: 4px;
}
.badge-new { background: var(--new-badge); color: #fff; }
.badge-ss { background: var(--ss-color); color: #fff; }
.badge-equip { background: var(--equip-badge); color: #fff; }
.badge-workouts { background: var(--workouts-badge); color: #64748b; font-size: 0.6rem; padding: 1px 4px; letter-spacing: 0.02em; }
.badge-location { background: var(--location-badge); color: #fff; }

/* ===== MALTO FENCE ===== */
.malto-fence {
  display: flex; align-items: center; gap: 10px;
  background: var(--fence-bg); border: 2px solid var(--fence-color);
  border-radius: 10px; padding: 10px 14px; margin: 10px 0;
  font-weight: 700; font-size: 0.85rem; color: var(--fence-color);
}

/* ===== EXERCISE DETAIL ===== */
.ex-detail { padding-bottom: 100px; }
.ex-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
.ex-target { font-size: 1rem; color: var(--text2); margin-bottom: 12px; }
/* ATG standard + gap-to-standard. Reference only — no inputs, no tap targets. */
.atg-std {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; margin-bottom: 12px; font-size: 0.85rem;
}
.atg-std-head { color: var(--text2); }
.atg-std-head b { color: var(--text); font-weight: 600; }
.atg-std-bar { height: 6px; border-radius: 3px; background: var(--bg-input); overflow: hidden; margin: 8px 0 6px; }
.atg-std-fill { height: 100%; border-radius: 3px; background: var(--amber); }
.atg-std.met .atg-std-fill { background: var(--green); }
.atg-std-pct { font-weight: 600; color: var(--amber); float: right; font-variant-numeric: tabular-nums; }
.atg-std.met .atg-std-pct { color: var(--green); }
.atg-std-you { color: var(--text2); }
.atg-std-hint { color: var(--text3); margin-top: 4px; font-size: 0.8rem; }
.cue-section {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; margin-bottom: 12px;
}
.cue-toggle {
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; font-weight: 600; font-size: 0.9rem;
  background: none; border: none; width: 100%; text-align: left;
  color: var(--text); padding: 0;
}
.cue-toggle::after { content: '▼'; font-size: 0.7rem; color: var(--text3); transition: transform 0.2s; }
.cue-section.collapsed .cue-toggle::after { transform: rotate(-90deg); }
.cue-body { margin-top: 8px; font-size: 0.85rem; color: var(--text2); line-height: 1.5; }
.cue-section.collapsed .cue-body { display: none; }
.cue-label { font-weight: 700; font-size: 0.8rem; color: var(--text); margin: 8px 0 2px; text-transform: uppercase; letter-spacing: 0.03em; }
.cue-label:first-child { margin-top: 0; }
.cue-list { margin: 0; padding-left: 1.2em; }
.cue-list li { margin-bottom: 2px; }
.cue-list.mistakes { list-style: none; padding-left: 0; }
.cue-list.mistakes li::before { content: '❌ '; }
.cue-list.you { list-style: none; padding-left: 0; color: var(--text3); font-style: italic; }
.cue-list.you li::before { content: '→ '; }
.chop-direction { display: inline-block; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
.chop-direction:active { opacity: 0.7; }
.last-session {
  background: var(--bg-input); border-radius: 10px;
  padding: 12px; margin-bottom: 16px; font-size: 0.85rem;
}
.last-session-title { font-weight: 600; margin-bottom: 4px; color: var(--text2); }

/* ===== SET INPUTS ===== */
.sets-header {
  display: grid; grid-template-columns: 50px 1fr 30px 1fr;
  gap: 8px; padding: 0 4px 6px; font-size: 0.75rem;
  color: var(--text3); font-weight: 600; text-transform: uppercase;
}
.set-row {
  display: grid; grid-template-columns: 50px 1fr 30px 1fr;
  gap: 8px; align-items: center; margin-bottom: 8px;
}
.set-label {
  font-size: 0.85rem; font-weight: 600; color: var(--text2);
  text-align: center; padding: 10px 0;
}
.set-input {
  width: 100%; padding: 12px 10px;
  background: var(--bg-input); border: 2px solid var(--border);
  border-radius: 8px; font-size: 1.15rem; font-weight: 600;
  color: var(--text); text-align: center;
  min-height: 48px;
}
.set-input:focus { border-color: var(--accent); outline: none; }
/* "Completed exercise ✓" fills the grey ghost numbers as real values — flash green, settle black */
@keyframes ghostCommit {
  0% { background: var(--green-bg); border-color: var(--green); }
  100% { background: var(--bg-input); border-color: var(--border); }
}
.set-input.ghost-commit { animation: ghostCommit 0.7s ease; }
.set-x { text-align: center; color: var(--text3); font-weight: 600; }
.add-set-btn {
  width: 100%; margin-top: 4px; padding: 12px; min-height: 44px;
  background: transparent; border: 1.5px dashed var(--border);
  border-radius: 8px; color: var(--text2); font-size: 0.9rem; font-weight: 600; cursor: pointer;
}
.add-set-btn:active { opacity: 0.6; }
.bump-note {
  font-size: 0.8rem; color: var(--green); margin-top: -4px; margin-bottom: 8px;
  padding-left: 54px;
}

.notes-field {
  width: 100%; padding: 12px; margin-top: 12px;
  background: var(--bg-input); border: 2px solid var(--border);
  border-radius: 10px; font-size: 0.95rem; color: var(--text);
  resize: vertical; min-height: 60px; line-height: 1.4; overflow-y: hidden;
}
.notes-field:focus { border-color: var(--accent); outline: none; }
.notes-field::placeholder { color: var(--text3); }

/* ===== PROGRESSION BANNER ===== */
.progression-banner {
  padding: 10px 14px; border-radius: 10px; font-size: 0.9rem;
  font-weight: 600; margin-top: 12px;
}
.banner-green { background: var(--green-bg); color: var(--green); }
.banner-amber { background: var(--amber-bg); color: var(--amber); }
.banner-atg { background: var(--bg-input); color: var(--text2); }

/* ===== FIXED SAVE BAR ===== */
.save-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 8px 16px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid var(--border);
  z-index: 100; display: flex; gap: 10px; align-items: center; justify-content: space-between;
  max-width: 500px; margin: 0 auto;
}
.save-bar .auto-saved { font-size: 0.75rem; color: var(--text3); }
.save-bar .done-btn { padding: 10px 24px; border-radius: 10px; font-size: 0.95rem; font-weight: 600; background: var(--accent); color: #fff; border: none; cursor: pointer; }

/* ===== SUMMARY ===== */
.summary-item {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; margin-bottom: 8px;
}
.summary-name { font-weight: 600; font-size: 0.95rem; }
.summary-sets { font-size: 0.85rem; color: var(--text2); margin-top: 4px; }
.summary-notes { font-size: 0.85rem; color: var(--text3); margin-top: 4px; font-style: italic; }
.summary-section { margin-bottom: 20px; }
.summary-section h3 { font-size: 0.9rem; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }

/* ===== IMPORT MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 200; display: flex; align-items: flex-end; justify-content: center;
}
.modal {
  background: var(--bg); border-radius: 16px 16px 0 0;
  padding: 20px; width: 100%; max-width: 500px;
  max-height: 80vh; overflow-y: auto;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
}
.modal h2 { font-size: 1.1rem; margin-bottom: 12px; }
.modal textarea {
  width: 100%; min-height: 200px; padding: 12px;
  background: var(--bg-input); border: 2px solid var(--border);
  border-radius: 10px; font-size: 0.85rem; color: var(--text);
  font-family: monospace; resize: vertical;
}
.modal-actions { display: flex; gap: 10px; margin-top: 12px; }
.modal-actions .btn { flex: 1; }
.import-result { margin-top: 12px; padding: 12px; border-radius: 10px; font-size: 0.85rem; }

/* ===== FINISH-TIME GAP PROMPT ===== */
.gap-group { margin-bottom: 14px; }
.gap-ex-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; }
.gap-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.gap-label { flex: 1; font-size: 0.85rem; color: var(--text2); }
.gap-input {
  width: 96px; min-height: 44px; padding: 8px 10px; text-align: center;
  background: var(--bg-input); border: 2px solid var(--border); border-radius: 10px;
  font-size: 1rem; font-weight: 600; color: var(--text);
}
.gap-note { font-size: 0.85rem; color: var(--text3); margin-bottom: 8px; }
.gap-untouched-row { margin-bottom: 12px; }
.untouched-choice-group { display: flex; gap: 8px; }
.untouched-choice-btn {
  flex: 1; min-height: 44px; padding: 8px 10px;
  background: var(--bg-card); border: 2px solid var(--border); border-radius: 10px;
  font-size: 0.9rem; font-weight: 600; color: var(--text2); cursor: pointer;
}
.untouched-choice-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }

/* ===== VARIANT PILLS ===== */
.variant-pills { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.variant-pill {
  padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
  border: 2px solid var(--border); background: var(--bg-card); color: var(--text2);
  cursor: pointer; min-height: 36px;
}
.variant-pill.active { border-color: var(--accent); background: var(--accent); color: #fff; }

/* ===== TIMER ===== */
.timer-block { margin-bottom: 16px; }
.timer-row {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
}
.timer-side { font-weight: 600; font-size: 0.85rem; color: var(--text2); min-width: 44px; }
.partial-status { font-size: 0.75rem; color: var(--amber); font-weight: 600; }
.skip-status { font-size: 0.95rem; color: var(--text3); font-weight: 600; }
.timer-display { font-size: 2.5rem; font-weight: 700; font-variant-numeric: tabular-nums; flex: 1; text-align: center; }
.timer-btn {
  padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 700;
  border: none; cursor: pointer; min-height: 40px; min-width: 72px;
}
.timer-btn-start { background: var(--green); color: #fff; }
.timer-btn-pause { background: var(--amber); color: #fff; }
.timer-btn-done { background: var(--green-bg); color: var(--green); }
.timer-goal { font-size: 0.85rem; color: var(--text-secondary); font-weight: 400; margin-left: 4px; }
.timer-past-goal { color: var(--green); font-weight: 800; }
.timer-goal-flash { animation: goalFlash 0.5s ease-out 3; }
@keyframes goalFlash { 0%, 100% { background: transparent; } 50% { background: var(--green-bg); } }
.time-adjust { display: flex; gap: 8px; justify-content: center; margin-top: 6px; }
.time-adjust-btn {
  padding: 6px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 600;
  border: 1px solid var(--border); background: var(--bg-input); color: var(--text2);
  cursor: pointer; min-height: 36px;
}
.time-adjust-btn:active { background: var(--border); }

/* ===== PEEK VIEW ===== */
.peek-section {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; margin-top: 16px; overflow: hidden;
}
.peek-toggle {
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; font-weight: 600; font-size: 0.85rem;
  background: none; border: none; width: 100%; text-align: left;
  color: var(--text2); padding: 10px 14px;
}
.peek-toggle::after { content: '▼'; font-size: 0.65rem; color: var(--text3); transition: transform 0.2s; }
.peek-section.collapsed .peek-toggle::after { transform: rotate(-90deg); }
.peek-body { border-top: 1px solid var(--border); }
.peek-section.collapsed .peek-body { display: none; }
.peek-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  cursor: pointer; font-size: 0.85rem;
}
.peek-row:last-child { border-bottom: none; }
.peek-row:active { background: var(--bg-input); }
.peek-num { font-size: 0.75rem; color: var(--text3); min-width: 20px; text-align: right; }
.peek-name { flex: 1; font-weight: 500; }
.peek-meta { font-size: 0.75rem; color: var(--text3); }
.peek-fence { padding: 8px 14px; font-size: 0.75rem; color: var(--fence-color); font-weight: 600; border-bottom: 1px solid var(--border); }
.peek-fence:last-child { border-bottom: none; }

/* ===== COMPLETION TOGGLES ===== */
/* ===== MULTI TIMER ===== */
.multi-timer-block { display: flex; flex-direction: column; gap: 8px; }
.mt-hint { font-size: 0.8rem; color: var(--text3); margin-bottom: 2px; }
.multi-timer-step {
  display: flex; flex-direction: column; align-items: stretch; gap: 8px;
  padding: 12px; border-radius: 10px;
  background: var(--bg-card); border: 1px solid var(--border);
}
.multi-timer-step.active { border-color: var(--accent); background: var(--ss-bg); }
.multi-timer-step.done { border-color: var(--green); background: var(--green-bg); }
.mt-head { display: flex; align-items: center; gap: 8px; }
.multi-timer-step-num { font-size: 0.8rem; font-weight: 700; color: var(--text3); min-width: 20px; text-align: center; }
.multi-timer-step-label { font-size: 0.9rem; font-weight: 600; }
.mt-timeline { display: flex; align-items: baseline; gap: 8px; }
.mt-goal-label { font-size: 0.9rem; color: var(--text3); }
.multi-timer-display {
  font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums;
  min-width: 55px; text-align: left;
}
.mt-controls { display: flex; gap: 8px; }
.mt-controls .multi-timer-btn { flex: 1; min-width: 0; }
.mt-controls .mt-icon { flex: 0 0 48px; min-width: 48px; padding: 8px 0; }
.mt-held { flex: 1; display: flex; align-items: center; font-size: 0.9rem; font-weight: 700; color: var(--green); }
.multi-timer-btn {
  padding: 8px 14px; border: none; border-radius: 8px;
  font-size: 0.85rem; font-weight: 700; cursor: pointer;
  min-height: 44px;
}
.multi-timer-btn-start { background: var(--accent); color: #fff; }
.multi-timer-btn-pause { background: var(--amber); color: #fff; }
.multi-timer-btn-done { background: var(--green); color: #fff; }
.multi-timer-btn-waiting { background: var(--bg-input); color: var(--text2); }

.completion-row {
  display: flex; align-items: center; gap: 16px; justify-content: center;
  padding: 16px; margin-bottom: 12px;
}
.completion-toggle {
  display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer;
}
.completion-toggle .check-box {
  width: 56px; height: 56px; border-radius: 12px; font-size: 1.5rem;
  display: flex; align-items: center; justify-content: center;
  border: 3px solid var(--border); background: var(--bg-card); transition: all 0.15s;
}
.completion-toggle.done .check-box { border-color: var(--green); background: var(--green-bg); }
.completion-toggle .check-label { font-size: 0.8rem; font-weight: 600; color: var(--text2); }

/* ===== UNILATERAL SETS ===== */
.uni-set-group { margin-bottom: 12px; }
.uni-set-label { font-size: 0.85rem; font-weight: 600; color: var(--text2); margin-bottom: 6px; padding-left: 4px; }
.uni-side-row {
  display: grid; grid-template-columns: 28px 1fr 24px 1fr; gap: 6px;
  align-items: center; margin-bottom: 4px;
}
.uni-side-label { font-size: 0.75rem; font-weight: 700; color: var(--text3); text-align: center; }
.uni-col-label { font-size: 0.72rem; font-weight: 700; color: var(--text3); text-align: center; text-transform: uppercase; letter-spacing: 0.03em; }

/* Split reps: per-set weight + L/R reps */
.split-reps-header {
  display: grid; grid-template-columns: 50px 1fr 24px 1fr 24px 1fr; gap: 6px;
  padding: 0 0 6px; font-size: 0.75rem; color: var(--text3); font-weight: 600; text-transform: uppercase;
}
.split-reps-row {
  display: grid; grid-template-columns: 50px 1fr 24px 1fr 24px 1fr; gap: 6px;
  align-items: center; margin-bottom: 8px;
}

/* ===== SLED TRACKING ===== */
.sled-persistent {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px; margin-bottom: 12px;
}
.sled-persistent label { font-size: 0.85rem; font-weight: 600; color: var(--text2); }
.sled-persistent input { width: 80px; margin: 0 8px; }
.sled-set-row {
  display: grid; grid-template-columns: 50px 1fr 1fr 1fr; gap: 6px;
  align-items: center; margin-bottom: 6px;
}
/* Second line of a sled set: push/pull + this set's own length. Kept off the 4-col grid above —
   six controls on one 375px row would each fall under the 44px tap minimum. */
.sled-set-row2 {
  display: flex; gap: 6px; align-items: center;
  margin: 0 0 6px 54px; flex-wrap: wrap;
}
.sled-mode-btn {
  flex: 1 1 0; min-width: 64px; min-height: 44px; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-card); color: var(--text2);
  font-size: 0.9rem; font-weight: 600; cursor: pointer;
}
.sled-mode-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
.sled-set-row2 .sled-len { width: 72px; min-height: 44px; }
.sled-set-row2 .sled-len-unit { font-size: 0.85rem; color: var(--text2); }
.sled-derived { font-size: 0.8rem; color: var(--text3); padding-left: 54px; margin-top: -2px; margin-bottom: 10px; }
/* Prominent, full-width sled stopwatch — the one thing you're staring at while pushing the sled. */
.stopwatch-btn {
  width: 100%; margin: 2px 0 4px; padding: 12px; border-radius: 10px;
  font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums;
  border: 2px solid var(--accent); background: var(--bg-card); color: var(--accent);
  cursor: pointer; min-height: 56px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.stopwatch-btn.running {
  background: var(--red); color: #fff; border-color: var(--red);
  font-size: 2.1rem; min-height: 68px;
}

/* ===== WEIGHT/DISTANCE ===== */
.wd-set-row {
  display: grid; grid-template-columns: 50px 1fr 30px 1fr; gap: 8px;
  align-items: center; margin-bottom: 8px;
}

/* ===== WORKOUT NOTES ===== */
.workout-notes { margin-top: 20px; padding-top: 16px; border-top: 2px solid var(--border); }
.workout-notes label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: var(--text2); }
.workout-notes .notes-field { margin-top: 0; margin-bottom: 12px; }

/* ===== SESSION DETAIL VIEW ===== */
.session-detail-item {
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.session-detail-item:last-child { border-bottom: none; }
.session-detail-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 6px; }
.session-detail-notes { font-size: 0.8rem; color: var(--text3); font-style: italic; margin-top: 6px; white-space: pre-wrap; }
.sd-sets { display: flex; flex-direction: column; gap: 2px; }
.sd-set { font-size: 0.85rem; color: var(--text2); padding: 2px 0; }
.sd-num {
  display: inline-block; width: 18px; height: 18px; line-height: 18px;
  text-align: center; border-radius: 50%; background: var(--bg-input);
  font-size: 0.7rem; font-weight: 600; color: var(--text3); margin-right: 6px;
}

/* ===== EXERCISE HISTORY PAGE ===== */
.history-cues {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px; margin-bottom: 16px;
}
.history-cues-label { font-weight: 600; font-size: 0.85rem; color: var(--text2); margin-bottom: 8px; }
.history-cues-text { font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; }
.history-entry {
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.history-entry:last-child { border-bottom: none; }
.history-entry-date { font-size: 0.8rem; color: var(--text3); margin-bottom: 4px; }
.history-entry-data { font-weight: 500; font-size: 0.9rem; }
.history-entry-notes { font-size: 0.8rem; color: var(--text3); font-style: italic; margin-top: 4px; white-space: pre-wrap; }
/* Which variant a history entry was logged as. History shows ALL variants of an exercise (they're
   one movement's history), so every entry is labelled; the one you currently have selected is
   accented so you can still pick your own out at a glance. */
.history-variant-tag {
  display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
  font-size: 0.7rem; font-weight: 600; vertical-align: middle;
  background: var(--bg-input); color: var(--text2); border: 1px solid var(--border);
}
.history-variant-tag.current { background: var(--accent); color: #fff; border-color: var(--accent); }
.history-link {
  display: inline-block; font-size: 0.8rem; color: var(--accent);
  text-decoration: none; margin-top: 6px; cursor: pointer;
}
.history-link:active { opacity: 0.7; }
</style>

//   timerSeconds: number|null  (countdown duration)
//   repsLabel: 'reps'|'meters'|'steps'|'lengths'  (default: 'reps')

// Per-set equipment stamps (v1.23.0). rdl + pullover can MIX equipment inside one session
// (DB warm-ups → barbell working sets): each set is stamped with the variant that was ACTIVE
// when it was typed (switch the pill mid-exercise; no extra per-row control). The export marks
// only sets that DIFFER from the entry's variant, as a suffix on the weight token
// ("8 @40/bar") — uniform sessions keep today's byte format, so old logs stay byte-stable.
const EQUIP_SUFFIX = {
  'rdl':      { 'db': '/hand', 'barbell': '/bar' },
  'pullover': { 'two-db': '/hand', 'single-db': '/1db' }
};
// The equipment a plain (unsuffixed) weight means on this entry: its stamped variant, else the default.
function entryEquipBase(ex, data) {
  if (data && data.variant) return data.variant;
  if (ex && ex.variants) return (ex.variants.find(v => v.isDefault) || ex.variants[0]).id;
  return null;
}
// Suffix for one set — '' unless the set was logged under the OTHER equipment than the entry's.
function equipMark(ex, data, s) {
  const map = ex && EQUIP_SUFFIX[ex.id];
  if (!map || !s.equip) return '';
  return s.equip === entryEquipBase(ex, data) ? '' : (map[s.equip] || '');
}

// =====================================================
// DATA MODULE — localStorage read/write
// =====================================================
const Data = (function() {
  const SESSIONS_KEY = 'gym-sessions';
  const WIP_KEY = 'gym-session-wip';
  const SLED_LENGTH_KEY = 'gym-sled-length-distance';
  const VARIANT_PREFIX = 'gym-variant-';

  function getSessions() {
    try {
      const parsed = JSON.parse(localStorage.getItem(SESSIONS_KEY));
      if (!Array.isArray(parsed)) return [];
      // Guarantee chronological order (oldest→newest). The whole app assumes newest is LAST — live
      // sessions append, and next-workout / last-session / getLastEntry all read from the end. An
      // imported log can be newest-FIRST, which silently flipped "next" and "last session" (v1.10.2).
      return parsed.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.startedAt || '').localeCompare(b.startedAt || ''));
    } catch { return []; }
  }

  function saveSessions(sessions) {
    try {
      localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions));
    } catch (e) {
      // Show actionable error — link to settings for export/cleanup
      const goSettings = confirm('Storage full! Your data was NOT saved.\n\nGo to Settings to export and delete old sessions?');
      if (goSettings) location.hash = '#/settings';
      throw e; // re-throw so callers like finishSession can handle it
    }
  }

  function addSession(session) {
    const sessions = getSessions();
    sessions.push(session);
    saveSessions(sessions);
  }

    const s = real[real.length - 1];
    let mode = std.loadFrom || (effEx.unilateral === 'split_weight' ? (std.perHand ? 'minSide' : 'sumSides') : 'value');
    // A per-set equipment stamp overrides the pill: the set is interpreted by the equipment it
    // was actually logged under (e.g. a barbell top set inside a dumbbell-variant entry).
    if (s.equip) {
      const raw = ATG_STANDARDS[exId];
      const setStd = raw && !raw.kind && raw[s.equip];
      if (setStd) mode = setStd.loadFrom || 'value';
    }
    let kg = null;
    if (mode === 'minSide') {
      const l = num(s.weightL), r = num(s.weightR);
      kg = (l === null || r === null) ? (l === null ? r : l) : Math.min(l, r);
    } else if (mode === 'sumSides') {
      kg = (num(s.weightL) || 0) + (num(s.weightR) || 0);
    } else {
      kg = num(s.weight);
      if (kg !== null && mode === 'valueX2') kg = kg * 2;
    }
    // Reps: unilateral entries report per side, so the weaker side is the honest number.
    let reps = null;
    if (s.repsL !== undefined || s.repsR !== undefined) {
      const l = num(s.repsL), r = num(s.repsR);
      reps = (l === null || r === null) ? (l === null ? r : l) : Math.min(l, r);
    } else {
      reps = num(s.reps);
    }
    return { kg, reps };
  }

  // Returns null when the exercise has no published standard.
  // pct is weight-driven (encouraging while ramping); `met` requires BOTH weight and reps,
  // which is what turns the bar green — so it never reads "done" on a short set.
  function progress(ex, effEx, activeVariant, lastEntry) {
    const std = resolve(ex.id, activeVariant);
    if (!std) return null;
    const out = { std, kind: std.kind, targetKg: targetKg(std), currentKg: null, currentReps: null, pct: null, weightMet: false, repsMet: false, met: false, hasHistory: false };
    if (std.kind === 'note') return out;

    const last = readLastSet(std, effEx, lastEntry, ex.id);
    out.currentKg = last.kg;
    out.currentReps = last.reps;
    out.hasHistory = (last.kg !== null || last.reps !== null);
    if (!out.hasHistory) return out;

    if (std.kind === 'reps') {
      out.pct = last.reps === null ? null : Math.round((last.reps / std.reps) * 100);
      out.repsMet = last.reps !== null && last.reps >= std.reps;
      out.weightMet = true; // no weight component to this standard
    } else {
      out.pct = last.kg === null ? null : Math.round((last.kg / out.targetKg) * 100);
      out.weightMet = last.kg !== null && last.kg >= out.targetKg - 0.05;
      out.repsMet = !std.reps || (last.reps !== null && last.reps >= std.reps);
    }
    out.met = out.weightMet && out.repsMet;
    return out;
  }

  return { resolve, targetKg, progress };
})();

// =====================================================
// PROGRESSION MODULE — auto-bump + banners
// =====================================================
const Progression = (function() {

  function getWeightStep(progressionType) {
    if (progressionType === 'compound') return 2.5;
    if (progressionType === 'isolation') return 1;
    return 0;
  }

  // Round to 1 decimal to avoid float artifacts (e.g. 42.5 + 2.5 = 45.00000000001)
  function roundWeight(w) { return Math.round(w * 10) / 10; }

  // Parse reps strictly — only pure integers count for progression decisions.
  // parseInt("6+") returns 6 which could falsely trigger a bump.
  function strictReps(val) {
    if (val === null || val === undefined || val === '') return NaN;
    const s = String(val).trim();
    return /^\d+$/.test(s) ? parseInt(s) : NaN;
  }

  function shouldAutoBump(lastSets, repRange, unilateral) {
    if (!repRange || !lastSets || lastSets.length === 0) return false;
    const top = repRange[1];
    if (unilateral === 'split_reps') {
      return lastSets.every(s => {
        const l = strictReps(s.repsL); const r = strictReps(s.repsR);
        return !isNaN(l) && l >= top && !isNaN(r) && r >= top;
      });
    }
    return lastSets.every(s => {
      const r = strictReps(s.reps);
      return !isNaN(r) && r >= top;
    });
  }

  function getPreFill(exerciseId, exercise, variantFilter) {
    const last = State.getLastEntry(exerciseId, variantFilter);
    const result = { weight: '', weightL: '', weightR: '', bumped: false, from: null, lastSets: null };
    if (!last || !last.sets || last.sets.length === 0) return result;
    result.lastSets = last.sets;   // per-set reps ghosting reads what you actually did last time

    // Prefill from the LAST set of the previous session (your top/working set on a ramp),
    // not the first — e.g. a cable squat you build up to. Straight-sets are unaffected.
    const lastSet = last.sets[last.sets.length - 1];

    if (exercise.unilateral === 'split_weight') {
      result.weightL = lastSet.weightL || '';
      result.weightR = lastSet.weightR || '';
      return result;
    }

    if (exercise.unilateral === 'split_reps') {
      // New format: per-set weight; old format: shared last.weight
      const lastWeight = lastSet?.weight ?? last.weight ?? 0;
      if (exercise.repRange && shouldAutoBump(last.sets, exercise.repRange, 'split_reps')) {
        const step = getWeightStep(exercise.progressionType);
        if (step > 0) {
          return { ...result, weight: roundWeight(lastWeight + step), bumped: true, from: lastWeight };
        }
      }
      return { ...result, weight: lastWeight || '' };
    }

    const lastWeight = lastSet.weight || 0;
    if (exercise.repRange && shouldAutoBump(last.sets, exercise.repRange)) {
      const step = getWeightStep(exercise.progressionType);
      if (step > 0) {
        return { ...result, weight: roundWeight(lastWeight + step), bumped: true, from: lastWeight };
      }
    }
    return { ...result, weight: lastWeight || '' };
  }

  function getBanner(sets, exercise) {
    if (!exercise.progressionType) return null;
    if (exercise.progressionType === 'atg') {
      return { type: 'atg', text: 'Add load when form is solid' };
    }
    if (!exercise.repRange) return null;

    const [low, high] = exercise.repRange;

    // Unilateral split_reps: check both sides
    if (exercise.unilateral === 'split_reps') {
      const validSets = sets.filter(s => s.repsL !== undefined && s.repsL !== '' && s.repsR !== undefined && s.repsR !== '');
      if (validSets.length === 0) return null;
      const lAllTop = validSets.every(s => parseInt(s.repsL) >= high);
      const rAllTop = validSets.every(s => parseInt(s.repsR) >= high);
      const lAnyBelow = validSets.some(s => parseInt(s.repsL) < low);
      const rAnyBelow = validSets.some(s => parseInt(s.repsR) < low);

      if (lAllTop && rAllTop) {
        const step = getWeightStep(exercise.progressionType);
        const label = step > 0 ? `+${step}kg` : '';
        return { type: 'green', text: `Both sides at ${high} — add ${label} next session` };
      }
      if (lAnyBelow || rAnyBelow) {
        const lStatus = lAllTop ? 'All at ' + high : 'Below';
        const rStatus = rAllTop ? 'All at ' + high : 'Below';
        return { type: 'amber', text: `L: ${lStatus} · R: ${rStatus} — stay at this weight` };
      }
      return null;
    }

    const validSets = sets.filter(s => s.reps !== null && s.reps !== undefined && s.reps !== '');
    if (validSets.length === 0) return null;

    const allAtTop = validSets.every(s => parseInt(s.reps) >= high);
    const anyBelowBottom = validSets.some(s => parseInt(s.reps) < low);

    if (allAtTop) {
      const step = getWeightStep(exercise.progressionType);
      const label = step > 0 ? `+${step}kg` : '';
      return { type: 'green', text: `All sets at ${high} — add ${label} next session` };
    }
    if (anyBelowBottom) {
      return { type: 'amber', text: `Below range — stay at this weight` };
    }
    return null;
  }

  return { getPreFill, getBanner, shouldAutoBump };
})();

// =====================================================
// MARKDOWN MODULE — export + import
// =====================================================
const Markdown = (function() {

  function formatDate(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function resolveDisplayName(ex, data) {
    if (!data.variant || !ex.variants) return ex.name;
    const variant = ex.variants.find(v => v.id === data.variant);
    if (!variant || variant.isDefault) return ex.name;
    return variant.label;
  }

  function formatNotes(notes) {
    if (!notes) return '';
    const lines = notes.split('\n').filter(l => l.trim());
    return lines.map((line, i) => i === 0 ? `  - ${line}\n` : `    ${line}\n`).join('');
  }

  function exportSession(session) {
    const workout = PROGRAMME.find(w => w.id === session.workoutId);
    if (!workout) return '';

    let md = `## ${formatDate(session.date)} — Workout ${workout.id} (${workout.name})\n\n`;

    if (session.gym) md += `**Gym:** ${session.gym}\n`;
    if (session.startedAt) {
      const startTime = Timer.formatTimeOfDay(session.startedAt);
      if (session.completedAt) {
        const endTime = Timer.formatTimeOfDay(session.completedAt);
        const durStr = Timer.formatDuration(new Date(session.completedAt) - new Date(session.startedAt));
        md += `**Time:** ${startTime} → ${endTime} (${durStr})\n`;
      } else {
        md += `**Time:** ${startTime}\n`;
      }
    }
    if (session.overall) md += `**Overall:** ${session.overall}\n`;
    if (session.injuries) md += `**Injuries:** ${session.injuries}\n`;
    if (session.gym || session.startedAt || session.overall || session.injuries) md += '\n';

    for (const [idx, data] of Object.entries(session.exercises)) {
      const ex = (data.exId && workout.exercises.find(e => e.id === data.exId)) || workout.exercises[parseInt(idx)];
      if (!ex || ex.isFence) continue;

      const displayName = resolveDisplayName(ex, data);
      const wLabel = ex.weightLabel || 'kg';
      // Resolve variant overrides for repRange
      const activeVariant = data.variant && ex.variants ? ex.variants.find(v => v.id === data.variant) : null;
      const effectiveRepRange = activeVariant?.repRange || ex.repRange;

      // Skip-stated (v1.18.0): an explicit "skipped"/"not logged" declaration from the finish-time
      // sweep. Only entries with this field emit the line — old sessions never had it, so their
      // export is byte-identical to before.
      if (data.skipState) {
        md += `- **${displayName}** — ${data.skipState === 'skipped' ? 'skipped' : 'not logged'}\n`;
        md += formatNotes(data.notes);
        md += '\n';
        continue;
      }

      // Multi-timer exercises
      if (data.timerSteps !== undefined) {
        const doneCount = data.timerSteps.filter(s => s.done).length;
        const totalCount = ex.timerSequence ? ex.timerSequence.length : data.timerSteps.length;
        const stepDetails = data.timerSteps.map((s, i) => {
          const label = ex.timerSequence?.[i]?.label || `Step ${i+1}`;
          return s.done ? `${label}: ${s.time}s` : `${label}: —`;
        }).join(', ');
        md += `- **${displayName}** — ${doneCount}/${totalCount} positions (${stepDetails})\n`;
        md += formatNotes(data.notes);
        md += '\n';
        continue;
      }

      // Duration/completion exercises
      if (data.done !== undefined || data.doneL !== undefined) {
        if (data.doneL !== undefined) {
          const tL = data.timeL ? `(${data.timeL}s)` : '';
          const tR = data.timeR ? `(${data.timeR}s)` : '';
          md += `- **${displayName}** — L${data.doneL ? '✅' : '—'}${tL} R${data.doneR ? '✅' : '—'}${tR}\n`;
        } else {
          const t = data.time ? `(${data.time}s)` : '';
          md += `- **${displayName}** — ${data.done ? '✅' : '—'}${t}\n`;
        }
        md += formatNotes(data.notes);
        md += '\n';
        continue;
      }

      if (!data.sets || data.sets.length === 0) continue;
      const s0 = data.sets[0];

      // Sled — per-set lengthM (recorded at save time) wins over the current setting, so history
      // logged at a different gym/track length re-exports with the length it was actually done at.
      // v1.24.0: ghost rows are dropped (sledRowIsReal), and 2+ real rows emit ONE line with
      // per-set tokens — separate lines per set would collide on import (one exercise slot).
      // lengthM is emitted once, from the first real row: the app stamps every row with the same
      // setting at save time, so mixed values can only come from hand-editing — that case
      // normalizes on the first round-trip (md1→md2 only; md2===md3 holds).
      if (s0.lengths !== undefined) {
        const sledLength = Data.getSledLength();
        const rows = data.sets.filter(s => State.sledRowIsReal(data, s));
        if (rows.length === 0) continue;   // all-ghost → no line (matches the standard branch)
        // v1.25.0 made length per-set and added push/pull. The format is ADDITIVE: when every row
        // shares one length and nothing is tagged push/pull — i.e. every session logged before
        // v1.25.0 — the two legacy lines below are emitted byte-for-byte unchanged, so the whole
        // historical log re-exports identically. Only a mixed-length or tagged session earns the
        // richer per-set grammar (which carries its own ×Nm and therefore drops `length = X`).
        const rowLen = s => s.lengthM || sledLength;
        const uniformLen = rows.every(s => rowLen(s) === rowLen(rows[0]));
        const anyMode = rows.some(s => s.mode === 'push' || s.mode === 'pull');
        if (uniformLen && !anyMode && rows.length === 1) {
          const s = rows[0];
          const len = rowLen(s);
          const dist = s.lengths * len;
          md += `- **${displayName}** — 1×(${s.lengths} lengths, ${Timer.formatTime(s.timeSeconds||0)}) @ ${s.weight||0}kg (length = ${len}m, total ~${Math.round(dist)}m)\n`;
        } else if (uniformLen && !anyMode) {
          const len = rowLen(rows[0]);
          const total = Math.round(rows.reduce((n, s) => n + (s.lengths || 0), 0) * len);
          const body = rows.map(s => `${s.lengths || 0} length${(s.lengths || 0) === 1 ? '' : 's'} ${Timer.formatTime(s.timeSeconds||0)} @${s.weight||0}kg`).join(', ');
          md += `- **${displayName}** — ${rows.length}×(${body}) (length = ${len}m, total ~${total}m)\n`;
        } else {
          const total = Math.round(rows.reduce((n, s) => n + (s.lengths || 0) * rowLen(s), 0));
          const body = rows.map(s => {
            const n = s.lengths || 0;
            const tag = (s.mode === 'push' || s.mode === 'pull') ? `${s.mode} ` : '';
            return `${tag}${n} length${n === 1 ? '' : 's'} ×${rowLen(s)}m ${Timer.formatTime(s.timeSeconds||0)} @${s.weight||0}kg`;
          }).join(', ');
          md += `- **${displayName}** — ${rows.length}×(${body}) (total ~${total}m)\n`;
        }
        md += formatNotes(data.notes);
        md += '\n';
        continue;
      }

      // Sled — Plyometrics prep (v1.26.0): metres typed per set, one timer each, no lengths.
      // Distinct key (`metres`, not `distance`) so it can never collide with farmer's carry below.
      if (s0.metres !== undefined) {
        const rows = data.sets.filter(s => State.sledRowIsReal(data, s));
        if (rows.length === 0) continue;   // all-ghost → no line
        const total = Math.round(rows.reduce((n, s) => n + (parseFloat(s.metres) || 0), 0));
        const body = rows.map(s => {
          const tag = (s.mode === 'push' || s.mode === 'pull') ? `${s.mode} ` : '';
          return `${tag}${s.metres || 0}m ${Timer.formatTime(s.timeSeconds||0)} @${s.weight||0}kg`;
        }).join(', ');
        md += `- **${displayName}** — ${rows.length}×(${body}) (total ~${total}m)\n`;
        md += formatNotes(data.notes);
        md += '\n';
        continue;
      }

      // Weight/distance (farmer's carry)
      if (s0.distance !== undefined) {
        const validSets = data.sets.filter(s => s.distance);
        const weights = validSets.map(s => parseFloat(s.weight) || 0);
        const allSameWeight = weights.length > 0 && weights.every(w => Math.abs(w - weights[0]) < 0.01);
        let setsStr, weightStr;
        if (allSameWeight) {
          setsStr = validSets.map(s => s.distance + 'm').join(', ');
          weightStr = ` @ ${weights[0]}${wLabel}`;
        } else {
          setsStr = validSets.map(s => `${s.distance}m @${s.weight||0}`).join(', ');
          weightStr = ` ${wLabel}`;
        }
        md += `- **${displayName}** — ${validSets.length}×(${setsStr})${weightStr}\n`;
        md += formatNotes(data.notes);
        md += '\n';
        continue;
      }

      // Unilateral split_weight
      if (s0.weightL !== undefined) {
        const validSets = data.sets.filter(s => State.setIsClaimed(data, s) && (s.repsL !== '' || s.repsR !== ''));
        if (validSets.length === 0) continue;
        const known = w => w !== '' && w !== undefined && w !== null;
        const anyKnown = validSets.some(s => known(s.weightL) || known(s.weightR));
        // cable-chop records which cable-anchor direction it was done in (alternates hi→lo / lo→hi each W6)
        const chopDir = (ex.id === 'cable-chop' && data.chopDirection)
          ? ` (${data.chopDirection === 'hi_lo' ? 'Hi→Lo' : 'Lo→Hi'})` : '';
        let body;
        if (!anyKnown) {
          // Weights genuinely unrecorded (e.g. legacy "@ varies" imports) — stay honest & byte-stable
          const setsStr = validSets.map(s => `L${s.repsL}/R${s.repsR}`).join(', ');
          body = `${validSets.length}×(${setsStr}) @ varies`;
        } else {
          const allSameW = validSets.every(s => s.weightL === validSets[0].weightL && s.weightR === validSets[0].weightR);
          if (allSameW) {
            const setsStr = validSets.map(s => `L${s.repsL}/R${s.repsR}`).join(', ');
            body = `${validSets.length}×(${setsStr}) @ L:${validSets[0]?.weightL||0}${wLabel} R:${validSets[0]?.weightR||0}${wLabel}`;
          } else {
            // Varying known weights — per-set grammar (lossless, re-importable). Was "@ varies" (dropped the kg) pre-v1.10.
            const perSet = validSets.map(s => `L${s.repsL}/R${s.repsR} @ L:${s.weightL||0}${wLabel} R:${s.weightR||0}${wLabel}`).join(', ');
            body = `${validSets.length}×(${perSet})`;
          }
        }
        md += `- **${displayName}** — ${body}${chopDir}\n`;
        md += formatNotes(data.notes);
        md += '\n';
        continue;
      }

      // Unilateral split_reps
      if (s0.repsL !== undefined) {
        const validSets = data.sets.filter(s => State.setIsClaimed(data, s) && (s.repsL !== '' || s.repsR !== ''));
        if (validSets.length === 0) continue;
        if (s0.weight !== undefined) {
          // New format: per-set weight
          const weights = validSets.map(s => parseFloat(s.weight) || 0);
          const allSameW = weights.length > 0 && weights.every(w => Math.abs(w - weights[0]) < 0.01);
          if (allSameW) {
            const setsStr = validSets.map(s => `L${s.repsL}/R${s.repsR}`).join(', ');
            md += `- **${displayName}** — ${validSets.length}×(${setsStr}) @ ${weights[0]}${wLabel}\n`;
          } else {
            const setsStr = validSets.map(s => `${s.weight||0}${wLabel} L${s.repsL}/R${s.repsR}`).join(', ');
            md += `- **${displayName}** — ${setsStr}\n`;
          }
        } else {
          // Old format: shared weight
          const setsStr = validSets.map(s => `L${s.repsL}/R${s.repsR}`).join(', ');
          const weight = parseFloat(data.weight) || 0;
          md += `- **${displayName}** — ${validSets.length}×(${setsStr}) @ ${weight}${wLabel}\n`;
        }
        md += formatNotes(data.notes);
        md += '\n';
        continue;
      }

      // Standard weight×reps or reps_only. Keep a set if it has reps OR a weight the user actually
      // entered — a weight-only set is a real logged load; silently dropping it lost kg from the backup.
      const stdHasReps = s => s.reps !== null && s.reps !== undefined && s.reps !== '' && parseInt(s.reps) !== 0;
      const stdWeightOnly = s => (s.reps === null || s.reps === undefined || s.reps === '')
        && (s.weight !== null && s.weight !== undefined && s.weight !== '')
        && (s.touched === undefined || s.touched);
      // Assisted reps (assist-machine pull-ups/dips, v1.17.0): a set is real if it carries an
      // assisted count too, even with unassisted 0/blank (a fully-assisted rep is still a rep).
      const stdHasAssisted = s => s.repsAssisted !== null && s.repsAssisted !== undefined && s.repsAssisted !== '';
      const validSets = data.sets.filter(s => State.setIsClaimed(data, s) && (stdHasReps(s) || stdWeightOnly(s) || stdHasAssisted(s)));
      if (validSets.length === 0) continue;

      // '?' = value left blank (round-trips to ''). Assisted sets append '+Na' — unassisted 0 is
      // shown explicitly (never omitted), so "0+6a" (all-assisted) round-trips losslessly.
      const repCell = s => {
        if (!stdHasAssisted(s)) return stdHasReps(s) ? s.reps : '?';
        const uReps = (s.reps === null || s.reps === undefined || s.reps === '') ? '?' : s.reps;
        return `${uReps}+${s.repsAssisted}a`;
      };
      const weights = validSets.map(s => parseFloat(s.weight) || 0);
      const allSameWeight = weights.length > 0 && weights.every(w => Math.abs(w - weights[0]) < 0.01);
      // A mixed-equipment entry always uses the per-set grammar — the suffix rides the weight token.
      const anyEquipMark = validSets.some(s => equipMark(ex, data, s));
      let setsStr, weightStr;
      if (allSameWeight && !anyEquipMark) {
        setsStr = validSets.map(repCell).join(', ');
        weightStr = weights[0] ? ` @ ${weights[0]}${wLabel}` : ' @ BW';
      } else {
        setsStr = validSets.map(s => `${repCell(s)} @${parseFloat(s.weight)||0}${equipMark(ex, data, s)}`).join(', ');
        weightStr = ` ${wLabel}`;
      }

      md += `- **${displayName}** — ${validSets.length}×(${setsStr})${weightStr}\n`;

      // Flag rep discrepancies vs target range
      if (effectiveRepRange) {
        const [low, high] = effectiveRepRange;
        const repValues = validSets.map(s => parseInt(s.reps)).filter(r => !isNaN(r));
        const over = repValues.filter(r => r > high);
        const under = repValues.filter(r => r < low);
        if (over.length > 0) md += `  - ⬆️ ${over.length} set${over.length > 1 ? 's' : ''} above target ${high} reps\n`;
        if (under.length > 0) md += `  - ⬇️ ${under.length} set${under.length > 1 ? 's' : ''} below target ${low} reps\n`;
      }

      md += formatNotes(data.notes);
      md += '\n';
    }

    return md;
  }

  function exportAll() {
    const sessions = Data.getSessions();
    if (sessions.length === 0) return '# Training Log\n\nNo sessions recorded yet.\n';
    let md = '# Training Log\n\n';
    // Sort by date ascending
    const sorted = [...sessions].sort((a, b) => a.date.localeCompare(b.date));
    for (const s of sorted) {
      md += exportSession(s);
      md += '---\n\n';
    }
    return md;
  }

  // Build lookup map for fuzzy matching (includes old names via aliases + variant labels)
  function buildLookup() {
    const map = {};
    for (const w of PROGRAMME) {
      for (let i = 0; i < w.exercises.length; i++) {
        const ex = w.exercises[i];
        if (ex.isFence) continue;
        const norm = ex.name.toLowerCase().replace(/[^a-z0-9]/g, '');
        if (!map[norm]) map[norm] = { id: ex.id, name: ex.name };
        // Add variant labels so exported variant names can be re-imported
        if (ex.variants) {
          for (const v of ex.variants) {
            const vNorm = v.label.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (!map[vNorm]) map[vNorm] = { id: ex.id, name: ex.name, variantId: v.id };
          }
        }
      }
    }
    // Add old names that map to new IDs
    const oldNames = {
      'reversesleddedmilling': 'sled',
      'reversesled': 'sled',
      'pushpullsled': 'sled',
      'atgsplitsquat': 'atg-split-squat',
      'atglunge': 'atg-lunge',
      'atglungewalking': 'atg-lunge',
      'singlelegcalfraise': 'sl-calf-raise',
      'slcalfraise': 'sl-calf-raise',
      'slcalfraisestanding': 'sl-calf-raise',
      'hamcurlactivation': 'ham-curl',   // historical one-off label (W4, 15 Apr) → the W4 ham-curl slot
    };
    for (const [norm, id] of Object.entries(oldNames)) {
      if (!map[norm]) {
        const ex = PROGRAMME.flatMap(w => w.exercises).find(e => e.id === id);
        if (ex) map[norm] = { id: ex.id, name: ex.name };
      }
    }
    return map;
  }

  const LOOKUP = buildLookup();

  function matchExercise(name) {
    const norm = name.toLowerCase().replace(/[^a-z0-9]/g, '');
    // Exact match first
    if (LOOKUP[norm]) return LOOKUP[norm];
    // Partial: prefer key-contains-query (tightest container = shortest key)
    let contain = null, containLen = Infinity;
    // Fallback: query-contains-key (most specific = longest key)
    let within = null, withinLen = 0;
    for (const [key, val] of Object.entries(LOOKUP)) {
      if (key.includes(norm) && key.length < containLen) {
        contain = val; containLen = key.length;
      } else if (norm.includes(key) && key.length > withinLen) {
        within = val; withinLen = key.length;
      }
    }
    return contain || within || null;
  }

  function importMarkdown(text) {
    const sessions = [];
    const blocks = text.split(/^## /m).filter(b => b.trim());
    let matched = 0, unmatched = 0, unmatchedNames = [];
    const skippedSessions = [];   // ## blocks meant to be sessions that couldn't be parsed
    const skippedLines = [];      // exercise lines that couldn't be read/placed — never dropped silently
    const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
    // Capture a possibly-multi-line metadata value: first line's text + following lines up to the
    // next **Field:**, with trailing blank lines trimmed (they're the separator before exercises).
    const captureBlock = (arr, startIdx, endIdx, isField, firstText) => {
      const out = [firstText];
      for (let j = startIdx + 1; j < endIdx; j++) {
        if (isField(arr[j])) break;
        out.push(arr[j]);
      }
      while (out.length && out[out.length - 1].trim() === '') out.pop();
      return out.join('\n');
    };

    for (const block of blocks) {
      const lines = block.split('\n');
      // Parse date and workout number
      const headerMatch = lines[0].match(/(\d{1,2}\s+\w+\s+\d{4}).*?Workout\s*(\d)/i);
      if (!headerMatch) {
        if (/workout/i.test(lines[0])) skippedSessions.push({ header: lines[0].trim(), reason: 'could not read date or workout number from the heading' });
        continue;
      }

      const dateStr = headerMatch[1];
      const workoutId = parseInt(headerMatch[2]);
      // Parse to YYYY-MM-DD (use local date to avoid timezone shifts)
      const d = new Date(dateStr + ' 12:00:00');
      const date = isNaN(d.getTime()) ? dateStr : `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

      const workout = PROGRAMME.find(w => w.id === workoutId);
      if (!workout) { skippedSessions.push({ header: lines[0].trim(), reason: `no Workout ${workoutId} in the current programme` }); continue; }

      // Workout-local exercise lookup (this workout's exercise names + variant labels). Checked before
      // the global first-writer-wins LOOKUP so a name shared across workouts resolves to the LOCAL slot
      // (e.g. "Ham curl (seated)" → W4's ham-curl exercise, not W1's nordic-curl variant of the same label).
      const localLookup = {};
      for (const ex of workout.exercises) {
        if (ex.isFence) continue;
        const n = norm(ex.name);
        if (!localLookup[n]) localLookup[n] = { id: ex.id, name: ex.name };
        if (ex.variants) for (const v of ex.variants) {
          const vn = norm(v.label);
          if (!localLookup[vn]) localLookup[vn] = { id: ex.id, name: ex.name, variantId: v.id };
        }
      }

      const session = { workoutId, date, startedAt: '', exercises: {}, overall: '', injuries: '', gym: '' };
      const placedNames = {};   // exIdx → source name of the line that filled it (for collision reporting)

      // --- Metadata (everything above the first exercise bullet) ---
      // Gym single-line; Time → startedAt/completedAt (local wall-clock); Overall/Injuries may span lines.
      const firstExIdx = lines.findIndex(l => /^-\s+\*\*/.test(l));
      const metaEnd = firstExIdx >= 0 ? firstExIdx : lines.length;
      const isMetaField = l => /^\*\*(Gym|Time|Overall|Injur\w*):\*\*/.test(l);
      const toIso = (h, m) => new Date(`${date}T${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`).toISOString();
      for (let li = 1; li < metaEnd; li++) {
        const line = lines[li];
        const gymMatch = line.match(/^\*\*Gym:\*\*\s*(.+)/);
        if (gymMatch) { session.gym = gymMatch[1].trim(); continue; }
        const timeMatch = line.match(/^\*\*Time:\*\*\s*(\d{1,2}):(\d{2})(?:\s*→\s*(\d{1,2}):(\d{2}))?/);
        if (timeMatch) {
          session.startedAt = toIso(timeMatch[1], timeMatch[2]);
          if (timeMatch[3]) {
            let end = toIso(timeMatch[3], timeMatch[4]);
            if (new Date(end) < new Date(session.startedAt)) end = new Date(new Date(end).getTime() + 86400000).toISOString(); // crossed midnight
            session.completedAt = end;
          }
          continue;
        }
        const ovMatch = line.match(/^\*\*Overall:\*\*\s*(.*)/);
        if (ovMatch) { session.overall = captureBlock(lines, li, metaEnd, isMetaField, ovMatch[1]); continue; }
        const injMatch = line.match(/^\*\*Injur\w*:\*\*\s*(.*)/);
        if (injMatch) { session.injuries = captureBlock(lines, li, metaEnd, isMetaField, injMatch[1]); continue; }
      }

      // Parse exercises
      let currentExNotes = null;
      for (const line of lines) {
        const noteMatch = line.match(/^\s+-\s+(.+)/);

        // Try each format in order of specificity
        let parsed = null;
        let exName = null;
        let variantId = null;
        let chopDirection = null;   // cable-chop anchor direction, from a trailing "(Hi→Lo)"/"(Lo→Hi)" marker

        // Extract exercise name (with optional variant)
        const nameMatch = line.match(/^-\s+\*\*(.+?)\*\*\s*(?:\[(\w[\w-]*)\])?\s*—\s*(.*)/);
        if (nameMatch) {
          exName = nameMatch[1];
          variantId = nameMatch[2] || null;
          let rest = nameMatch[3].trim();
          // Strip a trailing chop-direction marker (cable-chop only) before the value parsers run.
          const chopM = rest.match(/\s*\((Hi→Lo|Lo→Hi)\)$/i);
          if (chopM) { chopDirection = /hi→lo/i.test(chopM[1]) ? 'hi_lo' : 'lo_hi'; rest = rest.slice(0, chopM.index).trim(); }

          // -1. Skip-stated (v1.18.0): "skipped" or "not logged" — no sets, an explicit declaration.
          // Exact match only — "skipped extra text" is malformed and falls through to skippedLines,
          // never silently misread as a skip.
          if (rest === 'skipped') parsed = { skipState: 'skipped' };
          else if (rest === 'not logged') parsed = { skipState: 'not-logged' };

          // 0. Multi-timer: 3/4 positions (Left — straight leg (gastroc): 30s, ... : —)
          const mtMatch = rest.match(/^\d+\/\d+\s+positions?\s*\((.*)\)\s*$/);
          if (mtMatch) {
            const inner = mtMatch[1].trim();
            const steps = inner === '' ? [] : inner.split(', ').map(part => {   // "0/4 positions ()" → [] (round-trips exactly)
              const ci = part.lastIndexOf(': ');
              const val = ci >= 0 ? part.slice(ci + 2).trim() : '';
              if (val === '' || val === '—') return { done: false };
              const t = parseInt(val);
              return { done: true, time: isNaN(t) ? 0 : t };
            });
            parsed = { timerSteps: steps };
          }

          // 1. Completion unilateral: L✅(52s) R—(0s) or L✅ R✅
          const compUni = rest.match(/^L([✅—])(?:\((\d+)s\))?\s*R([✅—])(?:\((\d+)s\))?$/);
          if (compUni) {
            parsed = { doneL: compUni[1] === '✅', doneR: compUni[3] === '✅' };
            if (compUni[2]) parsed.timeL = parseInt(compUni[2]);
            if (compUni[4]) parsed.timeR = parseInt(compUni[4]);
          }

          // 2. Completion bilateral: ✅(48s) or just ✅ or —
          if (!parsed) {
            const compBi = rest.match(/^([✅—])(?:\((\d+)s\))?$/);
            if (compBi) {
              parsed = { done: compBi[1] === '✅' };
              if (compBi[2]) parsed.time = parseInt(compBi[2]);
            }
          }

          // 3. Sled: 1×(8 lengths, 2:30) @ 30kg (length = 15m, total ~120m)  [also accepts [] for compat]
          if (!parsed) {
            const sledMatch = rest.match(/^\d+×[\[(](\d+)\s*lengths?,\s*(\d+:\d{2})[\])]\s*@\s*([\d.]+)kg\s*\(length\s*=\s*([\d.]+)m/);
            if (sledMatch) {
              const timeParts = sledMatch[2].split(':');
              const timeSeconds = parseInt(timeParts[0]) * 60 + parseInt(timeParts[1]);
              parsed = { sets: [{ weight: parseFloat(sledMatch[3]), lengths: parseInt(sledMatch[1]), timeSeconds, lengthM: parseFloat(sledMatch[4]) }] };
            }
          }

          // 3b. Sled, multi-set (v1.24.0): 3×(1 length 0:52 @70kg, 2 lengths 1:44 @65kg) (length = 50m, total ~200m)
          // Every token must parse AND the token count must match the N× prefix — otherwise the
          // whole line falls through to skippedLines (nothing-silent), never a partial import.
          if (!parsed) {
            const msSled = rest.match(/^(\d+)×\((.+)\)\s*\(length\s*=\s*([\d.]+)m/);
            if (msSled && /\blengths?\b/.test(msSled[2])) {
              const lengthM = parseFloat(msSled[3]);
              const rows = msSled[2].split(', ').map(p => {
                const t = p.trim().match(/^(\d+)\s+lengths?\s+(\d+:\d{2})\s*@\s*([\d.]+)kg$/);
                if (!t) return null;
                const tp = t[2].split(':');
                return { weight: parseFloat(t[3]), lengths: parseInt(t[1]), timeSeconds: parseInt(tp[0]) * 60 + parseInt(tp[1]), lengthM };
              });
              if (rows.every(Boolean) && rows.length === parseInt(msSled[1])) parsed = { sets: rows };
            }
          }

          // 3c. Sled, per-set length + push/pull (v1.25.0):
          //     2×(push 1 length ×20m 0:52 @70kg, pull 2 lengths ×20m 1:44 @65kg) (total ~60m)
          // Each token carries its OWN ×Nm, so there is no trailing `length = X` to lean on.
          // Same all-or-nothing contract as 3b: every token must parse AND the count must match the
          // N× prefix, else the line falls through to skippedLines — never a partial import.
          if (!parsed) {
            const psSled = rest.match(/^(\d+)×\((.+)\)\s*\(total\s*~[\d.]+m\)$/);
            if (psSled && /\blengths?\b/.test(psSled[2])) {
              const rows = psSled[2].split(', ').map(p => {
                const t = p.trim().match(/^(?:(push|pull)\s+)?(\d+)\s+lengths?\s+×([\d.]+)m\s+(\d+:\d{2})\s*@\s*([\d.]+)kg$/);
                if (!t) return null;
                const tp = t[4].split(':');
                const row = { weight: parseFloat(t[5]), lengths: parseInt(t[2]), timeSeconds: parseInt(tp[0]) * 60 + parseInt(tp[1]), lengthM: parseFloat(t[3]) };
                if (t[1]) row.mode = t[1];
                return row;
              });
              if (rows.every(Boolean) && rows.length === parseInt(psSled[1])) parsed = { sets: rows };
            }
          }

          // 3d. Sled — Plyometrics prep (v1.26.0): 3×(push 20m 0:22 @50kg, pull 20m 0:25 @50kg) (total ~40m)
          // No `lengths` token at all — that word is what separates this from 3c above. Same
          // all-or-nothing contract: any unparseable token sends the whole line to skippedLines.
          if (!parsed) {
            const plyo = rest.match(/^(\d+)×\((.+)\)\s*\(total\s*~[\d.]+m\)$/);
            if (plyo && !/\blengths?\b/.test(plyo[2])) {
              const rows = plyo[2].split(', ').map(p => {
                const t = p.trim().match(/^(?:(push|pull)\s+)?([\d.]+)m\s+(\d+:\d{2})\s*@\s*([\d.]+)kg$/);
                if (!t) return null;
                const tp = t[3].split(':');
                const row = { weight: parseFloat(t[4]), metres: parseFloat(t[2]), timeSeconds: parseInt(tp[0]) * 60 + parseInt(tp[1]) };
                if (t[1]) row.mode = t[1];
                return row;
              });
              if (rows.every(Boolean) && rows.length === parseInt(plyo[1])) parsed = { sets: rows };
            }
          }

          // 4. Weight/distance: 3×(40m,35m,30m) @ 22kg/hand
          if (!parsed) {
            const wdMatch = rest.match(/^(\d+)×[\[(]([^\])]+)[\])]\s*@\s*([\d.]+)kg/);
            if (wdMatch && wdMatch[2].includes('m') && !wdMatch[2].includes('/')) {
              const distances = wdMatch[2].split(',').map(d => parseInt(d.trim()));
              parsed = { sets: distances.map(d => ({ weight: parseFloat(wdMatch[3]), distance: d })) };
            }
          }

          // 5. Split_weight: 3×(L10/R10,L8/R9) @ L:5kg R:5kg
          if (!parsed) {
            const swMatch = rest.match(/^(\d+)×[\[(]([^\])]+)[\])]\s*@\s*L:([\d.]+)kg\s*R:([\d.]+)kg/);
            if (swMatch) {
              const pairs = swMatch[2].split(',').map(p => {
                const lr = p.trim().match(/L(\d+)\/R(\d+)/);
                return lr ? { weightL: parseFloat(swMatch[3]), repsL: parseInt(lr[1]), weightR: parseFloat(swMatch[4]), repsR: parseInt(lr[2]) } : null;
              }).filter(Boolean);
              parsed = { sets: pairs };
            }
          }

          // 5a. Split_weight, per-set varying weights: 3×(L10/R10 @ L:6kg R:5kg, L10/R10 @ L:5kg R:5kg)
          if (!parsed) {
            const swPer = rest.match(/^(\d+)×[\[(](.+)[\])]$/);
            if (swPer && /@\s*L:/.test(swPer[2])) {
              const pairs = swPer[2].split(', ').map(p => {
                const m = p.trim().match(/^L(\d+)\/R(\d+)\s*@\s*L:([\d.]+)kg\s*R:([\d.]+)kg$/);
                return m ? { weightL: parseFloat(m[3]), repsL: parseInt(m[1]), weightR: parseFloat(m[4]), repsR: parseInt(m[2]) } : null;
              });
              if (pairs.every(Boolean)) parsed = { sets: pairs };
            }
          }

          // 5b. Split_weight, weights unrecorded (legacy "@ varies"): 3×(L10/R10, L10/R10) @ varies
          if (!parsed) {
            const swVar = rest.match(/^(\d+)×[\[(]([^\])]+)[\])]\s*@\s*varies\b/i);
            if (swVar) {
              const pairs = swVar[2].split(',').map(p => {
                const lr = p.trim().match(/L(\d+)\/R(\d+)/);
                return lr ? { weightL: '', repsL: parseInt(lr[1]), weightR: '', repsR: parseInt(lr[2]) } : null;
              }).filter(Boolean);
              if (pairs.length) parsed = { sets: pairs };
            }
          }

          // 5c. Split_reps, per-set leading weight (no N× wrapper): 9kg L5/R6, 7kg L5/R5, 7kg L5/R5
          if (!parsed && /^[\d.]+kg\s+L\d+\/R\d+/.test(rest)) {
            const setsPer = rest.split(',').map(p => {
              const m = p.trim().match(/^([\d.]+)kg\s+L(\d+)\/R(\d+)$/);
              return m ? { weight: parseFloat(m[1]), repsL: parseInt(m[2]), repsR: parseInt(m[3]) } : null;
            });
            if (setsPer.every(Boolean)) parsed = { sets: setsPer };
          }

          // 6. Split_reps: 5×(L6/R8,L7/R7) @ 20kg
          if (!parsed) {
            const srMatch = rest.match(/^(\d+)×[\[(]([^\])]+)[\])]\s*@\s*([\d.]+)kg/);
            if (srMatch && srMatch[2].includes('L') && srMatch[2].includes('/R')) {
              const pairs = srMatch[2].split(',').map(p => {
                const lr = p.trim().match(/L(\d+)\/R(\d+)/);
                return lr ? { repsL: parseInt(lr[1]), repsR: parseInt(lr[2]) } : null;
              }).filter(Boolean);
              parsed = { weight: parseFloat(srMatch[3]), sets: pairs };
            }
          }

          // Rep-cell parser shared by 7a/7b: plain int, '?' (blank/logged-weight-only), or the
          // assisted-reps grammar 'N+Ma' / '?+Ma' (v1.17.0, e.g. "4+2a" or all-assisted "0+6a").
          // A token containing '+' is an assisted-reps attempt — must match the grammar or the
          // caller aborts the WHOLE line (malformed "4+a" gets REPORTED, never misread as reps 4).
          // Anything else falls back to the pre-v1.17.0 lenient parse (kept byte-for-byte so
          // pre-existing odd tokens like a stray unit-suffixed value keep parsing as before).
          const parseRepCell = raw => {
            const tok = raw.trim();
            if (tok === '?') return { reps: '' };
            let am = tok.match(/^(\d+)\+(\d+)a$/);
            if (am) return { reps: parseInt(am[1]), repsAssisted: parseInt(am[2]) };
            am = tok.match(/^\?\+(\d+)a$/);
            if (am) return { reps: '', repsAssisted: parseInt(am[1]) };
            if (tok.includes('+')) return null;
            return { reps: parseInt(tok) || tok };
          };

          // 7a. Per-set weights: 3×(6 @41.3, 6 @40, 6 @38) kg — also 3×(4+2a @41.3, ...) assisted,
          //     and equipment-suffixed weights from mixed sessions: 3×(10 @10, 10 @6/hand, ...) kg
          //     `lengths` guard: a MALFORMED multi-set sled line would otherwise parse here as
          //     weight×reps ("1 length 0:5" → 1 rep @ 70kg) — it must fall to skippedLines instead.
          if (!parsed) {
            const perSetMatch = rest.match(/^(\d+)×[\[(]([^\])]+)[\])]\s*(\w+)?/);
            if (perSetMatch && perSetMatch[2].includes('@') && !/\blengths?\b/.test(perSetMatch[2])) {
              const entries = perSetMatch[2].split(',').map(e => {
                const parts = e.trim().split(/\s*@/);
                const rc = parseRepCell(parts[0]);
                if (!rc) return null;
                const wm = (parts[1] || '').match(/^([\d.]+)(\/(?:hand|bar|1db))?$/);
                const set = { ...rc, weight: wm ? parseFloat(wm[1]) : parseFloat(parts[1]) || 0 };
                if (wm && wm[2]) set._equipSuffix = wm[2];   // resolved to s.equip once the exercise is matched
                return set;
              });
              if (entries.every(Boolean)) parsed = { sets: entries };
            }
          }

          // 7b. Standard weight×reps: 5×(6,8,6) @ 50kg or @ BW — also 3×(4+2a,2+4a,6) @ BW assisted
          if (!parsed) {
            const stdMatch = rest.match(/^(\d+)×[\[(]([^\])]+)[\])]\s*@\s*([\d.]+)/);
            const bwMatch = rest.match(/^(\d+)×[\[(]([^\])]+)[\])]\s*@\s*BW/);
            const m = stdMatch || bwMatch;
            if (m) {
              const repsArr = m[2].split(',').map(r => r.trim());
              const weight = stdMatch ? parseFloat(m[3]) : 0;
              const entries = repsArr.map(r => { const rc = parseRepCell(r); return rc ? { weight, ...rc } : null; });
              if (entries.every(Boolean)) parsed = { sets: entries };
            }
          }
        }

        if (parsed && exName) {
          // Workout-local slot wins over the global first-writer-wins LOOKUP (fixes cross-workout name clashes).
          const matched_ = localLookup[norm(exName)] || matchExercise(exName);
          if (matched_) {
            const exIdx = workout.exercises.findIndex(e => e.id === matched_.id);
            if (exIdx >= 0) {
              parsed.notes = '';
              if (parsed.sets) parsed.sets.forEach(s => {
                s.touched = true;   // imported sets are genuine (v1.9 invariant)
                // Equipment suffix → per-set variant stamp (mixed-equipment sessions)
                if (s._equipSuffix) {
                  const map = EQUIP_SUFFIX[matched_.id];
                  const eq = map && Object.keys(map).find(k => map[k] === s._equipSuffix);
                  if (eq) s.equip = eq;
                  delete s._equipSuffix;
                }
              });
              // Variant from brackets OR from variant-label match
              if (variantId) parsed.variant = variantId;
              else if (matched_.variantId) parsed.variant = matched_.variantId;
              parsed.exId = matched_.id;
              if (chopDirection) parsed.chopDirection = chopDirection;
              if (session.exercises[exIdx] !== undefined) {
                // Two log lines map to the same exercise slot (the app holds one entry per slot per
                // session). Keep the later/fuller entry, but REPORT the displaced one — never silent.
                skippedLines.push({ name: placedNames[exIdx], date, workoutId, reason: `same exercise slot logged twice this session — superseded by a later “${exName}” entry` });
              } else {
                matched++;
              }
              session.exercises[exIdx] = parsed;
              placedNames[exIdx] = exName;
              currentExNotes = exIdx;
            } else {
              unmatched++;
              unmatchedNames.push(exName);
              skippedLines.push({ name: exName, date, workoutId, reason: `not part of Workout ${workoutId}` });
              currentExNotes = null;
            }
          } else {
            unmatched++;
            unmatchedNames.push(exName);
            skippedLines.push({ name: exName, date, workoutId, reason: 'exercise name not recognised' });
            currentExNotes = null;
          }
        } else if (nameMatch) {
          // Looks like an exercise line but its value couldn't be parsed — REPORT it, never drop silently.
          skippedLines.push({ name: exName, date, workoutId, reason: 'could not read the sets/weights on this line' });
          currentExNotes = null;
        } else if (currentExNotes !== null && session.exercises[currentExNotes]) {
          // Accumulate multi-line notes. First note line is "  - text"; continuations are "    text".
          // Skip the derived rep-discrepancy flags (⬆️/⬇️) — they're regenerated on export, not real notes.
          const ex = session.exercises[currentExNotes];
          let noteText = null;
          const nf = line.match(/^\s+-\s+(.+?)\s*$/);
          if (nf && !ex.notes) noteText = nf[1];                              // first note line
          else { const nc = line.match(/^\s{2,}(\S.*?)\s*$/); if (nc) noteText = nc[1]; }  // continuation line
          if (noteText !== null && !/^[⬆️⬇️]/.test(noteText)) {
            ex.notes = ex.notes ? ex.notes + '\n' + noteText : noteText;
          }
        }
      }

      if (Object.keys(session.exercises).length > 0) {
        sessions.push(session);
      }
    }

    return { sessions, matched, unmatched, unmatchedNames, skippedSessions, skippedLines };
  }

  return { exportSession, exportAll, importMarkdown, formatDate, resolveDisplayName };
})();

// =====================================================
// BACKUP MODULE — zero-tap cloud backup (phone → private GitHub repo)
// =====================================================
// Durability, not a second Workout Log. On Finish, each session is PUT as its OWN markdown file
// into a PRIVATE gym-backups repo via the GitHub Contents API (browser fetch + a fine-grained PAT).
// A Mac-side clone then drops those files into the Obsidian vault. No backend, no build step.
//

  // sha, and a bad token should surface ONE clear error rather than N identical ones.

        if (!r.offline) break;

      // single most expensive mistake available in this feature, so it is checked, not trusted.

      }

      }

      return { ok: false, error: 'No connection to GitHub.' };
    }
  }

// CELEBRATE MODULE — confetti + chime on completion (v1.24.0)
// =====================================================
// Canvas confetti with zero dependencies. The canvas lives on <body> (Router only rewrites
// #app.innerHTML) so a burst's tail survives navigation back to the workout list. pointer-events:
// none — every tap passes through; fixed positioning keeps it out of layout entirely.
const Celebrate = (function() {

  const REDUCED = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function _teardown() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }

  }

    const cs = getComputedStyle(document.documentElement);

      .map(v => cs.getPropertyValue(v).trim()).filter(Boolean);
  }

    _teardown();   // a double-tap or a finish-over-exercise overlap never leaks two rAF loops
    canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9500;';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.appendChild(canvas);

    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const colors = _colors();
    const parts = [];
    const spawn = (count) => {
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;   // upward fan
        const speed = 17 + Math.random() * 12;   // measured: peaks ~2/3 up a 667px phone screen (drag damps it well below the ballistic estimate)
        parts.push({
          x: innerWidth / 2 + (Math.random() - 0.5) * 80, y: innerHeight + 10,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          w: 5 + Math.random() * 5, h: 3 + Math.random() * 4,
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
          color: colors[i % colors.length] || '#2e7d32'

    volleys.forEach(([count, delay]) => delay ? setTimeout(() => parts.length && spawn(count), delay) : spawn(count));
    const t0 = performance.now();
    const tick = (t) => {
      if (!canvas) return;
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      let alive = false;
      for (const p of parts) {
        p.vy += 0.35; p.vx *= 0.99; p.vy *= 0.99;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        if (p.y < innerHeight + 20) alive = true;

  // handler: iOS only unlocks audio close to a user gesture.
  function exercise() {
    Timer.playChime();
    if (navigator.vibrate) navigator.vibrate(60);

  // on-device — iOS audio is the subsystem with a history of silent-on-phone surprises), richer buzz.
  function session() {

    if (!REDUCED()) _burst([[80, 0], [50, 350]], 2600);
  }

  return { exercise, session };
