        <h1>W${workoutId} — ${workout.name}</h1>
        ${clockHtml}
      </div>
      <div class="content">
        <div style="text-align:center;margin:0 0 12px;"><button style="padding:8px 16px;font-size:0.85rem;background:var(--bg-input);color:var(--text2);border:1px solid var(--border);border-radius:8px;cursor:pointer;min-height:44px;" onclick="Views.testSound();State.setSoundChecked(true);">🔊 Test sound</button><div id="test-sound-status" style="font-size:0.7rem;color:var(--text3);margin-top:3px;min-height:1em;"></div></div>
        <div class="exercise-list">${rows}</div>
        ${endSessionBtn}
        <div class="workout-notes">
          <label>How did it feel overall?</label>
          <textarea class="notes-field" id="overall-notes" placeholder="Speak or type..."
            oninput="Views._syncSessionNotes()"
          >${wipData?.overall || ''}</textarea>
          <label>Injuries / concerns</label>
          <textarea class="notes-field" id="injury-notes" placeholder="Any pain, tweaks, flags..."
            oninput="Views._syncSessionNotes()"
          >${wipData?.injuries || ''}</textarea>
          <label>Gym</label>
          <div style="display:flex;gap:8px;">
            <select class="notes-field" id="gym-select" style="min-height:48px;padding:10px;flex:1;"
              onchange="if(this.value==='__add_new__'){Views._addNewGym();}else{Views._syncSessionNotes();}">
              ${Data.getGymList().map(g => `<option value="${esc(g)}" ${g === (wipData?.gym || Data.getLastGym()) ? 'selected' : ''}>${esc(g)}</option>`).join('')}
              <option value="__add_new__">+ Add new gym…</option>
            </select>
          </div>
        </div>
        <div style="margin-top:16px;padding-bottom:20px;">
          <button class="btn btn-success" onclick="Views.finishWorkout(${workoutId})">Finish & Copy Session</button>
        </div>
      </div>`;

    startSessionClock('full');
  }

  // ---- Session clock ----
  // The overall session time is shown on every screen you can be on mid-session (workout list +
  // each exercise page), so it never disappears while you're training. Views re-render wholesale on
  // navigation, so each render repaints the markup and restarts the tick; startSessionClock() clears
  // any previous interval first (a re-render that isn't a route change — e.g. End Session — would
  // otherwise leave the old interval clobbering the finished clock back into a running one).
  // Three modes, one clock:
  //   'full'    — workout header, which has the room:      Started 14:32 · 12:45
  //   'compact' — exercise header, tight at 375px:         ⏱ 12:45
  //   'minutes' — home card. A status line, not an instrument: no ticking seconds, and it reads the
  //               same way finished sessions always have (Timer.formatDuration → "12min" / "1h 5min").
  function fmtElapsed(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
  }
  function sessionClockLive(startedAt, mode) {
    const ms = Date.now() - new Date(startedAt).getTime();
    // "0min" for the first 60s reads like a bug, so say so plainly instead.
    if (mode === 'minutes') return `⏱ ${ms < 60000 ? '<1min' : Timer.formatDuration(ms)}`;
    const el = fmtElapsed(ms);
    return mode === 'compact' ? `⏱ ${el}` : `Started ${Timer.formatTimeOfDay(startedAt)} · ${el}`;
  }
  function sessionClockHtml(mode) {
    const wip = State.getWIP();
    const startedAt = wip?.startedAt;
    if (!startedAt) return '';
    const completedAt = wip?.completedAt;
    let txt;
    if (completedAt) {
      const dur = Timer.formatDuration(new Date(completedAt) - new Date(startedAt));
      txt = mode === 'full'
        ? `${Timer.formatTimeOfDay(startedAt)} → ${Timer.formatTimeOfDay(completedAt)} (${dur}) ✓`
        : `⏱ ${dur} ✓`;
    } else {
      txt = sessionClockLive(startedAt, mode);
    }
    return `<div id="session-clock" class="session-clock${mode === 'full' ? '' : ' session-clock-compact'}">${txt}</div>`;
  }
  function startSessionClock(mode) {
    if (window._sessionClockInterval) { clearInterval(window._sessionClockInterval); window._sessionClockInterval = null; }
    const wip = State.getWIP();
    if (!wip?.startedAt || wip.completedAt) return;   // not running — the static markup already says it all
    const tick = () => {
      const el = document.getElementById('session-clock');
      if (!el) return;
      el.textContent = sessionClockLive(wip.startedAt, mode);
    };
    tick();
    window._sessionClockInterval = setInterval(tick, 1000);
  }

  function renderExRow(ex, index, num, workoutId) {
    // v1.28.0: this row is now fully variant-aware. It used to read the BASE exercise for the
    // last-weight hint, the sets×reps label and the completion count, while only trackingType
    // was variant-resolved — so picking a variant could show another variant's last weight, and
    // a variant with its own set count (sled Plyometrics prep = 3, Conditioning = 1) rendered
    // and counted against the wrong number. Same resolution the detail screen already used.
    const effEx = getEffectiveExercise(ex);
    const completion = State.getExerciseCompletionStatus(index, effEx.sets);
    const statusIcon = completion.status === 'complete' ? '✅'
      : completion.status === 'partial' ? `<span class="partial-status">${completion.filled}/${completion.total}</span>`
      : (completion.status === 'skipped' || completion.status === 'not-logged') ? `<span class="skip-status">⊘</span>`
      : '';
    const activeVar = ex.variants ? getActiveVariant(ex) : null;
    const variantFilter = (activeVar && ex.variants)
      ? { variantId: activeVar.id, defaultVariantId: (ex.variants.find(v => v.isDefault) || ex.variants[0]).id }
      : null;
    const lastEntry = State.getLastEntry(ex.id, variantFilter);
    const trackingType = getEffectiveTrackingType(ex);

    let metaStr = '';
    if (trackingType === 'duration' || trackingType === 'completion' || trackingType === 'multi_timer') {
      metaStr = effEx.reps;
    } else if (trackingType === 'sled' || trackingType === 'sled_metres') {
      metaStr = 'Sled';
    } else if (trackingType === 'weight_distance') {
      metaStr = `${effEx.sets}×${effEx.reps}`;
    } else {
      metaStr = `${effEx.sets}×${effEx.reps}`;
    }

    let lastStr = '';
    if (lastEntry) {
      // Show the LAST set (your top/working weight on a ramp), consistent with the prefill.
      const ls = lastEntry.sets?.[lastEntry.sets.length - 1];
      if (ls?.weight) lastStr = `Last: ${ls.weight}kg`;
      else if (ls?.weightL) lastStr = `Last: L${ls.weightL}/R${ls.weightR}kg`;
      else if (lastEntry.weight) lastStr = `Last: ${lastEntry.weight}kg`;
    }

    return `
      <div class="ex-row" onclick="Views.openExercise(${workoutId}, ${index})">
        <span class="ex-num">${num}</span>
        <div class="ex-info">
          <span class="ex-name">${ex.name}${ex.gymArea ? ' <span class="badge badge-location">' + ex.gymArea + '</span>' : ''}${ex.isNew ? ' <span class="badge badge-new">NEW</span>' : ''}${(EQUIPMENT[ex.id] || []).map(e => ' <span class="badge badge-equip">' + e + '</span>').join('')}${ex.id === 'cable-chop' ? ` <span style="font-size:0.75rem;font-weight:400;">${Data.getChopDirection() === 'hi_lo' ? '🔄Hi→Lo' : '🔄Lo→Hi'}</span>` : ''}</span>
          <span class="ex-meta">${metaStr}${ex.flow === 'SS' ? ' <span class="badge badge-ss">SS</span>' : ''}${workoutMembershipBadges(ex.id, workoutId)}${lastStr ? ' · ' + lastStr : ''}</span>
        </div>
        <span class="ex-status">${statusIcon}</span>
      </div>`;
  }

  // Every workout ID this exercise appears in (shared IDs are the cross-workout history contract).
  // Used to show "also in W1 W6" pills so a shared exercise's merged history is self-explanatory.
  function workoutsForExercise(exId) {
    return PROGRAMME.filter(w => w.exercises.some(e => e.id === exId)).map(w => w.id);
  }
  // Small light-grey pills listing the OTHER workouts this exercise is in — the week you're currently
  // in is never shown (you already know), so "also lives in W1 & W6" reads at a glance.
  function workoutMembershipBadges(exId, currentWorkoutId) {
    const others = workoutsForExercise(exId).filter(id => id !== currentWorkoutId);
    if (!others.length) return '';
    return others.map(id => ` <span class="badge badge-workouts">W${id}</span>`).join('');
  }

  // ---- Variant helpers ----
  function getActiveVariant(ex) {
    if (!ex.variants) return null;
    const savedId = Data.getVariant(ex.id);
    if (savedId) {
      const found = ex.variants.find(v => v.id === savedId);
      if (found) return found;
    }
    return ex.variants.find(v => v.isDefault) || ex.variants[0];
  }

  function getEffectiveTrackingType(ex) {
    const variant = getActiveVariant(ex);
    return variant?.trackingType || ex.trackingType || 'weight_reps';
  }

  function getEffectiveExercise(ex) {
    const variant = getActiveVariant(ex);
    if (!variant) return ex;
    return {
      ...ex,
      trackingType: variant.trackingType || ex.trackingType,
      sets: variant.sets !== undefined ? variant.sets : ex.sets,
      reps: variant.reps !== undefined ? variant.reps : ex.reps,
      repRange: variant.repRange || ex.repRange,
      progressionType: variant.progressionType || ex.progressionType,
      // v1.28.0: a variant that declares its OWN rep range must NOT inherit the base's fixed
      // prefillReps — `prefillReps` outranks every other ghosting rule, so nordic curl's fixed 5
      // was ghosting into its ham-curl variants, which work in 10–12. Dropping it lets the normal
      // rules apply (auto-bump → what you did last session → bottom of the variant's range).
      // A variant may still pin its own prefillReps explicitly.
      prefillReps: variant.prefillReps !== undefined ? variant.prefillReps
                 : (variant.repRange ? undefined : ex.prefillReps),
    };
  }

  function getStructuredCues(ex) {
    const cueData = FORM_CUES[ex.id];
    if (!cueData) return null;
    // Variant-keyed: check if it has setup/exec directly or variant sub-objects
    if (cueData.setup) return cueData;
    // Variant-keyed: resolve to active variant
    const variant = getActiveVariant(ex);
    if (variant && cueData[variant.id]) return cueData[variant.id];
    // Fallback: first key that has setup
    for (const k of Object.keys(cueData)) {
      if (cueData[k]?.setup) return cueData[k];
    }
    return null;
  }

  function renderStructuredCues(cues) {
    let html = '';
    if (cues.setup?.length) {
      html += `<div class="cue-label">Setup</div><ul class="cue-list">${cues.setup.map(s => `<li>${s}</li>`).join('')}</ul>`;
    }
    if (cues.exec?.length) {
      html += `<div class="cue-label">Do</div><ul class="cue-list">${cues.exec.map(s => `<li>${s}</li>`).join('')}</ul>`;
    }
    if (cues.mistakes?.length) {
      html += `<div class="cue-label">Don't</div><ul class="cue-list mistakes">${cues.mistakes.map(s => `<li>${s}</li>`).join('')}</ul>`;
    }
    if (cues.you?.length) {
      html += `<div class="cue-label">You</div><ul class="cue-list you">${cues.you.map(s => `<li>${s}</li>`).join('')}</ul>`;
    }
    return html;
  }

  // ---- Last session display ----
  // ATG standard + how far off it you are. Renders nothing for exercises with no published
  // standard. Weight drives the percentage; the bar only goes green once reps are there too.
  function renderStandardLine(ex, effEx, activeVariant, lastEntry) {
    const p = Standards.progress(ex, effEx, activeVariant, lastEntry);
    if (!p) return '';
    const unit = p.std.perHand ? 'kg/hand' : 'kg';
    const half = kg => (Math.round(kg * 2) / 2);
    const hint = p.std.hint ? `<div class="atg-std-hint">${p.std.hint}</div>` : '';

    if (p.kind === 'note') {
      return `<div class="atg-std">
        <div class="atg-std-head">ATG standard: <b>${p.std.label}</b></div>
        ${hint}
      </div>`;
    }

    const targetTxt = p.kind === 'pct' ? ` = <b style="white-space:nowrap;">${half(p.targetKg)} ${unit}</b>` : '';
    const head = `<div class="atg-std-head">ATG standard: <b>${p.std.label}</b>${targetTxt}</div>`;

    if (!p.hasHistory || p.pct === null) {
      return `<div class="atg-std">${head}
        <div class="atg-std-you" style="margin-top:6px;">No sets logged yet — shown for reference.</div>
        ${hint}
      </div>`;
    }

    // Bar is capped at 100% so it can't overflow; the number itself tells the truth.
    const width = Math.max(2, Math.min(100, p.pct));
    let you;
    if (p.kind === 'reps') {
      you = `You: ${p.currentReps} reps`;
    } else {
      you = `You: <span style="white-space:nowrap;">${p.currentKg} ${unit}</span>`;
      if (p.weightMet && !p.repsMet) you += ` — weight met, ${p.currentReps} of ${p.std.reps} reps`;
      else if (p.met) you += ' — standard met ✓';
      else if (p.std.reps && p.currentReps !== null) you += ` × ${p.currentReps} reps`;
    }
    return `<div class="atg-std${p.met ? ' met' : ''}">
      <span class="atg-std-pct">${p.pct}%</span>
      ${head}
      <div class="atg-std-bar"><div class="atg-std-fill" style="width:${width}%"></div></div>
      <div class="atg-std-you">${you}</div>
      ${hint}
    </div>`;
  }

  function formatLastEntry(lastEntry, ex) {
    if (!lastEntry) return '';
    let detail = '';
    if (lastEntry.done || lastEntry.doneL !== undefined) {
      detail = lastEntry.doneL !== undefined ? `L: ${lastEntry.doneL ? '✅' : '—'} R: ${lastEntry.doneR ? '✅' : '—'}` : (lastEntry.done ? '✅' : '—');
    } else if (lastEntry.sets && lastEntry.sets.length > 0) {
      const s0 = lastEntry.sets[0];
      if (s0.weightL !== undefined) {
        detail = lastEntry.sets.map(s => `L:${s.weightL||0}×${s.repsL||0} R:${s.weightR||0}×${s.repsR||0}`).join(', ');
      } else if (s0.repsL !== undefined) {
        if (s0.weight !== undefined) {
          detail = lastEntry.sets.map(s => `${s.weight||0}kg L${s.repsL}/R${s.repsR}`).join(', ');
        } else {
          detail = `${lastEntry.weight||0}kg — ` + lastEntry.sets.map(s => `L${s.repsL}/R${s.repsR}`).join(', ');
        }
      } else if (s0.lengths !== undefined) {
        detail = lastEntry.sets.filter(s => State.sledRowIsReal(lastEntry, s)).map(s => { const tag = s.mode ? s.mode + ' ' : ''; if (s.metres !== undefined) return `${tag}${s.weight||0}kg × ${s.metres}m ${Timer.formatTime(s.timeSeconds||0)}`; const m = s.lengths * (s.lengthM || Data.getSledLength()); return `${tag}${s.weight||0}kg × ${s.lengths}L ${Timer.formatTime(s.timeSeconds||0)}${m ? ` (~${Math.round(m)}m)` : ''}`; }).join(', ');
      } else if (s0.distance !== undefined) {
        detail = lastEntry.sets.map(s => `${s.weight||0}kg/h × ${s.distance}m`).join(', ');
      } else {
        detail = lastEntry.sets.map(s => { const w = parseFloat(s.weight) || 0; return w ? `${w}kg${equipMark(ex, lastEntry, s)} × ${esc(repDisplay(s))}` : `BW × ${esc(repDisplay(s))}`; }).join(', ');
      }
    }
    if (lastEntry.chopDirection) detail += ` <span style="color:var(--text3);">(${lastEntry.chopDirection === 'hi_lo' ? 'Hi→Lo' : 'Lo→Hi'})</span>`;
    return `
      <div class="last-session" style="cursor:pointer;" onclick="Router.go('/exercise/${ex.id}')">
        <div class="last-session-title">Last session (${Markdown.formatDate(lastEntry.date)}, W${lastEntry.workoutId}) <span style="color:var(--accent);font-weight:600;float:right;">History →</span></div>
        <div>${detail}</div>
        ${lastEntry.notes ? `<div style="margin-top:4px;font-style:italic;color:var(--text3);white-space:pre-wrap;">${lastEntry.notes}</div>` : ''}
      </div>`;
  }

  // ---- Type-specific renderers ----

  // How many set rows to render/collect for a set-based exercise: the programme count, or more if
  // the user tapped "+ Add set" (which appends to the saved sets array, so it persists across nav).
  function _numSets(effEx, existingData) { return Math.max(effEx.sets || 1, existingData?.sets?.length || 0); }

  // Ghost prefills (v1.18.0): an UNTOUCHED set shows its would-be reps/weight as a grey placeholder,
  // never as a real value — a mere visit must never look logged (that's how a real session got lost).
  // Legacy sets (touched === undefined) are trusted as already-real, mirroring State.setIsGenuine.
  function _setTouched(existing, entry) {
    // An explicit "Completed exercise ✓" claims the shown numbers — render them as real (black),
    // not as ghosts, so a committed exercise doesn't reopen looking unlogged. Display-only: the
    // stored sets keep touched:false and genuineness still comes from entry.completed.
    if (entry && entry.completed) return true;
    return existing ? ((existing.touched === undefined) ? true : existing.touched) : false;
  }
  // What number should ghost in a reps/steps box (v1.21.0)? One rule for the renderers, autosave
  // AND the finish-sweep "Did it" — all three must agree or a ghost changes under you on re-render.
  //   1. ex.prefillReps — fixed planned count (behaviour unchanged where it exists)
  //   2. weight just auto-bumped → BOTTOM of the rep range (new weight resets the rep target)
  //   3. what you actually did last session, same set index (clamped to its last set)
  //   4. bottom of the rep range   5. nothing → the column label shows
  function _ghostReps(ex, preFill, s, key) {
    if (ex.prefillReps) return ex.prefillReps;
    if (preFill && preFill.bumped && ex.repRange) return ex.repRange[0];
    const ls = preFill && preFill.lastSets;
    if (ls && ls.length) {
      const src = ls[Math.min(s, ls.length - 1)];
      const v = src ? src[key] : undefined;
      if (v !== undefined && v !== null && v !== '') return v;
    }
    return ex.repRange ? ex.repRange[0] : '';
  }

  // value = the computed prefill/logged number for this field; touched = is this SET touched.
  // Touched → render as a real value (today's behaviour). Untouched → blank value, and the would-be
  // number becomes the placeholder (falls back to the column label when there's nothing to ghost).
  function _ghostField(value, touched, label) {
    if (touched) return { v: (value === undefined || value === null) ? '' : value, p: label };
    const hasVal = !(value === '' || value === null || value === undefined);
    return { v: '', p: hasVal ? value : label };
  }

  function renderWeightRepsSets(ex, existingData, preFill) {
    const wLabel = ex.weightLabel || 'kg';
    const rLabel = ex.repsLabel || 'reps';
    let html = `<div class="sets-header"><span></span><span>${wLabel}</span><span></span><span>${rLabel}</span></div>`;
    for (let s = 0, numSets = _numSets(ex, existingData); s < numSets; s++) {
      const existing = existingData?.sets?.[s];
      const touched = _setTouched(existing, existingData);
      const weight = existing?.weight ?? (preFill.weight || 0);
      const reps = existing?.reps ?? _ghostReps(ex, preFill, s, 'reps');
      const w = _ghostField(weight, touched, wLabel);
      const r = _ghostField(reps, touched, rLabel);
      html += `
        <div class="set-row">
          <span class="set-label">Set ${s + 1}</span>
          <input type="number" class="set-input weight-input" inputmode="decimal" step="0.5" placeholder="${w.p}" value="${w.v}" data-set="${s}">
          <span class="set-x">×</span>
          <input type="number" class="set-input reps-input" inputmode="numeric" step="1" placeholder="${r.p}" value="${r.v}" data-set="${s}">
        </div>
        ${s === 0 && preFill.bumped && !existingData ? `<div class="bump-note">Auto-bumped from ${preFill.from}kg</div>` : ''}`;
    }
    return html;
  }

  // Assisted-reps (assist-machine pull-ups/dips): kg + unassisted reps + assisted reps, per set.
  // Unassisted FIRST, assisted after (Tomáš's explicit ask). Reuses the split-reps-row 6-col grid
  // (label/kg/×/reps/+/assist) so three inputs fit at 375px without new CSS. The assisted field is
  // NEVER prefilled — a blank assist box means "didn't need it", not a data gap (see findDataGaps).
  function renderAssistedRepsSets(ex, existingData, preFill) {
    const wLabel = ex.weightLabel || 'kg';
    let html = `<div class="split-reps-header" style="font-size:0.62rem;"><span></span><span>${wLabel}</span><span></span><span>Reps no assist</span><span></span><span>Assisted reps</span></div>`;
    for (let s = 0, numSets = _numSets(ex, existingData); s < numSets; s++) {
      const existing = existingData?.sets?.[s];
      const touched = _setTouched(existing, existingData);
      const weight = existing?.weight ?? (preFill.weight || 0);
      const reps = existing?.reps ?? _ghostReps(ex, preFill, s, 'reps');
      const repsAssisted = existing?.repsAssisted ?? '';
      const w = _ghostField(weight, touched, wLabel);
      const r = _ghostField(reps, touched, 'reps');
      html += `
        <div class="split-reps-row">
          <span class="set-label">Set ${s + 1}</span>
          <input type="number" class="set-input weight-input" inputmode="decimal" step="0.5" placeholder="${w.p}" value="${w.v}" data-set="${s}">
          <span class="set-x">×</span>
          <input type="number" class="set-input reps-input" inputmode="numeric" step="1" placeholder="${r.p}" value="${r.v}" data-set="${s}">
          <span class="set-x">+</span>
          <input type="number" class="set-input repsA-input" inputmode="numeric" step="1" placeholder="reps" value="${repsAssisted}" data-set="${s}">
        </div>
        ${s === 0 && preFill.bumped && !existingData ? `<div class="bump-note">Auto-bumped from ${preFill.from}kg</div>` : ''}`;
    }
    return html;
  }

  function renderRepsOnlySets(ex, existingData, preFill) {
    const rLabel = ex.repsLabel || 'reps';
    let html = `<div class="sets-header" style="grid-template-columns:50px 1fr;"><span></span><span>${rLabel}</span></div>`;
    for (let s = 0, numSets = _numSets(ex, existingData); s < numSets; s++) {
      const existing = existingData?.sets?.[s];
      const touched = _setTouched(existing, existingData);
      const reps = existing?.reps ?? _ghostReps(ex, preFill, s, 'reps');
      const r = _ghostField(reps, touched, rLabel);
      html += `
        <div class="set-row" style="grid-template-columns:50px 1fr;">
          <span class="set-label">Set ${s + 1}</span>
          <input type="number" class="set-input reps-input" inputmode="numeric" step="1" placeholder="${r.p}" value="${r.v}" data-set="${s}">
        </div>`;
    }
    return html;
  }

  function renderRepsOnlySplitSets(ex, existingData, preFill) {
    const rLabel = ex.repsLabel || 'reps';
    let html = `<div class="split-reps-header" style="grid-template-columns:50px 30px 1fr 30px 1fr;"><span></span><span></span><span>L ${rLabel}</span><span></span><span>R ${rLabel}</span></div>`;
    for (let s = 0, numSets = _numSets(ex, existingData); s < numSets; s++) {
      const existing = existingData?.sets?.[s];
      const touched = _setTouched(existing, existingData);
      const rL = existing?.repsL ?? _ghostReps(ex, preFill, s, 'repsL');
      const rR = existing?.repsR ?? _ghostReps(ex, preFill, s, 'repsR');
      const l = _ghostField(rL, touched, rLabel);
      const r = _ghostField(rR, touched, rLabel);
      html += `

  // Controls for one multi-timer position, by status: 'idle' | 'running' | 'paused' | 'done'.
  function _mtControls(i, status, timeVal) {
    const restartIcon = `<button class="multi-timer-btn mt-icon multi-timer-btn-waiting" aria-label="Restart" onclick="Views._mtAction(${i},'restart')">↻</button>`;
    if (status === 'running') {
      return `<button class="multi-timer-btn multi-timer-btn-pause" onclick="Views._mtAction(${i},'pause')">Pause</button>`
        + `<button class="multi-timer-btn multi-timer-btn-done" onclick="Views._mtAction(${i},'done')">Done</button>` + restartIcon;
    }
    if (status === 'paused') {
      return `<button class="multi-timer-btn multi-timer-btn-start" onclick="Views._mtAction(${i},'resume')">Resume</button>`
        + `<button class="multi-timer-btn multi-timer-btn-done" onclick="Views._mtAction(${i},'done')">Done</button>` + restartIcon;
    }
    if (status === 'done') {
      return `<span class="mt-held">✅ Held ${Timer.formatTime(timeVal || 0)}</span>`
        + `<button class="multi-timer-btn multi-timer-btn-waiting" onclick="Views._mtAction(${i},'restart')">↻ Restart</button>`;
    }
    return `<button class="multi-timer-btn multi-timer-btn-start" onclick="Views._mtAction(${i},'start')">Start</button>`;
  }

  function renderMultiTimerExercise(ex, existingData, ns) {
    const seq = ex.timerSequence || [];
    // Pad to one slot per position so the steps array length always equals the position count —
    // otherwise out-of-order completion makes the total wrong (e.g. "2/3" instead of "2/4").
    const steps = existingData?.timerSteps ? existingData.timerSteps.slice() : [];
    while (steps.length < seq.length) steps.push({});

    let html = '<div class="multi-timer-block">';
    html += `<div class="mt-hint">Do them in any order — nothing auto-starts.</div>`;
    for (let i = 0; i < seq.length; i++) {
      const step = seq[i];
      const stepData = steps[i] || {};
      const done = !!stepData.done;
      const timeVal = stepData.time || 0;
      html += `
        <div class="multi-timer-step${done ? ' done' : ''}" id="${ns}mt-step-${i}">
          <div class="mt-head">
            <span class="multi-timer-step-num">${i + 1}</span>
            <span class="multi-timer-step-label">${step.label}</span>
          </div>
          <div class="mt-timeline">
            <span class="multi-timer-display" id="${ns}mt-disp-${i}">${done ? Timer.formatTime(timeVal) : '0:00'}</span>
            <span class="mt-goal-label">/ ${Timer.formatTime(step.seconds)}</span>
          </div>
          <div class="mt-controls" id="${ns}mt-ctrl-${i}">${_mtControls(i, done ? 'done' : 'idle', timeVal)}</div>
        </div>`;
    }
    html += `<input type="hidden" id="mt-steps-data" value='${JSON.stringify(steps)}'>`;
    html += '</div>';
    return html;
  }

  // ---- Multi-timer (calf stretch): each position independent, any order, no auto-start ----
  function _mtSteps() {
    const el = document.getElementById('mt-steps-data');
    try { return JSON.parse(el.value || '[]'); } catch { return []; }
  }
  function _mtSaveSteps(steps) {
    const el = document.getElementById('mt-steps-data');
    if (el) el.value = JSON.stringify(steps);
  }
  function _mtGoal(i) {
    const ctx = _currentRenderCtx; if (!ctx) return 45;
    const ex = PROGRAMME.find(w => w.id === ctx.workoutId)?.exercises[ctx.exIndex];
    return (ex && ex.timerSequence && ex.timerSequence[i] && ex.timerSequence[i].seconds) || 45;
  }
  function _mtStatus(i) {
    const steps = _mtSteps();
    if (steps[i] && steps[i].done) return 'done';
    const id = _ns() + 'mt-disp-' + i;
    if (Timer.isHoldActive(id)) return Timer.isHoldPaused(id) ? 'paused' : 'running';
    return 'idle';
  }
  function _mtRefresh(i) {
    const c = document.getElementById(_ns() + 'mt-ctrl-' + i);
    if (!c) return;
    const steps = _mtSteps();
    c.innerHTML = _mtControls(i, _mtStatus(i), (steps[i] && steps[i].time) || 0);
  }
  function _mtAction(i, action) {
    const id = _ns() + 'mt-disp-' + i;
    const stepEl = document.getElementById(_ns() + 'mt-step-' + i);
    if (action === 'start') {
      Timer.startHoldTimer(id, _mtGoal(i));
    } else if (action === 'resume') {
      if (Timer.isHoldActive(id)) Timer.resumeHoldTimer(id); else Timer.startHoldTimer(id, _mtGoal(i));
    } else if (action === 'pause') {
      Timer.pauseHoldTimer(id);
    } else if (action === 'done') {
      const elapsed = Timer.isHoldActive(id) ? Timer.stopHoldTimer(id) : 0;
      const steps = _mtSteps();
      while (steps.length <= i) steps.push({});
      steps[i] = { done: true, time: elapsed || (steps[i] && steps[i].time) || 0 };
      _mtSaveSteps(steps);
      const disp = document.getElementById(id);
      if (disp) disp.textContent = Timer.formatTime(steps[i].time);
      if (stepEl) { stepEl.classList.add('done'); stepEl.classList.remove('timer-goal-flash'); }
    } else if (action === 'restart') {
      if (Timer.isHoldActive(id)) Timer.stopHoldTimer(id);
      const steps = _mtSteps();
      while (steps.length <= i) steps.push({});
      steps[i] = {};
      _mtSaveSteps(steps);
      if (stepEl) stepEl.classList.remove('done', 'timer-goal-flash');
      const disp = document.getElementById(id);
      if (disp) disp.classList.remove('timer-past-goal');
      Timer.startHoldTimer(id, _mtGoal(i));   // restart = reset to 0 and run again
    }
    _mtRefresh(i);
    _triggerAutoSave();
  }

  // Derived sled readouts — km/h is Tomáš's chosen display unit (28 Jul), always computed from
  // distance ÷ time, never typed. Guard zero time (a real log row has 0:00) → no speed, never NaN.
  function _sledKmh(lengths, lengthM, seconds) {
    const d = (parseFloat(lengths) || 0) * (lengthM || 0);
    return (d > 0 && seconds > 0) ? ((d / seconds) * 3.6).toFixed(1) : '';
  }
  function _sledDerivedText(lengths, lengthM, seconds) {
    const l = parseFloat(lengths) || 0;
    if (!l || !lengthM) return '';
    const kmh = _sledKmh(l, lengthM, seconds);
    return `= ${Math.round(l * lengthM)}m` + (kmh ? ` · ${kmh} km/h` : '');
  }
  // Totals sum each row at ITS OWN length (v1.25.0) — a mixed 20m/50m session has no single
  // length to multiply by, so distance is accumulated per row and speed derived from the sum.
  function _sledTotalText(rows) {
    const real = rows.filter(r => (parseFloat(r.lengths) || 0) > 0);
    if (real.length < 2) return '';
    const totalM = real.reduce((n, r) => n + (parseFloat(r.lengths) || 0) * (parseFloat(r.lengthM) || 0), 0);
    const totalSec = real.reduce((n, r) => n + (r.timeSeconds || 0), 0);
    const kmh = (totalM > 0 && totalSec > 0) ? ((totalM / totalSec) * 3.6).toFixed(1) : '';
    return `Total ${Math.round(totalM)}m · ${Timer.formatTime(totalSec)}` + (kmh ? ` · ${kmh} km/h` : '');
  }
  function renderSledSets(ex, existingData, lastEntry) {
    const sledLength = Data.getSledLength();
    let html = `
      <div class="sled-persistent">
        <label>Default length for new sets:</label>
        <input type="number" class="set-input sled-length-input" inputmode="decimal" step="0.5" value="${sledLength}" style="display:inline;width:80px;"
          oninput="Data.setSledLength(parseFloat(this.value)||15); Views._triggerAutoSave();">
        <span style="color:var(--text2);">m</span>
      </div>`;
    // Sled defaults to 1 set; "+ Add set" grows the WIP sets array (PROGRAMME stays sets:1)
    const numSets = _numSets(ex, existingData);
    html += `<div class="sets-header" style="grid-template-columns:50px 1fr 1fr 1fr;"><span></span><span>kg</span><span>lengths</span><span>time</span></div>`;
    let prevLenM = null;   // a new set inherits the length of the set above it — same route, one timer each
    for (let s = 0; s < numSets; s++) {
      const existing = existingData?.sets?.[s];
      const lastSet = lastEntry?.sets?.[s];
      const weight = existing?.weight ?? (lastSet?.weight ?? '');
      const lengths = existing?.lengths ?? (lastSet?.lengths ?? '');
      const timeStr = existing?.timeSeconds ? Timer.formatTime(existing.timeSeconds) : '';
      // Per-set length (v1.25.0): the route can change between sets. Resolution order — this set's
      // own saved value, then the set above it (adding sets on the same route shouldn't mean
      // retyping the distance), then last session's same-index stamp, then the persistent default.
      const lenM = existing?.lengthM ?? (prevLenM ?? (lastSet?.lengthM ?? sledLength));
      prevLenM = lenM;
      const mode = existing?.mode ?? (lastSet?.mode ?? '');
      html += `
        <div class="sled-set-row">
          <span class="set-label">Set ${s + 1}</span>
          <input type="number" class="set-input sled-weight" inputmode="decimal" step="0.5" placeholder="kg" value="${weight}" data-set="${s}">
          <input type="number" class="set-input sled-lengths" inputmode="numeric" step="1" placeholder="len" value="${lengths}" data-set="${s}">
          <input type="text" class="set-input sled-time" inputmode="text" placeholder="m:ss" value="${timeStr}" data-set="${s}" id="sled-time-${s}">
        </div>
        <div class="sled-set-row2">
          <button class="sled-mode-btn ${mode === 'push' ? 'active' : ''}" data-set="${s}" data-mode="push"
            onclick="Views.setSledMode(${s}, 'push')">Push</button>
          <button class="sled-mode-btn ${mode === 'pull' ? 'active' : ''}" data-set="${s}" data-mode="pull"
            onclick="Views.setSledMode(${s}, 'pull')">Pull</button>
          <input type="number" class="set-input sled-len" inputmode="decimal" step="0.5" placeholder="m" value="${lenM}" data-set="${s}">
          <span class="sled-len-unit">m / length</span>
        </div>
        <button class="stopwatch-btn" id="sw-${s}" onclick="Timer.toggleStopwatch('sw-${s}', 'sled-time-${s}')">⏱️ Start timer</button>
        <div class="sled-derived" id="sled-derived-${s}">${_sledDerivedText(lengths, lenM, existing?.timeSeconds)}</div>`;
    }
    html += `<div class="sled-derived" id="sled-total">${_sledTotalText(existingData?.sets || [])}</div>`;
    return html;
  }

  // Plyometrics prep (v1.26.0): metres + a timer per set, NO lengths. Same push/pull tag and the
  // same derived "= Nm · X km/h" line, but the distance is typed directly instead of being derived
  // from lengths × a route length — short timed efforts don't repeat a fixed lap.
  function renderSledMetresSets(ex, existingData, lastEntry) {
    const numSets = _numSets(ex, existingData);
    let html = `<div class="sets-header" style="grid-template-columns:50px 1fr 1fr 1fr;"><span></span><span>kg</span><span>metres</span><span>time</span></div>`;
    let prevM = null;   // a new set inherits the distance of the set above it
    for (let s = 0; s < numSets; s++) {
      const existing = existingData?.sets?.[s];
      const lastSet = lastEntry?.sets?.[s];
      const weight = existing?.weight ?? (lastSet?.weight ?? '');
      const metres = existing?.metres ?? (prevM ?? (lastSet?.metres ?? ''));
      prevM = metres;
      const timeStr = existing?.timeSeconds ? Timer.formatTime(existing.timeSeconds) : '';
      const mode = existing?.mode ?? (lastSet?.mode ?? '');
      html += `
        <div class="sled-set-row">
          <span class="set-label">Set ${s + 1}</span>
          <input type="number" class="set-input slm-weight" inputmode="decimal" step="0.5" placeholder="kg" value="${weight}" data-set="${s}">
          <input type="number" class="set-input slm-metres" inputmode="decimal" step="0.5" placeholder="m" value="${metres}" data-set="${s}">
          <input type="text" class="set-input slm-time" inputmode="text" placeholder="m:ss" value="${timeStr}" data-set="${s}" id="slm-time-${s}">
        </div>
        <div class="sled-set-row2">
          <button class="sled-mode-btn ${mode === 'push' ? 'active' : ''}" data-set="${s}" data-mode="push"
            onclick="Views.setSledMode(${s}, 'push')">Push</button>
          <button class="sled-mode-btn ${mode === 'pull' ? 'active' : ''}" data-set="${s}" data-mode="pull"
            onclick="Views.setSledMode(${s}, 'pull')">Pull</button>
        </div>
        <button class="stopwatch-btn" id="sw-${s}" onclick="Timer.toggleStopwatch('sw-${s}', 'slm-time-${s}')">⏱️ Start timer</button>
        <div class="sled-derived" id="slm-derived-${s}">${_slmDerivedText(metres, existing?.timeSeconds)}</div>`;
    }
    html += `<div class="sled-derived" id="slm-total">${_slmTotalText(existingData?.sets || [])}</div>`;
    return html;
  }

  function _slmDerivedText(metres, seconds) {
    const m = parseFloat(metres) || 0;
    if (!m) return '';
    const kmh = (seconds > 0) ? ((m / seconds) * 3.6).toFixed(1) : '';
    return `= ${Math.round(m)}m` + (kmh ? ` · ${kmh} km/h` : '');
  }
  function _slmTotalText(rows) {
    const real = rows.filter(r => (parseFloat(r.metres) || 0) > 0);
    if (real.length < 2) return '';
    const totalM = real.reduce((n, r) => n + (parseFloat(r.metres) || 0), 0);
    const totalSec = real.reduce((n, r) => n + (r.timeSeconds || 0), 0);
    const kmh = (totalM > 0 && totalSec > 0) ? ((totalM / totalSec) * 3.6).toFixed(1) : '';
    return `Total ${Math.round(totalM)}m · ${Timer.formatTime(totalSec)}` + (kmh ? ` · ${kmh} km/h` : '');
  }
  function _updateSlmDerived() {
    const rows = [];
    document.querySelectorAll('.slm-metres').forEach(input => {
      const s = input.dataset.set;
      const metres = parseFloat(input.value) || 0;
      const timeStr = document.getElementById(`slm-time-${s}`)?.value || '';
      const parts = timeStr.split(':');
      const timeSeconds = parts.length === 2 ? (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0) : parseInt(timeStr) || 0;
      rows.push({ metres, timeSeconds });
      const el = document.getElementById(`slm-derived-${s}`);
      if (el) el.textContent = _slmDerivedText(metres, timeSeconds);
    });
    const totalEl = document.getElementById('slm-total');
    if (totalEl) totalEl.textContent = _slmTotalText(rows);
  }

  // Push/pull is a 3-state tap: tapping the active one clears it (an untagged set is legitimate —
  // the old continuous push+pull block had no single answer). Writes through to the WIP immediately.
  function setSledMode(setIdx, mode) {
    const btns = document.querySelectorAll(`.sled-mode-btn[data-set="${setIdx}"]`);
    const wasActive = [...btns].some(b => b.dataset.mode === mode && b.classList.contains('active'));
    btns.forEach(b => b.classList.toggle('active', !wasActive && b.dataset.mode === mode));
    _triggerAutoSave();
  }

  function renderWeightDistanceSets(ex, existingData, preFill) {
    const wLabel = ex.weightLabel || 'kg';
    const rLabel = ex.repsLabel || 'meters';
    let html = `<div class="sets-header" style="grid-template-columns:50px 1fr 30px 1fr;"><span></span><span>${wLabel}</span><span></span><span>${rLabel}</span></div>`;
    for (let s = 0, numSets = _numSets(ex, existingData); s < numSets; s++) {
      const existing = existingData?.sets?.[s];
      const weight = existing?.weight ?? (preFill.weight || '');
      const distance = existing?.distance ?? '';
      html += `
        <div class="wd-set-row">
          <span class="set-label">Set ${s + 1}</span>
          <input type="number" class="set-input wd-weight" inputmode="decimal" step="0.5" placeholder="${wLabel}" value="${weight}" data-set="${s}">
          <span class="set-x">×</span>
          <input type="number" class="set-input wd-distance" inputmode="numeric" step="1" placeholder="${rLabel}" value="${distance}" data-set="${s}">
        </div>`;
    }
    return html;
  }

  function renderVariantPills(ex) {
    if (!ex.variants) return '';
    const active = getActiveVariant(ex);
    return `<div class="variant-pills">${ex.variants.map(v =>
      `<button class="variant-pill ${v.id === active.id ? 'active' : ''}" onclick="Views.switchVariant('${ex.id}', '${v.id}')">${v.label}</button>`
    ).join('')}</div>`;
  }

  // Store current render context for re-rendering on variant switch
  let _currentRenderCtx = null;
  let _peekReturnTo = null;  // when you tap into an "Up next" exercise, remember where to return

  // Namespace prefix for the current exercise's timer element ids: `w{workoutId}e{exIndex}-`.
  // Timer ids are namespaced so two exercises can't collide over the same `timer-main`/`mt-disp-0`.
  function _ns() { const c = _currentRenderCtx; return c ? ('w' + c.workoutId + 'e' + c.exIndex + '-') : ''; }

  function switchVariant(exerciseId, variantId) {
    Data.setVariant(exerciseId, variantId);
    if (_currentRenderCtx) {
      renderExercise(_currentRenderCtx.workoutId, _currentRenderCtx.exIndex);
    }
  }

  function toggleChopDirection() {
    Data.flipChopDirection();
    if (_currentRenderCtx) {
      renderExercise(_currentRenderCtx.workoutId, _currentRenderCtx.exIndex);
    }
  }

  // ---- Peek view: upcoming exercises ----
  function renderPeekView(workout, currentExIndex) {
    const remaining = [];
    let exNum = 0;
    for (let i = 0; i < workout.exercises.length; i++) {
      const ex = workout.exercises[i];
      if (ex.isFence) {
        if (i > currentExIndex) remaining.push({ isFence: true, note: ex.fenceNote });
        continue;
      }
      exNum++;
      if (i <= currentExIndex) continue;
      const effEx = getEffectiveExercise(ex);
      const tt = getEffectiveTrackingType(ex);
      let meta = '';
      if (tt === 'duration' || tt === 'completion' || tt === 'multi_timer') meta = ex.reps;
      else if (tt === 'sled') meta = 'Sled';
      else meta = `${effEx.sets}×${effEx.reps}`;
      const completion = State.getExerciseCompletionStatus(i, ex.sets);
      const done = completion.status === 'complete' ? ' ✅' : '';
      remaining.push({ index: i, id: ex.id, num: exNum, name: ex.name, meta, flow: ex.flow, done });
    }
    if (remaining.length === 0) return '';
    const rows = remaining.map(r => {
      if (r.isFence) return `<div class="peek-fence">🥤 ${r.note}</div>`;
      return `<div class="peek-row" onclick="Views.peekTo(${workout.id}, ${currentExIndex}, ${r.index})">
        <span class="peek-num">${r.num}</span>
        <span class="peek-name">${r.name}${(EQUIPMENT[r.id] || []).map(e => ' <span class="badge badge-equip">' + e + '</span>').join('')}${r.done}</span>
        <span class="peek-meta">${r.meta}${r.flow === 'SS' ? ' <span class="badge badge-ss" style="font-size:0.6rem;">SS</span>' : ''}</span>
      </div>`;
    }).join('');
    return `
      <div class="peek-section collapsed" id="peek-section">
        <button class="peek-toggle" onclick="document.getElementById('peek-section').classList.toggle('collapsed')">Up next (${remaining.filter(r => !r.isFence).length} remaining)</button>
        <div class="peek-body">${rows}</div>
      </div>`;
  }

  // ---- Main exercise detail view ----
  function renderExercise(workoutId, exIndex) {
    const workout = PROGRAMME.find(w => w.id === workoutId);
    if (!workout) { renderHome(); return; }
    const ex = workout.exercises[exIndex];
    if (!ex || ex.isFence) { renderWorkout(workoutId); return; }

    const ns = 'w' + workoutId + 'e' + exIndex + '-';   // namespace for this exercise's timer ids
    _currentRenderCtx = { workoutId, exIndex };
    // Logged for USAGE ANALYSIS only — an open is browsing, not a start (see stampExerciseFirstInput).
    if (State.hasWIP()) Data.logEvent('ex-open', { i: exIndex, x: ex.id });
    // Keep hold timers running across navigation (so they survive a peek and keep beeping); only
    // clear the unused countdowns + sled stopwatches.
    Timer.detachOnNav();

    const totalEx = workout.exercises.filter(e => !e.isFence).length;
    const exNum = workout.exercises.slice(0, exIndex + 1).filter(e => !e.isFence).length;
    const effEx = getEffectiveExercise(ex);
    const trackingType = getEffectiveTrackingType(ex);
    // Variant-aware history: the "Last session" line, the prefill, and the last-session notes must
    // all reflect the CURRENTLY-selected variant (e.g. Preacher bench vs Spider curl), not a blend
    // across variants. Legacy untagged entries fall under the default variant.
    const activeVar = ex.variants ? getActiveVariant(ex) : null;
    const variantFilter = (activeVar && ex.variants)
      ? { variantId: activeVar.id, defaultVariantId: (ex.variants.find(v => v.isDefault) || ex.variants[0]).id }
      : null;
    const lastEntry = State.getLastEntry(ex.id, variantFilter);
    const existingData = State.getExerciseData(exIndex);
    const preFill = Progression.getPreFill(ex.id, effEx, variantFilter);

    // Form cues — user-edited (localStorage) > structured (FORM_CUES) > plain text fallback
    let cuesHtml = '';
    const userCues = Data.getUserCues(ex.id);
    const structuredCues = getStructuredCues(ex);
    const hasAnyCues = userCues || structuredCues || ex.formCues || ex.notes;

    // Last session notes from history (not from current session) — variant-filtered to match.
    const historyForNotes = filterHistoryByVariant(State.getExerciseHistory(ex.id), ex, activeVar);
    const lastHistoryNotes = historyForNotes.length > 0 && historyForNotes[0].data.notes ? historyForNotes[0] : null;

    if (hasAnyCues || lastHistoryNotes) {
      let cueContent = '';
      if (userCues) {
        cueContent = `<div style="margin-bottom:6px;white-space:pre-wrap;">${userCues}</div>`;
      } else if (structuredCues) {
        cueContent = renderStructuredCues(structuredCues);
      } else if (ex.formCues) {
        cueContent = `<div style="margin-bottom:6px;">${ex.formCues}</div>`;
      }

      const lastNotesHtml = lastHistoryNotes
        ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">
            <div style="font-size:0.75rem;font-weight:600;color:var(--text3);margin-bottom:4px;">Last session notes (${Markdown.formatDate(lastHistoryNotes.date)})</div>
            <div style="font-size:0.8rem;color:var(--text3);font-style:italic;white-space:pre-wrap;">${esc(lastHistoryNotes.data.notes)}</div>
          </div>`
        : '';

      cuesHtml = `
        <div class="cue-section collapsed" id="cue-section">
          <button class="cue-toggle" onclick="document.getElementById('cue-section').classList.toggle('collapsed')">Reference & Cues</button>
          <div class="cue-body">
            ${cueContent}
            ${ex.notes && !userCues ? `<div style="color:var(--text3);font-style:italic;margin-top:6px;">${ex.notes}</div>` : ''}
            ${lastNotesHtml}
            <a class="history-link" onclick="Router.go('/exercise/${ex.id}')">View full history →</a>
          </div>
        </div>`;
    }

    // Superset info
    let ssInfo = '';
    if (ex.flow === 'SS' && ex.supersetWith) {
      const partner = workout.exercises.find(e => e.id === ex.supersetWith);
      if (partner) ssInfo = `<div style="font-size:0.85rem;color:var(--ss-color);margin-bottom:8px;"><span class="badge badge-ss">SS</span> with ${partner.name}</div>`;
    }

    // Variant pills
    const variantHtml = renderVariantPills(ex);

    // Chop direction (cable-chop only)
    let chopHtml = '';
    if (ex.id === 'cable-chop') {
      const dir = Data.getChopDirection();
      const label = dir === 'hi_lo' ? '🔄 Hi→Lo' : '🔄 Lo→Hi';
      const session = dir === 'hi_lo' ? 'Session A' : 'Session B';
      chopHtml = `<div class="chop-direction" onclick="Views.toggleChopDirection()">${label} <span style="font-weight:400;font-size:0.8rem;color:var(--text3);">(${session})</span></div>`;
    }

    // Type-specific inputs (use effEx for set counts and rep ranges)
    let inputsHtml = '';
    switch (trackingType) {
      case 'duration':
        inputsHtml = renderDurationExercise(effEx, existingData, ns); break;
      case 'completion':
        inputsHtml = renderCompletionExercise(effEx, existingData, ns); break;
      case 'multi_timer':
        inputsHtml = renderMultiTimerExercise(effEx, existingData, ns); break;
      case 'sled':
        inputsHtml = renderSledSets(effEx, existingData, lastEntry); break;
      case 'sled_metres':
        inputsHtml = renderSledMetresSets(effEx, existingData, lastEntry); break;
      case 'weight_distance':
        inputsHtml = renderWeightDistanceSets(effEx, existingData, preFill); break;
      case 'reps_only':
        if (effEx.unilateral === 'split_reps') inputsHtml = renderRepsOnlySplitSets(effEx, existingData, preFill);
        else inputsHtml = renderRepsOnlySets(effEx, existingData, preFill);
        break;
      case 'weight_reps': default:
        if (effEx.assistedReps) inputsHtml = renderAssistedRepsSets(effEx, existingData, preFill);
        else if (effEx.unilateral === 'split_weight') inputsHtml = renderSplitWeightSets(effEx, existingData, preFill);
        else if (effEx.unilateral === 'split_reps') inputsHtml = renderSplitRepsSets(effEx, existingData, preFill);
        else inputsHtml = renderWeightRepsSets(effEx, existingData, preFill);
        break;
    }

    const existingNotes = existingData?.notes || '';

    app.innerHTML = `
      <div class="header">
        <button class="back-btn" onclick="Views.saveAndBack(${workoutId}, ${exIndex})">← Back</button>
        <h1>W${workoutId} — ${exNum} out of ${totalEx}</h1>
        ${sessionClockHtml('compact')}
      </div>
      <div class="content ex-detail">
        <div class="ex-title">${ex.name}${ex.isNew ? ' <span class="badge badge-new">NEW</span>' : ''}${workoutMembershipBadges(ex.id, workoutId)}</div>
        <div class="ex-target">${effEx.sets} × ${effEx.reps}${effEx.repRange ? ` (range: ${effEx.repRange[0]}-${effEx.repRange[1]})` : ''}</div>
        ${renderStandardLine(ex, effEx, activeVar, lastEntry)}
        ${ssInfo}
        ${variantHtml}
        ${chopHtml}
        ${cuesHtml}
        ${formatLastEntry(lastEntry, ex)}
        ${inputsHtml}
        ${['weight_reps','reps_only','weight_distance','sled'].includes(trackingType) ? `<button class="add-set-btn" onclick="Views.addSet(${exIndex})">+ Add set</button>` : ''}
        <textarea class="notes-field" id="ex-notes" placeholder="Speak or type notes..."
          oninput="Views._triggerAutoSave()">${esc(existingNotes)}</textarea>
        <input type="hidden" id="ex-completed" value="${existingData?.completed ? 'true' : ''}">
        <div id="progression-banner"></div>
        ${renderPeekView(workout, exIndex)}
      </div>
      <div class="save-bar">
        <span class="auto-saved" id="auto-save-status">Auto-saved</span>
        <button class="done-btn" onclick="Views.completeExercise(${workoutId}, ${exIndex})">Completed exercise ✓</button>
      </div>`;

    // Add listeners for all inputs
    document.querySelectorAll('.weight-input, .reps-input, .repsA-input, .wl-input, .wr-input, .rl-input, .rr-input, .sr-weight-input, .sled-weight, .sled-lengths, .sled-time, .sled-len, .slm-weight, .slm-metres, .slm-time, .wd-weight, .wd-distance').forEach(input => {
      input.addEventListener('input', () => {
        input.dataset.touched = '1';   // distinguishes a set you actually entered from prefilled defaults
        Views._triggerAutoSave();
        if (trackingType === 'sled') Views._updateSledDerived();   // distance/speed react to lengths, time AND kg edits
        if (trackingType === 'sled_metres') Views._updateSlmDerived();
        Views.updateBanner(ex);
      });
      // Select all on focus so tapping a pre-filled "0" lets you type immediately
      input.addEventListener('focus', () => input.select());
    });

    // Grow pre-filled note textareas to fit content on open — defer a frame so layout has settled,
    // and skip empties so a blank notes box keeps its compact CSS min-height.
    requestAnimationFrame(() => document.querySelectorAll('.notes-field').forEach(t => { if (t.value) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; } }));

    // Repaint any timer that survived navigation onto the fresh nodes (no 1s blank on return), and
    // sync multi-timer controls with their live running state (a running step would else read idle).
    Timer.reattach(ns);
    if (trackingType === 'multi_timer' && effEx.timerSequence) {
      for (let i = 0; i < effEx.timerSequence.length; i++) _mtRefresh(i);
    }

    if (existingData) Views.updateBanner(ex);

    startSessionClock('compact');
  }

  // Start or stop the hold timer for one side (main/l/r) of a duration/completion exercise. Folds the
  // six formerly-duplicated inline onclick handlers into one. `dispId` is the namespaced display id;
  // the hidden inputs (time-/done-/time-adjust-) stay unnamespaced. When `isCompletion`, stopping the
  // timer also ticks the matching completion checkbox.
  function handleTimerTap(dispId, goalSeconds, isCompletion) {
    const side = dispId.split('-timer-')[1];   // 'l' | 'r' | 'main'
    if (Timer.isHoldActive(dispId)) {
      const t = Timer.stopHoldTimer(dispId);
      const timeInput = document.getElementById('time-' + side);
      if (timeInput) timeInput.value = t;
      const doneInput = document.getElementById('done-' + side);
      if (doneInput) doneInput.value = 'true';
      if (isCompletion) {
        const sel = side === 'main' ? '.completion-toggle' : `.completion-toggle[data-side="${side.toUpperCase()}"]`;
        const toggle = document.querySelector(sel);
        if (toggle) { toggle.classList.add('done'); const cb = toggle.querySelector('.check-box'); if (cb) cb.textContent = '✅'; }
      }
      const adj = document.getElementById('time-adjust-' + side);
      if (adj) adj.style.display = 'flex';
      _triggerAutoSave();
    } else {
      const doneInput = document.getElementById('done-' + side);
      if (!doneInput || doneInput.value !== 'true') Timer.startHoldTimer(dispId, goalSeconds);
    }
  }

  // Adjust recorded time for a completed hold timer
  function adjustTime(timerId, delta) {
    const side = timerId.split('-timer-')[1];   // namespaced id → 'l' | 'r' | 'main'; inputs stay unnamespaced
    const timeInput = document.getElementById('time-' + side);
    if (!timeInput) return;
    const current = parseInt(timeInput.value) || 0;
    const newTime = Math.max(0, current + delta);
    timeInput.value = newTime;
    const display = document.getElementById(timerId);
    if (display) display.textContent = Timer.formatTime(newTime);
    _triggerAutoSave();
  }

  function setTimeManual(timerId) {
    const side = timerId.split('-timer-')[1];   // namespaced id → 'l' | 'r' | 'main'; inputs stay unnamespaced
    const timeInput = document.getElementById('time-' + side);
    if (!timeInput) return;
    const current = parseInt(timeInput.value) || 0;
    const input = prompt('Enter time (m:ss or seconds):', current ? Timer.formatTime(current) : '');
    if (input === null) return;
    const str = String(input).trim();
    const val = str.includes(':')
      ? (parseInt(str.split(':')[0]) || 0) * 60 + (parseInt(str.split(':')[1]) || 0)
      : parseInt(str);
    if (isNaN(val) || val < 0) return;
    timeInput.value = val;
    const display = document.getElementById(timerId);
    if (display) display.textContent = Timer.formatTime(val);
    // A manually-entered time also marks the exercise done (works even if the timer was never started)
    const doneInput = document.getElementById('done-' + side);
    if (doneInput) doneInput.value = 'true';
    const toggle = document.querySelector(`.completion-toggle[data-side="${side.toUpperCase()}"]`)
      || (side === 'main' ? document.querySelector('.completion-toggle') : null);
    if (toggle) { toggle.classList.add('done'); const cb = toggle.querySelector('.check-box'); if (cb) cb.textContent = '✅'; }
    const adj = document.getElementById('time-adjust-' + side);
    if (adj) adj.style.display = 'flex';
    _triggerAutoSave();
  }

  // "+ Add set" — capture what's entered, append one empty set, and re-render. The extra set lives in
  // the WIP sets array so it survives navigation and flows through autosave + completion counting.
  function addSet(exIndex) {
    const ctx = _currentRenderCtx;
    if (!ctx) return;
    autoSaveExercise(ctx.workoutId, exIndex);          // capture current inputs first
    const data = State.getExerciseData(exIndex) || {};
    data.sets = Array.isArray(data.sets) ? data.sets : [];
    data.sets.push({ touched: false });                 // one more empty set (won't count until edited)
    State.logExercise(exIndex, data);
    renderExercise(ctx.workoutId, exIndex);             // re-render with the new row
  }

  // Trigger auto-save using stored context. Only ever fired by a genuine interaction (typed input,
  // timer tap, time edit) — never on screen-open — so it doubles as the last-activity stamp.
  function _triggerAutoSave() {
    State.touchActivity();
    // First genuine input on this exercise (v1.24.0) — the honest "started working" marker.
    // Screen-open is deliberately NOT used (browsing future exercises would fake it), so this
    // and the ✓ stamp bracket the exercise; the gap to the previous ✓ is transition time.
    if (_currentRenderCtx) State.stampExerciseFirstInput(_currentRenderCtx.exIndex);
    if (_currentRenderCtx) autoSaveExercise(_currentRenderCtx.workoutId, _currentRenderCtx.exIndex);
    // Starting to log the first exercise auto-starts the session clock if you forgot the Start button.
    const wip = State.getWIP();
    if (wip && !wip.startedAt) State.startTimer();
    const el = document.getElementById('auto-save-status');
    if (el) { el.textContent = 'Saved ✓'; clearTimeout(el._t); el._t = setTimeout(() => el.textContent = 'Auto-saved', 1500); }
  }

  // Pure DOM readout — saving is the generic input listener's job (calling _triggerAutoSave here
  // too used to double-save every lengths edit). Reads time as well, so speed updates live.
  function _updateSledDerived() {
    const sledLength = Data.getSledLength();
    const rows = [];
    document.querySelectorAll('.sled-lengths').forEach(input => {
      const s = input.dataset.set;
      const lengths = parseFloat(input.value) || 0;
      const timeStr = document.getElementById(`sled-time-${s}`)?.value || '';
      const parts = timeStr.split(':');
      const timeSeconds = parts.length === 2 ? (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0) : parseInt(timeStr) || 0;
      const lenEl = document.querySelector(`.sled-len[data-set="${s}"]`);
      const lengthM = lenEl ? (parseFloat(lenEl.value) || 0) : sledLength;
      rows.push({ lengths, timeSeconds, lengthM });
      const el = document.getElementById(`sled-derived-${s}`);
      if (el) el.textContent = _sledDerivedText(lengths, lengthM, timeSeconds);
    });
    const totalEl = document.getElementById('sled-total');
    if (totalEl) totalEl.textContent = _sledTotalText(rows);
  }

  // ---- Auto-save: collect data from DOM based on tracking type ----
  function autoSaveExercise(workoutId, exIndex) {
    const workout = PROGRAMME.find(w => w.id === workoutId);
    if (!workout) return;
    const ex = workout.exercises[exIndex];
    if (!ex) return;
    const effEx = getEffectiveExercise(ex);
    const trackingType = getEffectiveTrackingType(ex);
    const notes = document.getElementById('ex-notes')?.value || '';
    const variant = getActiveVariant(ex);
    const data = { notes, exId: ex.id };
    if (variant) data.variant = variant.id;
    if (ex.id === 'cable-chop') data.chopDirection = Data.getChopDirection();   // record which anchor direction this session used
    if (document.getElementById('ex-completed')?.value === 'true') data.completed = true;

    // A set counts toward progress only if the user edited one of its inputs — now (data-touched
    // set by the input listener) or in a prior save (prevSets). Kills the prefilled "1/1" ghost.
    const prevSets = State.getExerciseData(exIndex)?.sets;
    const setTouched = (s) => !!document.querySelector(`[data-set="${s}"][data-touched="1"]`)
      || !!(prevSets && prevSets[s] && prevSets[s].touched);
    // Collect as many set rows as are on screen — grows when the user tapped "+ Add set".
    const numSetsSave = _numSets(effEx, { sets: prevSets });
    // Ghost prefills (v1.18.0) render an untouched field's would-be number as a placeholder, not a
    // value — so a blank DOM input no longer means "collect 0/''" here. Recompute the same prefill
    // an untouched set would ghost, and fall back to it when a field is blank AND still untouched,
    // so the stored WIP data (and what "Completed exercise ✓" exports) matches pre-ghost behaviour.
    const variantFilter = (variant && ex.variants)
      ? { variantId: variant.id, defaultVariantId: (ex.variants.find(v => v.isDefault) || ex.variants[0]).id }
      : null;
    const preFill = Progression.getPreFill(ex.id, effEx, variantFilter);
    // Blank + untouched → the ghosted prefill (matches what pre-ghost markup used to hold as `value`).
    // Blank + touched → the user genuinely cleared it, so it collects as empty/0 same as before ghosting.
    const repVal = (input, s, key) => {
      if (input && input.value !== '') return parseInt(input.value) || input.value;
      return setTouched(s) ? '' : _ghostReps(effEx, preFill, s, key || 'reps');
    };
    const weightVal = (input, s, fallback) => {
      if (input && input.value !== '') return parseFloat(input.value) || 0;
      return setTouched(s) ? 0 : (fallback || 0);
    };

    switch (trackingType) {
      case 'duration': {
        if (effEx.unilateral) {
          data.doneL = document.getElementById('done-l')?.value === 'true';
          data.doneR = document.getElementById('done-r')?.value === 'true';
          const tL = parseInt(document.getElementById('time-l')?.value) || 0;
          const tR = parseInt(document.getElementById('time-r')?.value) || 0;
          if (tL) data.timeL = tL;
          if (tR) data.timeR = tR;
        } else {
          data.done = document.getElementById('done-main')?.value === 'true';
          const t = parseInt(document.getElementById('time-main')?.value) || 0;
          if (t) data.time = t;
        }
        break;
      }
      case 'completion': {
        if (effEx.unilateral) {
          data.doneL = document.getElementById('done-l')?.value === 'true';
          data.doneR = document.getElementById('done-r')?.value === 'true';
          const tL = parseInt(document.getElementById('time-l')?.value) || 0;
          const tR = parseInt(document.getElementById('time-r')?.value) || 0;
          if (tL) data.timeL = tL;
          if (tR) data.timeR = tR;
        } else {
          data.done = document.getElementById('done-main')?.value === 'true';
          const t = parseInt(document.getElementById('time-main')?.value) || 0;
          if (t) data.time = t;
        }
        break;
      }
      case 'multi_timer': {
        const dataInput = document.getElementById('mt-steps-data');
        let stepsData = [];
        try { stepsData = JSON.parse(dataInput?.value || '[]'); } catch {}
        data.timerSteps = stepsData;
        const allDone = effEx.timerSequence && stepsData.filter(s => s.done).length >= effEx.timerSequence.length;
        data.done = allDone;
        break;
      }
      case 'sled': {
        data.sets = [];
        for (let s = 0; s < numSetsSave; s++) {
          const w = document.querySelector(`.sled-weight[data-set="${s}"]`);
          const l = document.querySelector(`.sled-lengths[data-set="${s}"]`);
          const t = document.querySelector(`.sled-time[data-set="${s}"]`);
          const lenEl = document.querySelector(`.sled-len[data-set="${s}"]`);
          const modeEl = document.querySelector(`.sled-mode-btn[data-set="${s}"].active`);
          const timeStr = t?.value || '';
          const parts = timeStr.split(':');
          const timeSeconds = parts.length === 2 ? (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0) : parseInt(timeStr) || 0;
          const row = {
            weight: w ? parseFloat(w.value) || 0 : 0,
            lengths: l ? parseInt(l.value) || 0 : 0,
            timeSeconds,
            // Freeze the length THIS set was done at — per-set since v1.25.0, so changing the route
            // mid-session (or the default later) can never retro-rewrite a logged distance.
            lengthM: lenEl ? (parseFloat(lenEl.value) || Data.getSledLength()) : Data.getSledLength()
          };
          if (modeEl) row.mode = modeEl.dataset.mode;
          data.sets.push(row);
        }
        break;
      }
      case 'sled_metres': {
        data.sets = [];
        for (let s = 0; s < numSetsSave; s++) {
          const w = document.querySelector(`.slm-weight[data-set="${s}"]`);
          const m = document.querySelector(`.slm-metres[data-set="${s}"]`);
          const t = document.querySelector(`.slm-time[data-set="${s}"]`);
          const modeEl = document.querySelector(`.sled-mode-btn[data-set="${s}"].active`);
          const timeStr = t?.value || '';
          const parts = timeStr.split(':');
          const timeSeconds = parts.length === 2 ? (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0) : parseInt(timeStr) || 0;
          const row = {
            weight: w ? parseFloat(w.value) || 0 : 0,
            metres: m ? parseFloat(m.value) || 0 : 0,
            timeSeconds
          };
          if (modeEl) row.mode = modeEl.dataset.mode;
          data.sets.push(row);
        }
        break;
      }
      case 'weight_distance': {
        data.sets = [];
        for (let s = 0; s < numSetsSave; s++) {
          const w = document.querySelector(`.wd-weight[data-set="${s}"]`);
          const d = document.querySelector(`.wd-distance[data-set="${s}"]`);
          data.sets.push({
            weight: w ? parseFloat(w.value) || 0 : 0,
            distance: d ? parseInt(d.value) || 0 : 0
          });
        }
        break;
      }
      case 'reps_only': {
        data.sets = [];
        if (effEx.unilateral === 'split_reps') {
          for (let s = 0; s < numSetsSave; s++) {
            data.sets.push({
              repsL: repVal(document.querySelector(`.rl-input[data-set="${s}"]`), s, 'repsL'),
              repsR: repVal(document.querySelector(`.rr-input[data-set="${s}"]`), s, 'repsR'),
            });
          }
        } else {
          for (let s = 0; s < numSetsSave; s++) {
            const r = document.querySelector(`.reps-input[data-set="${s}"]`);
            data.sets.push({ reps: repVal(r, s) });
          }
        }
        break;
      }
      case 'weight_reps': default: {
        if (effEx.assistedReps) {
          data.sets = [];
          for (let s = 0; s < numSetsSave; s++) {
            const wInput = document.querySelector(`.weight-input[data-set="${s}"]`);
            const rInput = document.querySelector(`.reps-input[data-set="${s}"]`);
            const raInput = document.querySelector(`.repsA-input[data-set="${s}"]`);
            data.sets.push({
              weight: weightVal(wInput, s, preFill.weight),
              reps: repVal(rInput, s),
              repsAssisted: raInput ? (raInput.value === '' ? '' : parseInt(raInput.value) || 0) : ''
            });
          }
        } else if (effEx.unilateral === 'split_weight') {
          data.sets = [];
          for (let s = 0; s < numSetsSave; s++) {
            data.sets.push({
              weightL: weightVal(document.querySelector(`.wl-input[data-set="${s}"]`), s, preFill.weightL),
              repsL: repVal(document.querySelector(`.rl-input[data-set="${s}"]`), s, 'repsL'),
              weightR: weightVal(document.querySelector(`.wr-input[data-set="${s}"]`), s, preFill.weightR),
              repsR: repVal(document.querySelector(`.rr-input[data-set="${s}"]`), s, 'repsR'),
            });
          }
        } else if (effEx.unilateral === 'split_reps') {
          data.sets = [];
          for (let s = 0; s < numSetsSave; s++) {
            data.sets.push({
              weight: weightVal(document.querySelector(`.sr-weight-input[data-set="${s}"]`), s, preFill.weight),
              repsL: repVal(document.querySelector(`.rl-input[data-set="${s}"]`), s, 'repsL'),
              repsR: repVal(document.querySelector(`.rr-input[data-set="${s}"]`), s, 'repsR'),
            });
          }
        } else {
          data.sets = [];
          const equipMap = EQUIP_SUFFIX[ex.id];
          for (let s = 0; s < numSetsSave; s++) {
            const wInput = document.querySelector(`.weight-input[data-set="${s}"]`);
            const rInput = document.querySelector(`.reps-input[data-set="${s}"]`);
            const set = {
              weight: weightVal(wInput, s, preFill.weight),
              reps: repVal(rInput, s)
            };
            if (equipMap && variant) {
              // Rows typed since the last render stamp the ACTIVE pill; older rows keep their stamp.
              // (Switching the pill re-renders and clears data-touched, so "typed this render" ≡
              // "typed under this pill" — mixing equipment is just flipping the pill between sets.)
              const editedNow = !!document.querySelector(`[data-set="${s}"][data-touched="1"]`);
              const eq = editedNow ? variant.id : (prevSets && prevSets[s] && prevSets[s].equip);
              if (eq) set.equip = eq;
            }
            data.sets.push(set);
          }
        }
        break;
      }
    }

    // Stamp per-set touched (true/false) so getExerciseCompletionStatus counts only genuine sets.
    if (Array.isArray(data.sets)) data.sets.forEach((st, s) => { st.touched = setTouched(s); });

    State.logExercise(exIndex, data);
  }

  function saveExercise(workoutId, exIndex) {
    Timer.finalize('w' + workoutId + 'e' + exIndex + '-');   // stop + capture THIS exercise's timers only
    autoSaveExercise(workoutId, exIndex);
    Router.go(`/w/${workoutId}`);
  }

  // "Completed exercise ✓": fill any still-grey ghost numbers into their boxes (grey → black with a
  // brief green flash) so you SEE what gets saved, then save and go back. The values are the same
  // ones autoSaveExercise would collect for untouched sets — this just makes the commit visible.
  // Sets stay touched:false (genuineness comes from data.completed, same as the finish-sweep "Did it").
  function completeExercise(workoutId, exIndex) {
    const btn = document.querySelector('.done-btn');
    if (btn && btn.dataset.committing) return;   // double-tap guard during the commit pause
    Celebrate.exercise();   // FIRST — audio must fire synchronously inside the tap gesture (iOS)
    const completedInput = document.getElementById('ex-completed');
    if (completedInput) completedInput.value = 'true';
    State.touchActivity();
    State.stampExerciseCompleted(exIndex);   // permanent per-exercise finish time (+ pacing data)
    const ghosts = [];
    document.querySelectorAll('.set-input').forEach(input => {
      // Only blank boxes whose placeholder is a would-be NUMBER (never the "kg"/"reps" column labels)
      if (input.value === '' && input.placeholder !== '' && !isNaN(parseFloat(input.placeholder))) {
        input.value = input.placeholder;
        ghosts.push(input);
      }
    });
    // Both branches wait 700ms (the ghost-commit animation length) — the no-ghost path used to
    // navigate instantly, which would cut the celebration off before it was visible.
    autoSaveExercise(workoutId, exIndex);   // persist NOW — only the navigation waits for the animation
    if (btn) { btn.dataset.committing = '1'; btn.textContent = 'Saved ✓'; }
    ghosts.forEach(i => i.classList.add('ghost-commit'));
    setTimeout(() => saveAndBack(workoutId, exIndex), 700);
  }

  function saveAndBack(workoutId, exIndex) {
    Timer.finalize('w' + workoutId + 'e' + exIndex + '-');   // stop + capture THIS exercise's timers (a peeked-away one keeps running)
    autoSaveExercise(workoutId, exIndex);
    // Check if this was the last real exercise
    const workout = PROGRAMME.find(w => w.id === workoutId);
    const wip = State.getWIP();
    if (workout && wip && wip.startedAt && !wip.completedAt) {
      const lastRealIndex = workout.exercises.reduce((last, ex, i) => ex.isFence ? last : i, -1);
      if (exIndex === lastRealIndex) {
        if (confirm('Last exercise done! End the session timer?')) {
          State.endTimer();
        }
      }
    }
    const ret = _peekReturnTo;
    _peekReturnTo = null;
    if (ret && ret.workoutId === workoutId && ret.exIndex !== exIndex) {
      Router.go(`/w/${workoutId}/e/${ret.exIndex}`);   // came here via "Up next" → go back to where you were
    } else {
      Router.go(`/w/${workoutId}`);
    }
  }

  // Jump into an "Up next" exercise mid-flow, remembering to return here on Back/Completed
  function peekTo(workoutId, fromIndex, toIndex) {
    Timer.snapshotLiveTimers('w' + workoutId + 'e' + fromIndex + '-');   // keep the timer running; just snapshot its elapsed
    autoSaveExercise(workoutId, fromIndex);
    _peekReturnTo = { workoutId, exIndex: fromIndex };
    Router.go(`/w/${workoutId}/e/${toIndex}`);
  }

  // Play the goal alarm on demand so you can confirm your phone isn't on silent
  function testSound() {
    const status = document.getElementById('test-sound-status');
    try {
      Timer.ensureAudio();
      Timer.alarm();
      // Plain-language result only. The raw Timer.audioState() readout used to print here too; removed
      // 17 Jul as noise. Timer.audioState() is kept as the escape hatch — re-add the line below if the
      // alarm ever goes silent on-device again in a way desktop can't reproduce.
      if (status) status.innerHTML =
        `<div style="color:#16a34a;font-weight:600;font-size:0.85rem;">✓ Sound works!</div>`
        + `<div style="color:var(--text3);font-size:0.72rem;line-height:1.3;">Didn't hear it? Flip the ringer switch on the side of your phone.</div>`;
    } catch (e) {
      if (status) status.textContent = '⚠ ' + (e && e.message ? e.message : e);
    }
  }

  // ---- Sound-check gate ----
  // The alarm has silently failed on the real phone before (iOS audio routing), so before the
  // first exercise we make sure the beep was actually heard. Tapping 🔊 Test sound satisfies it;
  // otherwise the first "begin" action (Start Session / opening an exercise) prods with a live beep.
  function soundChecked() { return !!State.getWIP()?.soundChecked; }
  function promptSoundCheck() {
    testSound();                 // play the beep now — the prod doubles as the actual test
    const heard = confirm('🔊 Sound check — did you hear the beep?\n\nOK — yes, I heard it.\nCancel — flip the ringer switch on the side of your phone, then tap 🔊 Test sound.');
    if (heard) { State.setSoundChecked(true); return true; }
    return false;                // stay put so they can fix the ringer / retest
  }
  function startSessionGuarded(workoutId) {
    if (!soundChecked() && !promptSoundCheck()) return;
    Timer.ensureAudio(); State.startTimer(); renderWorkout(workoutId);
  }
  function openExercise(workoutId, index) {
    if (!soundChecked() && !promptSoundCheck()) return;
    Router.go(`/w/${workoutId}/e/${index}`);
  }

  function updateBanner(exercise) {
    const bannerEl = document.getElementById('progression-banner');
    if (!bannerEl) return;
    const effEx = getEffectiveExercise(exercise);
    const trackingType = getEffectiveTrackingType(exercise);
    if (trackingType !== 'weight_reps' && trackingType !== 'reps_only') { bannerEl.innerHTML = ''; return; }

    const sets = [];
    if (effEx.unilateral === 'split_reps') {
      for (let s = 0; s < effEx.sets; s++) {
        const rl = document.querySelector(`.rl-input[data-set="${s}"]`);
        const rr = document.querySelector(`.rr-input[data-set="${s}"]`);
        if (rl?.value && rr?.value) sets.push({ repsL: rl.value, repsR: rr.value });
      }
    } else {
      for (let s = 0; s < effEx.sets; s++) {
        const rInput = document.querySelector(`.reps-input[data-set="${s}"]`);
        if (rInput?.value) sets.push({ reps: rInput.value });
      }
    }

    const banner = Progression.getBanner(sets, effEx);
    if (!banner) { bannerEl.innerHTML = ''; return; }
    const cls = banner.type === 'green' ? 'banner-green' : banner.type === 'amber' ? 'banner-amber' : 'banner-atg';
    const icon = banner.type === 'green' ? '✅ ' : banner.type === 'amber' ? '⚠️ ' : '💡 ';
    bannerEl.innerHTML = `<div class="progression-banner ${cls}">${icon}${banner.text}</div>`;
  }

  // Which fields a set of this type is expected to carry. Anything not listed here (sled,
  // weight_distance, duration, completion, multi_timer) has its own flow and is left alone.
  function expectedSetFields(effEx, trackingType) {
    const uni = effEx.unilateral;
    if (trackingType === 'weight_reps') {
      if (uni === 'split_weight') return [['weightL', 'kg L'], ['repsL', 'reps L'], ['weightR', 'kg R'], ['repsR', 'reps R']];
      if (uni === 'split_reps') return [['weight', 'kg'], ['repsL', 'reps L'], ['repsR', 'reps R']];
      return [['weight', 'kg'], ['reps', 'reps']];
    }
    if (trackingType === 'reps_only') {
      if (uni === 'split_reps') return [['repsL', 'reps L'], ['repsR', 'reps R']];
      return [['reps', 'reps']];
    }
    return null;
  }

  // A blank is a hole you never filled. A logged 0 is a statement (BW lifts export "@ BW"),
  // so 0 is a real value here — the old detector treated it as missing and cried wolf on them.
  function isBlankField(v) { return v === null || v === undefined || v === ''; }

  // Gaps worth asking about at Finish: a set you genuinely logged but left half-filled.
  // Genuineness comes from State.setIsGenuine — never a hand-rolled predicate — so an untouched
  // prefilled row (a ghost, pruned moments later) can never be mistaken for a missing number.
  function findDataGaps(workoutId) {
    const wip = State.getWIP();
    if (!wip) return [];
    const workout = PROGRAMME.find(w => w.id === workoutId);
    if (!workout) return [];
    const gaps = [];

    for (const [idx, data] of Object.entries(wip.exercises)) {
      const exIndex = parseInt(idx);
      const ex = workout.exercises[exIndex];
      if (!ex || ex.isFence) continue;
      if (!Array.isArray(data.sets) || data.sets.length === 0) continue;

      const effEx = getEffectiveExercise(ex);
      const fields = expectedSetFields(effEx, getEffectiveTrackingType(ex));
      if (!fields) continue;

      let genuineSets = 0;
      data.sets.forEach((s, setIndex) => {
        if (!State.setIsGenuine(s)) return;
        genuineSets++;
        for (const [field, label] of fields) {
          // An all-assisted set genuinely has no unassisted reps to report — not a gap (v1.17.0 assisted reps).
          if (field === 'reps' && !isBlankField(s.repsAssisted)) continue;
          if (isBlankField(s[field])) {
            gaps.push({ kind: 'field', exIndex, exName: ex.name, setIndex, field, label });
          }
        }
      });

      // Fewer sets than programmed — flagged gently, with no input. Stopping a set early is a
      // legitimate training decision, not a mistake, so this is a note rather than a question.
      const planned = parseInt(effEx.sets) || 0;
      if (genuineSets > 0 && planned > genuineSets) {
        gaps.push({ kind: 'note', exIndex, exName: ex.name, text: `${genuineSets} of ${planned} sets logged` });
      }
    }
    return gaps;
  }

  // Every programme exercise in this workout the user never resolved this session: no genuine set,
  // no "Completed exercise ✓" tap, and no skip-state already recorded. The finish-time sweep asks
  // about each one instead of letting it vanish silently (v1.18.0).
  function findUntouchedExercises(workoutId) {
    const wip = State.getWIP();
    if (!wip) return [];
    const workout = PROGRAMME.find(w => w.id === workoutId);
    if (!workout) return [];
    const out = [];
    workout.exercises.forEach((ex, exIndex) => {
      if (ex.isFence) return;
      const data = wip.exercises[exIndex];
      if (data && data.skipState) return;
      if (data && State.entryHasGenuineData(data)) return;
      out.push({ exIndex, exName: ex.name });
    });
    return out;
  }

  // Build a fresh entry for an exercise never opened this session — the same programme-prefill
  // values (reps/weight) a ghost placeholder would have shown, so "✓ Did it" materialises exactly
  // what tapping "Completed exercise ✓" on an opened-but-untouched screen would have saved.
  function materializeUntouchedEntry(workoutId, exIndex, notes) {
