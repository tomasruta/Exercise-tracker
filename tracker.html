    const workout = PROGRAMME.find(w => w.id === workoutId);
    const ex = workout && workout.exercises[exIndex];
    if (!ex) return { notes: notes || '' };
    const effEx = getEffectiveExercise(ex);
    const trackingType = getEffectiveTrackingType(ex);
    const activeVar = ex.variants ? getActiveVariant(ex) : null;
    const variantFilter = (activeVar && ex.variants)
      ? { variantId: activeVar.id, defaultVariantId: (ex.variants.find(v => v.isDefault) || ex.variants[0]).id }
      : null;
    const data = { exId: ex.id, notes: notes || '' };
    if (activeVar) data.variant = activeVar.id;
    const numSets = effEx.sets || 1;
    switch (trackingType) {
      case 'duration':
      case 'completion':
        if (effEx.unilateral) { data.doneL = true; data.doneR = true; }
        else data.done = true;
        break;
      case 'multi_timer': {
        const n = effEx.timerSequence ? effEx.timerSequence.length : 0;
        data.timerSteps = Array.from({ length: n }, () => ({ done: true, time: 0 }));
        break;
      }
      case 'sled':
      case 'weight_distance':
        break;   // no meaningful prefill for these — completed:true alone records the intent
      case 'reps_only': {
        const preFill = Progression.getPreFill(ex.id, effEx, variantFilter);
        data.sets = Array.from({ length: numSets }, (_, i) => (
          effEx.unilateral === 'split_reps'
            ? { repsL: _ghostReps(effEx, preFill, i, 'repsL'), repsR: _ghostReps(effEx, preFill, i, 'repsR'), touched: false }
            : { reps: _ghostReps(effEx, preFill, i, 'reps'), touched: false }
        ));
        break;
      }
      case 'weight_reps': default: {
        const preFill = Progression.getPreFill(ex.id, effEx, variantFilter);
        data.sets = Array.from({ length: numSets }, (_, i) => {
          if (effEx.assistedReps) return { weight: preFill.weight || 0, reps: _ghostReps(effEx, preFill, i, 'reps'), repsAssisted: '', touched: false };
          if (effEx.unilateral === 'split_weight') return { weightL: preFill.weightL || 0, repsL: _ghostReps(effEx, preFill, i, 'repsL'), weightR: preFill.weightR || 0, repsR: _ghostReps(effEx, preFill, i, 'repsR'), touched: false };
          if (effEx.unilateral === 'split_reps') return { weight: preFill.weight || 0, repsL: _ghostReps(effEx, preFill, i, 'repsL'), repsR: _ghostReps(effEx, preFill, i, 'repsR'), touched: false };
          return { weight: preFill.weight || 0, reps: _ghostReps(effEx, preFill, i, 'reps'), touched: false };
        });
        break;
      }
    }
    return data;
  }

  function finishWorkout(workoutId) {
    const gaps = findDataGaps(workoutId);
    const untouched = findUntouchedExercises(workoutId);
    // Only a fillable hole (or an unresolved exercise) is worth interrupting for. Stopping a lift
    // early is a training decision, so a short set count alone never opens this on its own.
    if (gaps.some(g => g.kind === 'field') || untouched.length > 0) { showGapModal(workoutId, gaps, untouched); return; }
    doFinish(workoutId);
  }

  // Tap a "✓ Did it" / "Skip" choice for one of the wholly-untouched rows. Tapping the already-active
  // choice again deselects it (back to "neither" → recorded as "not logged" on finish).
  function setUntouchedChoice(exIndex, choice, btnEl) {
    const pending = window._pendingUntouched || [];
    const item = pending.find(u => u.exIndex === exIndex);
    if (!item) return;
    item.choice = (item.choice === choice) ? null : choice;
    const row = btnEl.closest('.gap-untouched-row');
    if (row) row.querySelectorAll('.untouched-choice-btn').forEach(b => b.classList.remove('active'));
    if (item.choice) btnEl.classList.add('active');
  }

  // Turn the sheet's per-row choices into WIP entries just before finishing. Neither chosen →
  // 'not-logged' (an honest "no claim of intent"), never silently dropped.
  function applyUntouchedChoices(workoutId) {
    const pending = window._pendingUntouched || [];
    window._pendingUntouched = null;
    const wip = State.getWIP();
    if (!wip) return;
    for (const u of pending) {
      const exIndex = u.exIndex;
      const existing = wip.exercises[exIndex];
      const notes = (existing && existing.notes) || '';
      let entry;
      if (u.choice === 'done') {
        entry = materializeUntouchedEntry(workoutId, exIndex, notes);
        entry.completed = true;
      } else {
        const workout = PROGRAMME.find(w => w.id === workoutId);
        const ex = workout && workout.exercises[exIndex];
        entry = { exId: ex ? ex.id : undefined, notes, skipState: (u.choice === 'skip') ? 'skipped' : 'not-logged' };
      }
      State.logExercise(exIndex, entry);
    }
  }

  // The gap prompt: the numbers are still in your head at this exact moment, so ask once, inline.
  // A courtesy, never a validation wall — both buttons finish the workout.
  function showGapModal(workoutId, gaps, untouched) {
    untouched = untouched || [];
    const grouped = [];
    for (const g of gaps) {
      let group = grouped.find(x => x.exIndex === g.exIndex);
      if (!group) { group = { exIndex: g.exIndex, exName: g.exName, items: [] }; grouped.push(group); }
      group.items.push(g);
    }
    // An exercise with only a set-count note has nothing to answer — don't list it.
    const byExercise = grouped.filter(group => group.items.some(i => i.kind === 'field'));
    const fieldCount = gaps.filter(g => g.kind === 'field').length;

    const groupsHtml = byExercise.map(group => {
      const rows = group.items.map(g => {
        if (g.kind === 'note') return `<div class="gap-note">${g.text}</div>`;
        const numeric = g.field.startsWith('reps');
        return `<div class="gap-row">
          <label class="gap-label" for="gap-${g.exIndex}-${g.setIndex}-${g.field}">Set ${g.setIndex + 1} — ${g.label}</label>
          <input class="gap-input" id="gap-${g.exIndex}-${g.setIndex}-${g.field}" type="number"
            inputmode="${numeric ? 'numeric' : 'decimal'}" step="${numeric ? '1' : 'any'}" placeholder="—">
        </div>`;
      }).join('');
      return `<div class="gap-group"><div class="gap-ex-name">${group.exName}</div>${rows}</div>`;
    }).join('');

    const untouchedHtml = untouched.length ? `
      <div class="gap-untouched-section">
        <div style="font-size:0.85rem;color:var(--text2);margin:${byExercise.length ? '16px' : '0'} 0 8px;">Not logged this session — mark what happened, or leave blank:</div>
        ${untouched.map(u => `
          <div class="gap-untouched-row">
            <div class="gap-ex-name">${u.exName}</div>
            <div class="untouched-choice-group">
              <button type="button" class="untouched-choice-btn" onclick="Views.setUntouchedChoice(${u.exIndex}, 'done', this)">✓ Did it</button>
              <button type="button" class="untouched-choice-btn" onclick="Views.setUntouchedChoice(${u.exIndex}, 'skip', this)">Skip</button>
            </div>
          </div>`).join('')}
      </div>` : '';

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'gap-modal';
    overlay.innerHTML = `
      <div class="modal">
        <h2>${byExercise.length ? 'Missing a few numbers' : 'A few exercises weren’t logged'}</h2>
        <p style="font-size:0.85rem;color:var(--text2);margin-bottom:12px;">
          ${fieldCount > 0 ? 'Fill in what you remember — anything you leave blank stays blank.' : (byExercise.length ? 'Just so you know before this session is saved.' : 'They’ll be recorded as “not logged” unless you say otherwise.')}
        </p>
        ${groupsHtml}
        ${untouchedHtml}
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="Views.skipGapsAndFinish(${workoutId})">Finish as is</button>
          ${fieldCount > 0 ? `<button class="btn btn-primary" onclick="Views.fillGapsAndFinish(${workoutId})">Save &amp; finish</button>` : ''}
        </div>
      </div>`;
    document.body.appendChild(overlay);
    // Tapping outside keeps you in the workout — the escape hatch the old confirm's Cancel gave you.
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    window._pendingGaps = gaps;
    window._pendingUntouched = untouched.map(u => ({ ...u, choice: null }));
  }

  function skipGapsAndFinish(workoutId) {
    document.getElementById('gap-modal')?.remove();
    window._pendingGaps = null;
    applyUntouchedChoices(workoutId);
    doFinish(workoutId);
  }

  function fillGapsAndFinish(workoutId) {
    const gaps = window._pendingGaps || [];
    const wip = State.getWIP();
    if (wip) {
      const touchedExercises = new Set();
      for (const g of gaps) {
        if (g.kind !== 'field') continue;
        const input = document.getElementById(`gap-${g.exIndex}-${g.setIndex}-${g.field}`);
        if (!input || input.value === '') continue;
        const entry = wip.exercises[g.exIndex];
        if (!entry || !entry.sets || !entry.sets[g.setIndex]) continue;
        entry.sets[g.setIndex][g.field] = input.value;
        entry.sets[g.setIndex].touched = true;
        touchedExercises.add(g.exIndex);
      }
      for (const exIndex of touchedExercises) State.logExercise(exIndex, wip.exercises[exIndex]);
    }
    document.getElementById('gap-modal')?.remove();
    window._pendingGaps = null;
    applyUntouchedChoices(workoutId);
    doFinish(workoutId);
  }

  function doFinish(workoutId) {
    const session = State.finishSession();
    if (!session) return;
    // Flip chop direction after completing W6
    if (workoutId === 6) Data.flipChopDirection();
    // Store the index of this session for export tracking
    window._lastSessionIndex = Data.getSessions().length - 1;
    renderSummary(session);
  }

  // Cloud-backup card in Settings. Shows the TRUE state (how many sessions GitHub has confirmed),
  // the setup fields, and the manual escape hatches. 44px tap targets at 375px.
  function renderBackupCard() {
    const total = Data.getSessions().length;
    const pending = Data.getUnbackedSessions().length;
    const configured = Backup.isConfigured();

    let status, statusColor, statusBg;
    if (!configured) {
      status = 'Not set up — no automatic backup';
      statusColor = 'var(--text3)'; statusBg = 'var(--bg-card)';
    } else if (pending === 0) {
      status = total === 0 ? 'Ready — no sessions yet' : `All ${total} session${total > 1 ? 's' : ''} backed up ✓`;
      statusColor = 'var(--green)'; statusBg = 'var(--green-bg)';
    } else {
      status = `${pending} session${pending > 1 ? 's' : ''} waiting to back up`;
      statusColor = 'var(--amber)'; statusBg = 'var(--amber-bg)';
    }

    return `
      <div class="summary-section" style="margin-top:24px;">
        <h3>☁️ Cloud backup</h3>
        <div style="padding:12px 14px;background:${statusBg};border:1px solid ${statusColor};border-radius:10px;font-size:0.9rem;font-weight:600;color:${statusColor};margin-bottom:10px;">
          ${status}
        </div>
        <div style="font-size:0.8rem;color:var(--text2);margin-bottom:12px;line-height:1.45;">
          Each finished workout is saved as its own markdown file in a <strong>private</strong> GitHub repo,
          then pulled into the Obsidian vault on the Mac. Your Workout Log is never touched.
        </div>

        <label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:4px;">Private repo</label>
        <input id="backup-repo" type="text" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false"
               value="${esc(Backup.getRepo())}" placeholder="${esc(Backup.DEFAULT_REPO)}"
               style="width:100%;padding:12px;font-size:0.9rem;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;box-sizing:border-box;">

        <label style="display:block;font-size:0.8rem;font-weight:600;margin-bottom:4px;">
          Access token ${configured ? `<span style="font-weight:400;color:var(--green);">— saved (${esc(Backup.maskedToken())})</span>` : ''}
        </label>
        <input id="backup-token" type="password" autocapitalize="none" autocorrect="off" spellcheck="false"
               placeholder="${configured ? 'Paste a new token to replace' : 'github_pat_...'}"
               style="width:100%;padding:12px;font-size:0.9rem;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;box-sizing:border-box;">
        <div style="font-size:0.75rem;color:var(--text3);margin-bottom:12px;">
          Fine-grained token, <strong>this one private repo only</strong>, permission “Contents: Read and write”.
          Stored on this phone only.
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;">
          <button class="btn btn-secondary" style="min-height:44px;" onclick="Views.saveBackupSettings()">Save &amp; test connection</button>
          <button class="btn btn-secondary" style="min-height:44px;" onclick="Views.backupAllNow()">Back up all pending now</button>
          ${configured ? `<button class="btn btn-secondary" style="min-height:44px;color:var(--red);border-color:var(--red);" onclick="Views.clearBackupToken()">Remove token</button>` : ''}
        </div>
        <div id="backup-settings-result" style="margin-top:10px;font-size:0.85rem;"></div>
      </div>`;
  }

  function backupResultBox(ok, msg) {
    const el = document.getElementById('backup-settings-result');
    if (!el) return;
    const color = ok ? 'var(--green)' : 'var(--red)';
    const bg = ok ? 'var(--green-bg)' : 'var(--red-bg)';
    el.innerHTML = `<div style="padding:10px 12px;background:${bg};border:1px solid ${color};border-radius:8px;color:${color};">${esc(msg)}</div>`;
  }

  async function saveBackupSettings() {
    const repoEl = document.getElementById('backup-repo');
    const tokenEl = document.getElementById('backup-token');
    if (repoEl) Backup.setRepo(repoEl.value);
    // Only overwrite the stored token when a new one was actually typed — the field renders empty
    // by design (we never echo the token back), so a blank field must mean "leave it alone".
    if (tokenEl && tokenEl.value.trim()) {
      Backup.setToken(tokenEl.value);
      tokenEl.value = '';
    }
    backupResultBox(true, 'Testing…');
    const r = await Backup.test();
    if (r.ok) {
      backupResultBox(true, r.message);
      // Re-render so the status line and the masked-token label reflect reality immediately.
      setTimeout(() => renderSettings(), 900);
    } else {
      backupResultBox(false, r.error);
    }
  }

  async function backupAllNow() {
    if (!Backup.isConfigured()) { backupResultBox(false, 'Enter a token first.'); return; }
    const pending = Data.getUnbackedSessions().length;
    if (pending === 0) { backupResultBox(true, 'Nothing pending — everything is already backed up.'); return; }
    backupResultBox(true, `Backing up ${pending} session${pending > 1 ? 's' : ''}…`);
    const r = await Backup.retryPending((done) => backupResultBox(true, `Backed up ${done}/${pending}…`));
    if (r.failed === 0) backupResultBox(true, `Backed up ${r.done} session${r.done > 1 ? 's' : ''} ✓`);
    else backupResultBox(false, `${r.done} succeeded, ${r.failed} failed — ${r.error || 'unknown error'}`);
    setTimeout(() => renderSettings(), 1200);
  }

  function clearBackupToken() {
    if (!confirm('Remove the backup token from this phone?\n\nSessions already backed up stay safe on GitHub. New workouts will stop backing up until you paste a token again.')) return;
    Backup.setToken('');
    renderSettings();
  }

  function renderSummary(session) {
    const workout = PROGRAMME.find(w => w.id === session.workoutId);
    if (!workout) { renderHome(); return; }

    const md = Markdown.exportSession(session);

    let exerciseItems = '';
    for (const [idx, data] of Object.entries(session.exercises)) {
      const ex = workout.exercises[parseInt(idx)];
      if (!ex || ex.isFence) continue;

      let setsStr = '';
      if (data.done !== undefined || data.doneL !== undefined) {
        // Completion/duration — show hold times if available
        if (data.doneL !== undefined) {
          const tL = data.timeL ? ` ${Timer.formatTime(data.timeL)}` : '';
          const tR = data.timeR ? ` ${Timer.formatTime(data.timeR)}` : '';
          setsStr = `L: ${data.doneL ? '✅' : '—'}${tL}  R: ${data.doneR ? '✅' : '—'}${tR}`;
        } else {
          const t = data.time ? ` ${Timer.formatTime(data.time)}` : '';
          setsStr = (data.done ? '✅' : '—') + t;
        }
      } else if (data.sets && data.sets.length > 0) {
        const s0 = data.sets[0];
        if (s0.weightL !== undefined) {
          setsStr = data.sets.filter(s => State.setIsClaimed(data, s) && (s.repsL !== '' || s.repsR !== '')).map(s => `L:${s.weightL||0}×${s.repsL||0} R:${s.weightR||0}×${s.repsR||0}`).join(' | ');
        } else if (s0.repsL !== undefined) {
          setsStr = `${data.weight||0}kg — ` + data.sets.filter(s => State.setIsClaimed(data, s) && (s.repsL !== '' || s.repsR !== '')).map(s => `L${s.repsL}/R${s.repsR}`).join(' | ');
        } else if (s0.lengths !== undefined) {
          setsStr = data.sets.filter(s => State.sledRowIsReal(data, s)).map(s => { const tag = s.mode ? s.mode + ' ' : ''; if (s.metres !== undefined) return `${tag}${s.weight||0}kg × ${s.metres}m @ ${Timer.formatTime(s.timeSeconds||0)}`; const m = s.lengths * (s.lengthM || Data.getSledLength()); return `${tag}${s.weight||0}kg × ${s.lengths}L @ ${Timer.formatTime(s.timeSeconds||0)}${m ? ` (~${Math.round(m)}m)` : ''}`; }).join(' | ') || '—';
        } else if (s0.distance !== undefined) {
          setsStr = data.sets.filter(s => s.distance).map(s => `${s.weight||0}kg/h × ${s.distance}m`).join(' | ');
        } else {
          setsStr = data.sets.filter(s => State.setIsClaimed(data, s) && s.reps !== '' && s.reps !== undefined).map(s => `${s.weight || 'BW'}kg${equipMark(ex, data, s)} × ${esc(s.reps)}`).join(' | ');
        }
      }

      const variantLabel = data.variant ? ` [${data.variant}]` : '';

      exerciseItems += `
        <div class="summary-item">
          <div class="summary-name">${ex.name}${variantLabel}</div>
          <div class="summary-sets">${setsStr}</div>
          ${data.notes ? `<div class="summary-notes">${esc(data.notes)}</div>` : ''}
        </div>`;
    }

    app.innerHTML = `
      <div class="header">
        <h1>Session Complete</h1>
      </div>
      <div class="content">
        <div style="text-align:center;margin-bottom:20px;">
          <div style="font-size:2rem;">💪</div>
          <div style="font-size:1.1rem;font-weight:600;">W${session.workoutId} — ${workout.name}</div>
          <div style="color:var(--text2);margin-top:4px;">${Markdown.formatDate(session.date)}</div>
          ${session.startedAt && session.completedAt ? `<div style="color:var(--text2);margin-top:4px;font-size:0.85rem;">${Timer.formatTimeOfDay(session.startedAt)} → ${Timer.formatTimeOfDay(session.completedAt)} (${Timer.formatDuration(new Date(session.completedAt) - new Date(session.startedAt))})</div>` : ''}
          ${session.endAdjusted ? `<div style="color:var(--amber);margin-top:6px;font-size:0.8rem;">⏱ Session was left open — end time set to ${Timer.formatTimeOfDay(session.completedAt)}, your last input.</div>` : ''}
        </div>

        ${session.gym ? `<div style="text-align:center;font-size:0.85rem;color:var(--text2);margin-bottom:12px;">📍 ${esc(session.gym)}</div>` : ''}
        ${session.overall ? `<div class="summary-section"><h3>Overall</h3><div class="summary-item">${esc(session.overall)}</div></div>` : ''}
        ${session.injuries ? `<div class="summary-section"><h3>Injuries / Concerns</h3><div class="summary-item" style="color:var(--amber);">${esc(session.injuries)}</div></div>` : ''}

        <div class="summary-section">
          <h3>Exercises</h3>
          ${exerciseItems}
        </div>

        <div id="backup-status" style="margin-top:20px;"></div>

        <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;">
          <button class="btn btn-primary" onclick="Views.copyMarkdown()">Copy as Markdown</button>
          <button class="btn btn-secondary" onclick="Views.shareMarkdown()">Share</button>
          <button class="btn btn-secondary" onclick="Router.go('/')">Done — Back to Home</button>
        </div>
      </div>`;

    // Store markdown for copy/share
    window._lastMarkdown = md;

    // Zero-tap cloud backup. Fires automatically, reports honestly, and never blocks the summary
    // screen — a failed push leaves the session flagged pending for the next sweep.
    runSummaryBackup();

    // Finish celebration — after the summary has painted, so the burst lands on the 💪 screen.
    requestAnimationFrame(() => Celebrate.session());
  }

  // Renders into #backup-status on the summary screen. Silent only when backup isn't set up
  // (a nag there would be pure noise until the token exists — Settings is where you set it up).
  async function runSummaryBackup() {
    const el = document.getElementById('backup-status');
    if (!el) return;
    if (!Backup.isConfigured()) {
      el.innerHTML = `<div style="padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;font-size:0.82rem;color:var(--text3);text-align:center;">
        ☁️ Cloud backup not set up — <span style="text-decoration:underline;cursor:pointer;" onclick="Router.go('/settings')">turn it on in Settings</span></div>`;
      return;
    }
    const box = (bg, border, color, html) => {
      el.innerHTML = `<div style="padding:10px 12px;background:${bg};border:1px solid ${border};border-radius:10px;font-size:0.85rem;color:${color};text-align:center;">${html}</div>`;
    };
    box('var(--bg-card)', 'var(--border)', 'var(--text2)', '☁️ Backing up…');
    const idx = window._lastSessionIndex;
    const r = await Backup.pushSession(idx);
    Backup.pushEventLog();   // fire-and-forget instrumentation — never gates the session backup status
    if (r.ok) {
      box('var(--green-bg)', 'var(--green)', 'var(--green)', '☁️ Backed up to GitHub ✓');
    } else {
      box('var(--amber-bg)', 'var(--amber)', 'var(--amber)',
        `☁️ Not backed up — ${esc(r.error || 'unknown error')}<br>
         <span style="color:var(--text2);font-size:0.78rem;">Your session is saved on the phone. It will retry automatically.</span><br>
         <button class="btn btn-secondary" style="margin-top:8px;width:auto;padding:8px 14px;font-size:0.8rem;" onclick="Views.retryBackupNow()">Retry now</button>`);
    }
  }

  async function retryBackupNow() {
    const el = document.getElementById('backup-status');
    if (el) el.innerHTML = `<div style="padding:10px 12px;text-align:center;font-size:0.85rem;color:var(--text2);">☁️ Retrying…</div>`;
    await runSummaryBackup();
  }

  async function copyMarkdown() {
    try {
      await navigator.clipboard.writeText(window._lastMarkdown || '');
      if (window._lastSessionIndex !== undefined) Data.markExported(window._lastSessionIndex);
      alert('Copied to clipboard!');
    } catch {
      prompt('Copy this markdown:', window._lastMarkdown || '');
    }
  }

  async function shareMarkdown() {
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'Workout Session',
          text: window._lastMarkdown || ''
        });
        if (window._lastSessionIndex !== undefined) Data.markExported(window._lastSessionIndex);
      } catch { /* user cancelled */ }
    } else {
      copyMarkdown();
    }
  }

  function exportAll() {
    const md = Markdown.exportAll();
    window._lastMarkdown = md;
    if (navigator.share) {
      navigator.share({ title: 'Training Log', text: md }).catch(() => {});
    } else {
      navigator.clipboard.writeText(md)
        .then(() => alert('All sessions copied to clipboard!'))
        .catch(() => prompt('Copy:', md));
    }
  }

  function showImportModal() {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'import-modal';
    overlay.innerHTML = `
      <div class="modal">
        <h2>Load History</h2>
        <p style="font-size:0.85rem;color:var(--text2);margin-bottom:10px;">
          Paste your training-log.md content below. Sessions will be added to your history.
        </p>
        <textarea id="import-text" placeholder="Paste markdown here..."></textarea>
        <div id="import-result"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" onclick="document.getElementById('import-modal').remove()">Cancel</button>
          <button class="btn btn-primary" onclick="Views.doImport()">Import</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.remove();
    });
  }

  function doImport() {
    const text = document.getElementById('import-text')?.value;
    if (!text) return;

    const result = Markdown.importMarkdown(text);
    const resultEl = document.getElementById('import-result');

    if (result.sessions.length === 0) {
      resultEl.innerHTML = `<div class="import-result" style="background:var(--red-bg);color:var(--red);">No sessions found. Check the format.</div>`;
      return;
    }

    // Dedup, content-aware. A stored session and an incoming one can collide on date+workoutId.
    // The old behaviour skipped the incoming copy REGARDLESS of content, so a thin stored session
    // permanently masked the fuller one in the log — reported as nothing but "1 duplicate skipped".
    // (That's what made only one rhythm-squat session show on the phone.) Now: compare how much real
    // data each carries, keep the richer, and account for every collision by date.
    const existing = Data.getSessions();
    const combined = existing.slice();
    const byKey = new Map();
    combined.forEach((s, i) => byKey.set(`${s.date}|${s.workoutId}`, i));
    const newSessions = [], replaced = [], thinnerKept = [], identical = [];

    for (const s of result.sessions) {
      const key = `${s.date}|${s.workoutId}`;
      if (!byKey.has(key)) { newSessions.push(s); continue; }
      const i = byKey.get(key);
      const mine = State.sessionRichness(combined[i]);
      const theirs = State.sessionRichness(s);
      const verdict = State.importCollisionVerdict(combined[i], s);
      if (verdict === 'replace') {
        s.exported = true;
        combined[i] = State.mergeSessionFields(combined[i], s);
        replaced.push({ ...s, mine, theirs });
      } else if (verdict === 'identical') {
        identical.push(s);                       // genuine no-op — nothing to see, nothing lost
      } else {
        thinnerKept.push({ ...s, mine, theirs }); // stored copy wins; worth knowing your log is thinner
      }
    }

    // Imported sessions came FROM a markdown backup (your log) → already backed up, so don't nag
    // "not exported". (getSessions re-sorts on read, so combine order doesn't matter here.)
    newSessions.forEach(s => { s.exported = true; });
    combined.push(...newSessions);
    try {
      Data.saveSessions(combined);
    } catch (e) {
      // Storage full — data was NOT saved. saveSessions() already showed the
      // storage-full prompt. Surface the failure instead of a false success.
      resultEl.innerHTML = `<div class="import-result" style="background:var(--red-bg);color:var(--red);">Import failed — storage may be full. Nothing was saved. Export and clear old sessions, then try again.</div>`;
      return;
    }

    const nice = r => `${r.exercises} exercise(s) / ${r.datapoints} set(s)`;
    let msg = `Imported ${newSessions.length} session(s), ${result.matched} exercise(s) matched.`;
    if (replaced.length > 0) msg += ` ${replaced.length} upgraded to a fuller version.`;
    // A genuinely identical duplicate is a no-op, not a problem — but still NAME the dates rather
    // than hiding them behind a bare count, so a skip is never invisible.
    if (identical.length > 0) msg += ` ${identical.length} already stored, nothing new (${identical.map(s => `${s.date} W${s.workoutId}`).join(', ')}).`;

    // Never report success silently over dropped or CHANGED data: itemise it, with reasons.
    const probs = [];
    for (const s of (result.skippedSessions || [])) probs.push(`Session “${s.header}” — ${s.reason}`);
    for (const l of (result.skippedLines || [])) probs.push(`${l.name} (W${l.workoutId}, ${l.date}) — ${l.reason}`);
    for (const k of thinnerKept) probs.push(`Session ${k.date} (W${k.workoutId}) — kept the copy already in the app (${nice(k.mine)}); the imported one was thinner (${nice(k.theirs)}). Nothing lost here, but your log may be missing data for that day.`);
    // Replacements ARE imported — but they overwrite stored data, so they must be seen, not auto-dismissed.
    for (const r of replaced) probs.push(`Session ${r.date} (W${r.workoutId}) — upgraded: the app had ${nice(r.mine)}, your log had ${nice(r.theirs)}. The fuller version is now stored.`);

    // Re-init state to pick up new history
    State.init();

    if (probs.length === 0) {
      // Clean import: brief confirmation, then auto-close.
      resultEl.innerHTML = `<div class="import-result" style="background:var(--green-bg);color:var(--green);">${msg}</div>`;
      setTimeout(() => {
        document.getElementById('import-modal')?.remove();
        renderHome();
      }, 2000);
    } else {
      // Something wasn't imported, or stored data changed — DO NOT auto-dismiss. The user must
      // actually read the list, otherwise "never silent" is defeated by a report that vanishes in 2s.
      // Heading stays honest about which kind of list this is (nothing imported vs data upgraded).
      const notImported = probs.length - replaced.length;
      const heading = notImported > 0
        ? `<strong>${notImported} item(s) not imported</strong> (still safe in your source log)${replaced.length ? `, ${replaced.length} session(s) upgraded` : ''}:`
        : `<strong>${replaced.length} session(s) upgraded</strong> — stored data changed, so read this before closing:`;
      const list = probs.map(p => `<li>${esc(p)}</li>`).join('');
      resultEl.innerHTML = `<div class="import-result" style="background:var(--amber-bg);color:var(--amber);">${msg} ${heading}<ul style="margin:8px 0 0;padding-left:18px;">${list}</ul><button class="btn btn-primary" style="margin-top:12px;width:100%;" onclick="document.getElementById('import-modal')?.remove(); Views.renderHome();">Done</button></div>`;
    }
  }

  // Compact "working loads" line for the Session History list — top-set kg of each genuinely-logged
  // weight-bearing exercise, so loads are visible without opening the session.
  function sessionKgSummary(s, workout) {
    if (!workout || !s.exercises) return '';
    const parts = [];
    for (const [idx, data] of Object.entries(s.exercises)) {
      if (!State.entryHasGenuineData(data) || !Array.isArray(data.sets) || data.sets.length === 0) continue;
      const ex = (data.exId && workout.exercises.find(e => e.id === data.exId)) || workout.exercises[parseInt(idx)];
      if (!ex) continue;
      const top = data.sets[data.sets.length - 1];
      const w = (top.weight != null && top.weight !== '') ? parseFloat(top.weight)
              : (top.weightL != null ? parseFloat(top.weightL) : NaN);
      if (!w || isNaN(w)) continue;
      parts.push(`${esc(ex.name)} ${w}kg`);
    }
    if (parts.length === 0) return '';
    const MAX = 4;
    return parts.slice(0, MAX).join(' · ') + (parts.length > MAX ? ` +${parts.length - MAX}` : '');
  }

  function renderSettings() {
    const sessions = Data.getSessions();

    let sessionRows = '';
    if (sessions.length === 0) {
      sessionRows = '<div style="color:var(--text3);text-align:center;padding:20px;">No sessions recorded yet.</div>';
    } else {
      // Show newest first
      for (let i = sessions.length - 1; i >= 0; i--) {
        const s = sessions[i];
        const workout = PROGRAMME.find(w => w.id === s.workoutId);
        const wName = workout ? workout.name : `Workout ${s.workoutId}`;
        const exCount = Object.keys(s.exercises).length;
        const exported = s.exported ? '✅' : '⚠️';
        const kgLine = sessionKgSummary(s, workout);

        sessionRows += `
          <div class="summary-item" style="display:flex;align-items:center;gap:8px;">
            <div style="flex:1;cursor:pointer;" onclick="Router.go('/session/${i}')">
              <div class="summary-name">${exported} W${s.workoutId} — ${Markdown.formatDate(s.date)}</div>
              <div class="summary-sets">${wName} · ${exCount} exercises${s.exported ? ' · Exported' : ' · Not exported'}</div>
              ${kgLine ? `<div class="summary-sets" style="color:var(--text3);margin-top:2px;">${kgLine}</div>` : ''}
            </div>
            <button class="btn btn-secondary" style="flex:none;padding:8px 12px;font-size:0.8rem;width:auto;" onclick="Views.exportSingleSession(${i})">Export</button>
            <button class="btn btn-secondary" style="flex:none;padding:8px 10px;font-size:0.8rem;width:auto;color:var(--red);border-color:var(--red);" onclick="Views.deleteSession(${i})">✕</button>
          </div>`;
      }
    }

    app.innerHTML = `
      <div class="header">
        <button class="back-btn" onclick="Router.go('/')">← Home</button>
        <h1>Settings & History</h1>
      </div>
      <div class="content">
        <div style="margin-bottom:20px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <span style="font-weight:600;font-size:0.95rem;">Version</span>
          <span style="font-size:0.95rem;color:var(--text2);font-variant-numeric:tabular-nums;">${APP_VERSION}</span>
        </div>
        <div style="margin-bottom:20px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
          <span style="font-weight:600;font-size:0.95rem;">Bodyweight <span style="font-weight:400;color:var(--text3);">— scales ATG standards</span></span>
          <span style="font-size:0.95rem;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap;">${BODYWEIGHT_KG} kg <span style="color:var(--text3);">· ${Markdown.formatDate(BODYWEIGHT_DATE)}</span></span>
        </div>
        ${renderBackupCard()}

        <div class="summary-section">
          <h3>Session History (${sessions.length} total)</h3>
          ${sessionRows}
        </div>

        <div style="margin-top:24px;display:flex;flex-direction:column;gap:10px;">
          <button class="btn btn-secondary" onclick="Views.exportAll()">Export All Sessions</button>
          <button class="btn btn-secondary" onclick="Views.showImportModal()">Load History (Import)</button>
          <button class="btn btn-secondary" style="color:var(--red);border-color:var(--red);" onclick="Views.clearAllHistory()">Clear All History</button>
        </div>

        <div id="storage-info" style="margin-top:24px;padding:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;font-size:0.8rem;color:var(--text2);">
          <div style="font-weight:600;margin-bottom:6px;">Storage</div>
          <div id="storage-usage">Calculating...</div>
        </div>
      </div>`;

    // Calculate localStorage usage
    setTimeout(() => {
      const el = document.getElementById('storage-usage');
      if (!el) return;
      let totalBytes = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        totalBytes += key.length * 2 + (localStorage.getItem(key) || '').length * 2; // UTF-16
      }
      const kb = (totalBytes / 1024).toFixed(1);
      const pct = ((totalBytes / (5 * 1024 * 1024)) * 100).toFixed(1);
      const sessionsBytes = ((localStorage.getItem('gym-sessions') || '').length * 2 / 1024).toFixed(1);
      const color = pct > 80 ? 'var(--red)' : pct > 50 ? 'var(--amber)' : 'var(--text2)';
      el.innerHTML = `${kb} KB used (~${pct}% of 5 MB limit)<br><span style="color:${color}">Session history: ${sessionsBytes} KB · ${sessions.length} sessions</span>`;
    }, 0);
  }

  function exportSingleSession(sessionIndex) {
    const sessions = Data.getSessions();
    const session = sessions[sessionIndex];
    if (!session) return;

    const md = Markdown.exportSession(session);
    window._lastMarkdown = md;
    window._lastSessionIndex = sessionIndex;

    if (navigator.share) {
      navigator.share({ title: 'Workout Session', text: md })
        .then(() => {
          Data.markExported(sessionIndex);
          renderSettings(); // refresh to show updated export status
        })
        .catch(() => {});
    } else {
      navigator.clipboard.writeText(md)
        .then(() => {
          Data.markExported(sessionIndex);
          alert('Session copied to clipboard!');
          renderSettings();
        })
        .catch(() => prompt('Copy:', md));
    }
  }

  function deleteSession(sessionIndex) {
    const sessions = Data.getSessions();
    const session = sessions[sessionIndex];
    const exportWarning = session && !session.exported ? '\n\nThis session has NOT been exported yet!' : '';
    if (!confirm(`Delete this session? This cannot be undone.${exportWarning}`)) return;
    sessions.splice(sessionIndex, 1);
    try {
      Data.saveSessions(sessions);
    } catch (e) {
      // Storage full — the delete didn't persist. saveSessions() already showed the
      // storage-full prompt. Alert and re-render so the screen never looks frozen.
      alert('Could not save the change — storage may be full. Export and clear old sessions.');
    }
    renderSettings();
  }

  // Bulk-clear ALL session history (localStorage). For a clean re-import when the canonical copy
  // lives elsewhere (the Documents log). WIP/settings untouched. Guarded by a confirm + backup warning.
  function clearAllHistory() {
    const sessions = Data.getSessions();
    if (sessions.length === 0) { alert('No history to clear — it\'s already empty.'); return; }
    const unexported = sessions.filter(s => !s.exported).length;
    const warn = unexported > 0
      ? `\n\n⚠️ ${unexported} of these have NOT been exported from this app. Only wipe if your data is safely backed up elsewhere (e.g. your Documents log).`
      : '';
    if (!confirm(`Delete ALL ${sessions.length} session(s)? This cannot be undone.${warn}`)) return;
    try {
      Data.saveSessions([]);
    } catch (e) {
      alert('Could not clear — storage error. Nothing was changed.');
      return;
    }
    State.init();
    renderSettings();
  }

  // ---- Shared helper: format exercise data as compact string ----
  function formatExerciseDataCompact(data, ex) {
    if (data.done !== undefined || data.doneL !== undefined) {
      if (data.doneL !== undefined) {
        const tL = data.timeL ? `(${data.timeL}s)` : '';
        const tR = data.timeR ? `(${data.timeR}s)` : '';
        return `L${data.doneL ? '✅' : '—'}${tL} R${data.doneR ? '✅' : '—'}${tR}`;
      }
      const t = data.time ? `(${data.time}s)` : '';
      return `${data.done ? '✅' : '—'}${t}`;
    }
    if (!data.sets || data.sets.length === 0) return '—';
    const s0 = data.sets[0];
    const wLabel = ex?.weightLabel || 'kg';
    if (s0.lengths !== undefined) {
      return data.sets.filter(s => State.sledRowIsReal(data, s)).map(s => { const tag = s.mode ? s.mode + ' ' : ''; if (s.metres !== undefined) return `${tag}${s.weight||0}${wLabel} × ${s.metres}m ${Timer.formatTime(s.timeSeconds||0)}`; const m = s.lengths * (s.lengthM || Data.getSledLength()); return `${tag}${s.weight||0}${wLabel} × ${s.lengths}L ${Timer.formatTime(s.timeSeconds||0)}${m ? ` (~${Math.round(m)}m)` : ''}`; }).join(', ') || '—';
    }
    if (s0.distance !== undefined) {
      return data.sets.map(s => `${s.weight||0}${wLabel}/h × ${s.distance}m`).join(', ');
    }
    if (s0.weightL !== undefined) {
      const shown = data.sets.filter(s => State.setIsClaimed(data, s));
      if (shown.length === 0) return '—';
      return shown.map(s => `L:${s.weightL||0}×${s.repsL||0} R:${s.weightR||0}×${s.repsR||0}`).join(', ');
    }
    if (s0.repsL !== undefined) {
      const shown = data.sets.filter(s => State.setIsClaimed(data, s));
      if (shown.length === 0) return '—';
      // New format: per-set weight; old format: shared data.weight
      if (s0.weight !== undefined) {
        const weights = shown.map(s => parseFloat(s.weight) || 0);
        const allSameW = weights.every(w => Math.abs(w - weights[0]) < 0.01);
        if (allSameW) {
          return `${weights[0]}${wLabel} — ` + shown.map(s => `L${s.repsL}/R${s.repsR}`).join(', ');
        }
        return shown.map(s => `${s.weight||0}${wLabel} L${s.repsL}/R${s.repsR}`).join(', ');
      }
      return `${data.weight||0}${wLabel} — ` + shown.map(s => `L${s.repsL}/R${s.repsR}`).join(', ');
    }
    // Standard weight×reps
    const hasAssisted = s => s.repsAssisted !== null && s.repsAssisted !== undefined && s.repsAssisted !== '';
    const validSets = data.sets.filter(s => State.setIsClaimed(data, s) && ((s.reps !== null && s.reps !== undefined && s.reps !== '' && parseInt(s.reps) !== 0) || hasAssisted(s)));
    if (validSets.length === 0) return '—';
    const weights = validSets.map(s => parseFloat(s.weight) || 0);
    const allSame = weights.length > 0 && weights.every(w => Math.abs(w - weights[0]) < 0.01);
    const anyMark = validSets.some(s => equipMark(ex, data, s));
    if (allSame && !anyMark) {
      return `${validSets.length}×[${validSets.map(s => esc(repDisplay(s))).join(', ')}] @ ${weights[0] ? weights[0] + wLabel : 'BW'}`;
    }
    return `${validSets.length}×[${validSets.map(s => `${esc(repDisplay(s))}@${parseFloat(s.weight)||0}${equipMark(ex, data, s)}`).join(', ')}] ${wLabel}`;
  }

  // ---- Format sets as readable HTML rows (not export format) ----
  function formatSetsReadable(data, ex) {
    const wLabel = ex?.weightLabel || 'kg';
    if (data.skipState) {
      const label = data.skipState === 'skipped' ? 'Skipped' : 'Not logged';
      return `<div class="sd-sets"><div class="sd-set skip-status">⊘ ${label}</div></div>`;
    }
    if (data.done !== undefined || data.doneL !== undefined) {
      if (data.doneL !== undefined) {
        const tL = data.timeL ? ` (${Timer.formatTime(data.timeL)})` : '';
        const tR = data.timeR ? ` (${Timer.formatTime(data.timeR)})` : '';
        return `<div class="sd-sets"><div class="sd-set">L: ${data.doneL ? '✅' : '—'}${tL}</div><div class="sd-set">R: ${data.doneR ? '✅' : '—'}${tR}</div></div>`;
      }
      const t = data.time ? ` (${Timer.formatTime(data.time)})` : '';
      return `<div class="sd-sets"><div class="sd-set">${data.done ? '✅' : '—'}${t}</div></div>`;
    }
    if (!data.sets || data.sets.length === 0) return '<div class="sd-sets"><div class="sd-set">—</div></div>';
    const s0 = data.sets[0];

    if (s0.metres !== undefined) {
      return `<div class="sd-sets">${data.sets.filter(s => State.sledRowIsReal(data, s)).map((s, i) =>
        `<div class="sd-set"><span class="sd-num">${i+1}</span> ${s.mode ? s.mode + ' · ' : ''}${s.weight||0}${wLabel} · ${s.metres}m · ${Timer.formatTime(s.timeSeconds||0)}</div>`
      ).join('') || '—'}</div>`;
    }
    if (s0.lengths !== undefined) {
      const sledLength = Data.getSledLength();
      return `<div class="sd-sets">${data.sets.filter(s => State.sledRowIsReal(data, s)).map((s, i) => {
        const dist = s.lengths * (s.lengthM || sledLength);
        return `<div class="sd-set"><span class="sd-num">${i+1}</span> ${s.mode ? s.mode + ' · ' : ''}${s.weight||0}${wLabel} · ${s.lengths}L · ${Timer.formatTime(s.timeSeconds||0)}${dist ? ` (~${Math.round(dist)}m)` : ''}</div>`;
      }).join('') || '—'}</div>`;
    }
    if (s0.distance !== undefined) {
      return `<div class="sd-sets">${data.sets.map((s, i) =>
        `<div class="sd-set"><span class="sd-num">${i+1}</span> ${s.weight||0}${wLabel}/hand · ${s.distance}m</div>`
      ).join('')}</div>`;
    }
    if (s0.weightL !== undefined) {
      const shown = data.sets.filter(s => State.setIsClaimed(data, s));
      if (shown.length === 0) return '<div class="sd-sets"><div class="sd-set">—</div></div>';
      return `<div class="sd-sets">${shown.map((s, i) =>
        `<div class="sd-set"><span class="sd-num">${i+1}</span> L: ${s.weightL||0}${wLabel}×${s.repsL||0} · R: ${s.weightR||0}${wLabel}×${s.repsR||0}</div>`
      ).join('')}</div>`;
    }
    if (s0.repsL !== undefined) {
      const shown = data.sets.filter(s => State.setIsClaimed(data, s));
      if (shown.length === 0) return '<div class="sd-sets"><div class="sd-set">—</div></div>';
      // New format: per-set weight; old format: shared data.weight
      if (s0.weight !== undefined) {
        return `<div class="sd-sets">${shown.map((s, i) =>
          `<div class="sd-set"><span class="sd-num">${i+1}</span> ${s.weight||0}${wLabel} · L: ${s.repsL} · R: ${s.repsR}</div>`
        ).join('')}</div>`;
      }
      const w = data.weight || 0;
      return `<div class="sd-sets"><div class="sd-set" style="margin-bottom:4px;">${w}${wLabel}</div>${shown.map((s, i) =>
        `<div class="sd-set"><span class="sd-num">${i+1}</span> L: ${s.repsL} · R: ${s.repsR}</div>`
      ).join('')}</div>`;
    }
    // Standard weight×reps
    const hasAssistedR = s => s.repsAssisted !== null && s.repsAssisted !== undefined && s.repsAssisted !== '';
    const validSets = data.sets.filter(s => State.setIsClaimed(data, s) && ((s.reps !== null && s.reps !== undefined && s.reps !== '' && parseInt(s.reps) !== 0) || hasAssistedR(s)));
    if (validSets.length === 0) return '<div class="sd-sets"><div class="sd-set">—</div></div>';
    return `<div class="sd-sets">${validSets.map((s, i) =>
      `<div class="sd-set"><span class="sd-num">${i+1}</span> ${parseFloat(s.weight)||0}${wLabel}${equipMark(ex, data, s)} × ${esc(repDisplay(s))}</div>`
    ).join('')}</div>`;
  }

  // ---- Session Detail View ----
  function renderSessionDetail(sessionIndex) {
    const sessions = Data.getSessions();
    const session = sessions[sessionIndex];
    if (!session) { Router.go('/settings'); return; }
    const workout = PROGRAMME.find(w => w.id === session.workoutId);
    if (!workout) { Router.go('/settings'); return; }

    let rows = '';
    for (const [idx, data] of Object.entries(session.exercises)) {
      const ex = (data.exId && workout.exercises.find(e => e.id === data.exId)) || workout.exercises[parseInt(idx)];
      if (!ex || ex.isFence) continue;
      const displayName = Markdown.resolveDisplayName(ex, data);
      const setsHtml = formatSetsReadable(data, ex);
      rows += `
        <div class="session-detail-item">
          <div class="session-detail-name">${displayName}</div>
          ${setsHtml}
          ${data.notes ? `<div class="session-detail-notes">${esc(data.notes)}</div>` : ''}
        </div>`;
    }

    app.innerHTML = `
      <div class="header">
        <button class="back-btn" onclick="Router.go('/settings')">← Settings</button>
        <h1>Session Detail</h1>
      </div>
      <div class="content">
        <div class="summary-section">
          <h3>W${session.workoutId} — ${Markdown.formatDate(session.date)}</h3>
          <div style="font-size:0.8rem;color:var(--text3);margin-bottom:12px;">${workout.name} · ${Object.keys(session.exercises).length} exercises${session.gym ? ` · ${esc(session.gym)}` : ''}</div>
          ${session.overall ? `<div style="margin-bottom:8px;"><strong>Overall:</strong> ${esc(session.overall)}</div>` : ''}
          ${session.injuries ? `<div style="margin-bottom:8px;"><strong>Injuries:</strong> ${esc(session.injuries)}</div>` : ''}
          ${rows}
        </div>
      </div>`;
  }

  // ---- Exercise History Page ----
  // Narrow an exercise's history to the currently-selected variant, so e.g. the seated ham-curl
  // variant of nordic-curl shows only seated-ham-curl sessions. Untagged legacy entries are shown
  // only under the default variant. Returns all entries when the exercise has no variants.
  function filterHistoryByVariant(all, exDef, activeVar) {
    if (!exDef || !exDef.variants || !activeVar) return all;
    const defId = (exDef.variants.find(v => v.isDefault) || exDef.variants[0]).id;
    return all.filter(h => h.data.variant === activeVar.id || (activeVar.id === defId && !h.data.variant));
  }

  // Which variant an entry was logged as (v1.27.0). An UNTAGGED entry is the default variant —
  // the same rule `filterHistoryByVariant` and the exporter already use, so legacy rows logged
  // before a variant existed stay attributed correctly instead of reading as "unknown".
  // Returns null for exercises that have no variants at all — those get no tag.
  function variantInfoFor(exDef, data, activeVar) {
    if (!exDef || !exDef.variants) return null;
    const def = exDef.variants.find(v => v.isDefault) || exDef.variants[0];
    const id = data.variant || def.id;
    const v = exDef.variants.find(x => x.id === id);
    if (!v) return null;   // a variant that no longer exists in the programme — don't invent a label
    return { label: v.label, isCurrent: !!activeVar && v.id === activeVar.id };
  }

  function renderExerciseHistory(exerciseId) {
    // Find exercise definition across all workouts
    let exDef = null;
    for (const w of PROGRAMME) {
      const found = w.exercises.find(e => e.id === exerciseId);
      if (found) { exDef = found; break; }
    }
    if (!exDef) { Router.go('/'); return; }

    const activeVar = exDef.variants ? getActiveVariant(exDef) : null;
    // v1.27.0: history shows EVERY variant of the exercise, each tagged — they're one movement's
    // history, and hiding the siblings made a switch look like the record had been wiped.
    // (Prefill/progression/last-session stay variant-filtered — nordic numbers must never prefill
    // a ham curl.)
    const history = State.getExerciseHistory(exerciseId);
    const userCues = Data.getUserCues(exerciseId);
    const structuredCues = getStructuredCues(exDef);
    const defaultCuesText = structuredCues
      ? [
          ...(structuredCues.setup || []).map(s => `Setup: ${s}`),
          ...(structuredCues.exec || []).map(s => `Do: ${s}`),
          ...(structuredCues.mistakes || []).map(s => `Don't: ${s}`),
          ...(structuredCues.you || []).map(s => `You: ${s}`)
        ].join('\n')
      : (exDef.formCues || '');

    const displayCues = userCues !== null ? userCues : defaultCuesText;

    // History entries
    let entriesHtml = '';
    if (history.length === 0) {
      entriesHtml = '<div style="color:var(--text3);text-align:center;padding:20px;">No sessions recorded yet.</div>';
    } else {
      for (const h of history.slice(0, 15)) {
        const dataStr = formatExerciseDataCompact(h.data, h.exercise);
        const vi = variantInfoFor(exDef, h.data, activeVar);
        const tag = vi ? `<span class="history-variant-tag${vi.isCurrent ? ' current' : ''}">${esc(vi.label)}</span>` : '';
        entriesHtml += `
          <div class="history-entry">
            <div class="history-entry-date">W${h.workoutId} — ${Markdown.formatDate(h.date)}${tag}</div>
            <div class="history-entry-data">${dataStr}</div>
            ${h.data.notes ? `<div class="history-entry-notes">${esc(h.data.notes)}</div>` : ''}
          </div>`;
      }
    }

    // Collect all notes for copy button
    const allNotes = history.filter(h => h.data.notes).map(h => `${Markdown.formatDate(h.date)}: ${h.data.notes}`).join('\n\n');

    app.innerHTML = `
      <div class="header">
        <button class="back-btn" onclick="history.back()">← Back</button>
        <h1>${exDef.name}</h1>
      </div>
      <div class="content">
        ${displayCues ? `<div class="history-cues">
          <div class="history-cues-label">Form Cues</div>
          <div class="history-cues-text">${displayCues}</div>
        </div>` : ''}

        <div class="summary-section">
          <h3>Recent Sessions (${history.length})${exDef.variants ? ' · all variants' : ''}</h3>
          ${entriesHtml}
        </div>

        ${allNotes ? `
        <div style="margin-top:16px;">
          <button class="btn btn-secondary" style="width:100%;font-size:0.85rem;" onclick="Views.copyNotesHistory('${exerciseId}')">Copy all notes for AI review</button>
        </div>` : ''}
      </div>`;
  }


  function copyNotesHistory(exerciseId) {
    let exDef = null;
    for (const w of PROGRAMME) {
      const found = w.exercises.find(e => e.id === exerciseId);
      if (found) { exDef = found; break; }
    }
    const exName = exDef ? exDef.name : exerciseId;
    const activeVar = exDef && exDef.variants ? getActiveVariant(exDef) : null;
    // Matches what the screen shows (v1.27.0): all variants, each named — the variant is exactly
    // the context an AI reader needs to tell "nordic curl" notes from "ham curl (prone)" notes.
    const history = State.getExerciseHistory(exerciseId);
    const text = `# ${exName} — Notes History\n\n` +
      history.filter(h => h.data.notes).map(h => {
        const vi = variantInfoFor(exDef, h.data, activeVar);
        return `**${Markdown.formatDate(h.date)}** (W${h.workoutId})${vi ? ` — ${vi.label}` : ''}:\n${h.data.notes}`;
      }).join('\n\n');

    if (navigator.share) {
      navigator.share({ title: `${exName} Notes`, text }).catch(() => {});
    } else {
      navigator.clipboard.writeText(text)
        .then(() => alert('Notes copied to clipboard!'))
        .catch(() => prompt('Copy:', text));
    }
  }

  function _syncSessionNotes() {
    const overall = document.getElementById('overall-notes')?.value || '';
    const injuries = document.getElementById('injury-notes')?.value || '';
    const gymSel = document.getElementById('gym-select');
    const gym = gymSel ? gymSel.value : undefined;
    State.updateSessionNotes(overall, injuries, gym);
  }

  function _addNewGym() {
    const name = prompt('Enter new gym name:');
    if (name && name.trim()) {
      Data.addGym(name.trim());
      // Re-render to show updated select
      const wip = State.getWIP();
      if (wip) renderWorkout(wip.workoutId);
    } else {
      // Reset select to previous value
      const gymSel = document.getElementById('gym-select');
      if (gymSel) gymSel.value = State.getWIP()?.gym || Data.getLastGym();
    }
  }

  return { renderHome, renderWorkout, renderExercise, autoSaveExercise, saveExercise, saveAndBack, completeExercise, updateBanner, finishWorkout, skipGapsAndFinish, fillGapsAndFinish, setUntouchedChoice, renderSummary, copyMarkdown, shareMarkdown, exportAll, showImportModal, doImport, renderSettings, exportSingleSession, deleteSession, clearAllHistory, switchVariant, toggleChopDirection, adjustTime, setTimeManual, handleTimerTap, addSet, _triggerAutoSave, _updateSledDerived, _updateSlmDerived, setSledMode, _mtAction, renderSessionDetail, renderExerciseHistory, copyNotesHistory, _syncSessionNotes, _addNewGym, peekTo, testSound, startSessionGuarded, openExercise, saveBackupSettings, backupAllNow, clearBackupToken, retryBackupNow };
})();

// =====================================================
// ROUTER — hash-based SPA routing
// =====================================================
const Router = (function() {
  function parseHash() {
    const hash = location.hash.slice(1) || '/';
    const parts = hash.split('/').filter(Boolean);

    if (parts[0] === 'w' && parts.length === 2) {
      return { view: 'workout', workoutId: parseInt(parts[1]) };
    }
    if (parts[0] === 'w' && parts[1] && parts[2] === 'e' && parts[3] !== undefined) {
      return { view: 'exercise', workoutId: parseInt(parts[1]), exIndex: parseInt(parts[3]) };
    }
    if (parts[0] === 'w' && parts[1] && parts[2] === 'summary') {
      return { view: 'summary', workoutId: parseInt(parts[1]) };
    }
    if (parts[0] === 'settings') {
      return { view: 'settings' };
    }
    if (parts[0] === 'session' && parts[1] !== undefined) {
      return { view: 'sessionDetail', sessionIndex: parseInt(parts[1]) };
    }
    if (parts[0] === 'exercise' && parts[1]) {
      return { view: 'exerciseHistory', exerciseId: parts[1] };
    }
    return { view: 'home' };
  }

  function clearSessionClock() {
    if (window._sessionClockInterval) { clearInterval(window._sessionClockInterval); window._sessionClockInterval = null; }
  }

  function route() {
    clearSessionClock();
    const r = parseHash();
    switch (r.view) {
      case 'workout': Views.renderWorkout(r.workoutId); break;
      case 'exercise': Views.renderExercise(r.workoutId, r.exIndex); break;
      case 'settings': Views.renderSettings(); break;
      case 'sessionDetail': Views.renderSessionDetail(r.sessionIndex); break;
      case 'exerciseHistory': Views.renderExerciseHistory(r.exerciseId); break;
      case 'home': default: Views.renderHome(); break;
    }
  }

  function go(path) {
    location.hash = path;
  }

  function init() {
    window.addEventListener('hashchange', route);
    route();
  }

  return { init, go };
})();

// =====================================================
// APP VERSION + AUTO-UPDATE CHECK
// =====================================================
const APP_VERSION = '1.28.0';

// =====================================================
// APP INIT
// =====================================================
(function() {
  // One-time data repair: stamp exercise IDs onto history saved before the stable-ID fix.
  // History was keyed by array index; the W2/W4/W5 reorders mis-mapped pre-existing sessions.
  function migrateExIds() {
    try {
      if (parseInt(localStorage.getItem('gym-schema-version') || '0') >= 1) return;
      const raw = localStorage.getItem('gym-sessions');
      if (raw == null) { localStorage.setItem('gym-schema-version', '1'); return; }
      // Back up the untouched blob once before mutating; if backup fails we abort (mutation never runs).
      if (!localStorage.getItem('gym-sessions-backup-preMigration')) {
        localStorage.setItem('gym-sessions-backup-preMigration', raw);
      }
      const OLD_W2 = ['backward-treadmill','sled','tibialis-raise','patrick-step-up','big-toe-stretch','calf-stretch','jefferson-curl','cable-pancake','atg-split-squat','rdl','malto-fence','pullup-overhand','weighted-dips','scott-curl'];
      const OLD_W4 = ['backward-treadmill','sled','tibialis-raise','seated-calf-raise','reverse-nordics','ham-curl-activation','internal-hip-db-lift','pigeon-stretch','loaded-butterfly','pullover','ql-extension','malto-fence','front-squat','ham-curl','chinup-underhand','incline-press','hammer-curls'];
      const OLD_W5 = ['backward-treadmill','sled','tibialis-raise','poliquin-step-up','big-toe-stretch','calf-stretch','jefferson-curl','cable-pancake','atg-lunge','rdl','malto-fence','full-range-row','incline-press','hammer-curls'];
      const sessions = JSON.parse(raw);
      for (const s of sessions) {
        if (!s || !s.exercises) continue;
        let table = null;
        if (s.workoutId === 4 && (s.date < '2026-04-19' || s.exercises['16'])) table = OLD_W4;
        else if (s.workoutId === 5 && s.date < '2026-04-11') table = OLD_W5;
        else if (s.workoutId === 2) {
          // W2 reordered same-day as the only W2 session — disambiguate by data shape:
          // OLD W2 had the split_reps ATG split squat at index 8 (it carries repsL).
          const d8 = s.exercises['8'];
          if (d8 && Array.isArray(d8.sets) && d8.sets[0] && d8.sets[0].repsL !== undefined) table = OLD_W2;
        }
        const cur = PROGRAMME.find(w => w.id === s.workoutId);
        for (const [idx, data] of Object.entries(s.exercises)) {
          if (!data || data.exId) continue;
          const i = parseInt(idx);
          const id = table ? table[i] : (cur && cur.exercises[i] ? cur.exercises[i].id : undefined);
          if (id) data.exId = id;
        }
      }
      localStorage.setItem('gym-sessions', JSON.stringify(sessions));
      localStorage.setItem('gym-schema-version', '1');
    } catch (e) { /* never block boot; backup (if written) preserves the original data */ }
  }
  migrateExIds();

  // One-time scrub of "ghost" entries: exercise screens that were opened (auto-saving a prefilled
  // sets array) but never actually logged. History used to count these, surfacing phantom sessions
  // (e.g. a 24-June Incline DB press that echoed the last real session). Export always filtered them,
  // so they only ever lived in localStorage — this removes them there too, with a backup first.
  function scrubGhostEntries() {
    try {
      if (parseInt(localStorage.getItem('gym-schema-version') || '0') >= 2) return;
      const raw = localStorage.getItem('gym-sessions');
      if (raw == null) { localStorage.setItem('gym-schema-version', '2'); return; }
      // Back up the pre-scrub blob once before mutating; if backup fails, abort (mutation never runs).
      if (!localStorage.getItem('gym-sessions-backup-preScrub')) {
        localStorage.setItem('gym-sessions-backup-preScrub', raw);
      }
      const sessions = JSON.parse(raw);
      if (Array.isArray(sessions)) {
        for (const s of sessions) {
          if (!s || !s.exercises) continue;
          for (const idx of Object.keys(s.exercises)) {
            if (!State.entryHasGenuineData(s.exercises[idx])) delete s.exercises[idx];
          }
        }
        localStorage.setItem('gym-sessions', JSON.stringify(sessions));
      }
      localStorage.setItem('gym-schema-version', '2');
    } catch (e) { /* never block boot; backup (if written) preserves the original data */ }
  }
  scrubGhostEntries();

  State.init();
  Router.init();

  // One-time "you just updated" confirmation. If the running build differs from the version we
  // last recorded, this load landed a new build — confirm it visibly so a successful update is
  // unmistakable (pairs with the "Update available" banner). Shows once per version.
  function showUpdatedToast(v) {
    const toast = document.createElement('div');
    toast.textContent = '✓ Updated to v' + v;
    toast.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:90%;padding:11px 20px;background:#16a34a;color:#fff;font-size:0.9rem;font-weight:600;border-radius:22px;z-index:10000;box-shadow:0 3px 12px rgba(0,0,0,0.25);transition:opacity .4s;';
    toast.onclick = () => toast.remove();
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; }, 3600);
    setTimeout(() => { toast.remove(); }, 4100);
  }
  try {
    const prevVersion = localStorage.getItem('gym-last-version');
    // First rollout of this feature: the prior build never wrote the key, so treat an existing
    // user (has data) with no recorded version as a just-happened update too. A brand-new install
    // (no data, no version) gets nothing.
    const hasHistory = localStorage.getItem('gym-sessions') || localStorage.getItem('gym-session-wip');
    if (prevVersion !== APP_VERSION && (prevVersion || hasHistory)) showUpdatedToast(APP_VERSION);
    localStorage.setItem('gym-last-version', APP_VERSION);
  } catch (e) { /* non-critical */ }

  // Last-gasp WIP save: flush in-memory session to localStorage before the tab dies.
  // Autosave already writes on every input, so this is insurance against the edge case where
  // a write is still pending (e.g. battery dies seconds after a keystroke) or a DOM-only
  // mutation hasn't been committed yet. On iOS, pagehide fires reliably where unload doesn't.
  function flushWIP() {
    try {
      const wip = State.getWIP();
      if (wip) Data.saveWIP(wip);
    } catch (e) { /* never block teardown */ }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushWIP();
  });
  window.addEventListener('pagehide', flushWIP);
  window.addEventListener('blur', flushWIP);

  // Auto-grow note textareas as you type (covers every .notes-field across all views)
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t && t.classList && t.classList.contains('notes-field')) {
      t.style.height = 'auto';
      t.style.height = t.scrollHeight + 'px';
    }
  });

  // Check for updates on load — fetch self with cache-bust, compare version
  if (location.protocol === 'https:') {
    setTimeout(() => {
      fetch(location.href.split('#')[0] + '?_v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.text())
        .then(html => {
          const match = html.match(/APP_VERSION\s*=\s*'([^']+)'/);
          if (match && match[1] !== APP_VERSION) {
            const banner = document.createElement('div');
            banner.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:10px 16px;background:#2563eb;color:white;font-size:0.85rem;text-align:center;z-index:9999;cursor:pointer;';
            banner.textContent = 'Update available — tap to reload';
            // Unregister the service worker first so the reload fetches the new file from the
            // network instead of the SW serving the stale cached copy (one-reload-behind bug).
            banner.onclick = async () => {
              try {
                if (navigator.serviceWorker) {
                  const regs = await navigator.serviceWorker.getRegistrations();
                  await Promise.all(regs.map(r => r.unregister()));
                }
              } catch (e) { /* fall through to a plain reload */ }
              location.reload();
            };
            document.body.appendChild(banner);
          }
        })
        .catch(() => {}); // silently fail if offline
    }, 2000);
  }

  // Register service worker for offline support
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // Quiet catch-up sweep: anything GitHub hasn't confirmed gets re-pushed on app open. This is what
  // turns "the gym wifi dropped" from a lost backup into a delayed one. Deliberately silent — the
  // home banner already carries the visible truth, and a toast on every launch would train you to
  // ignore it. Delayed so it never competes with first paint.
  function sweepBackups() {
    try {
      if (!Backup.isConfigured()) return;
      if (navigator.onLine === false) return;
      if (Data.getUnbackedSessions().length === 0) return;
      Backup.retryPending().then((r) => {
        // Re-render only if we're sitting on a screen whose state just became stale.
        if (r.done > 0 && (location.hash === '' || location.hash === '#/' || location.hash === '#/settings')) {
          Router.go(location.hash === '#/settings' ? '/settings' : '/');
        }
      }).catch(() => {});
    } catch (e) { /* backup must never break boot */ }
  }
  setTimeout(sweepBackups, 3000);
  // Coming back online mid-session is the other moment a stuck backup can finally land.
  window.addEventListener('online', () => setTimeout(sweepBackups, 1500));
})();
</script>
